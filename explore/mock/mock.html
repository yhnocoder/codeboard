<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeBoard Mock</title>
<style>
/* CodeBoard interactive mock — extends explore/ui-feel/board.html (暖墨 material, spring motion, no-web-feel rules). */
:root {
  color-scheme: light;
  --bg: #eeece6; --surface: #fdfcfa; --head: #f8f6f1;
  --ink: #211f1b; --ink-2: #625e56; --ink-3: #9a958b;
  --line: rgba(60,45,20,.09); --hair: rgba(60,45,20,.16);
  --accent: #b5552d; --accent-ink: #ffffff; --warn: #c48a1f;
  --k-kw: #9a3f22; --k-fn: #2e5d86; --k-str: #4a7536; --k-com: #9a958a; --k-num: #8a6416; --k-self: #7a4f9a; --k-p: #6f6a62;
  --hi: rgba(46,93,134,.16);
  --mark: #3b3833; --mark-ink: #f6f4ef;
  --inote: rgba(60,45,20,.05);
  --hlrow: rgba(60,45,20,.07); --hlbar: #6a655c;
  --chg: rgba(196,138,31,.13); --chg-strong: rgba(196,138,31,.34); --del: rgba(181,85,45,.09); --add: rgba(74,117,54,.10);
  --hatch: rgba(60,45,20,.07);
  --edge: #9a958b;
  --glass: rgba(253,252,250,.94);
  --tip-bg: rgba(34,32,28,.92); --tip-ink: #f6f4ef;
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 rgba(255,255,255,.9), 0 1px 1px rgba(50,35,10,.04), 0 3px 8px -2px rgba(50,35,10,.06), 0 18px 36px -14px rgba(50,35,10,.16);
  --sh-lift: 0 0 0 .5px var(--hair), 0 4px 10px -2px rgba(50,35,10,.1), 0 30px 60px -18px rgba(50,35,10,.3);
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px rgba(50,35,10,.08), 0 10px 28px -8px rgba(50,35,10,.18);

  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --serif: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
  --t: 1;
  --out: cubic-bezier(.2, .8, .2, 1);
  --in: cubic-bezier(.4, 0, 1, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #191816; --surface: #252422; --head: #2a2926;
    --ink: #ece8e0; --ink-2: #aca79d; --ink-3: #78746c;
    --line: rgba(255,240,220,.07); --hair: rgba(255,240,220,.11);
    --accent: #e3895f; --accent-ink: #1d1c1a; --warn: #e0b055;
    --k-kw: #e59572; --k-fn: #86b4de; --k-str: #a3c98c; --k-com: #7d786e; --k-num: #d9b36a; --k-self: #c8a3e6; --k-p: #a39e93;
    --hi: rgba(134,180,222,.2);
    --mark: #d9d4ca; --mark-ink: #1d1c1a;
    --inote: rgba(255,240,220,.05);
    --hlrow: rgba(255,240,220,.07); --hlbar: #aca79d;
    --chg: rgba(224,176,85,.12); --chg-strong: rgba(224,176,85,.32); --del: rgba(227,137,95,.12); --add: rgba(163,201,140,.12);
    --hatch: rgba(255,240,220,.06);
    --edge: #78746c;
    --glass: rgba(42,41,38,.94);
    --tip-bg: rgba(245,243,238,.94); --tip-ink: #1d1c1a;
    --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 rgba(255,245,230,.06), 0 1px 1px rgba(0,0,0,.25), 0 3px 8px -2px rgba(0,0,0,.3), 0 18px 36px -14px rgba(0,0,0,.55);
    --sh-lift: 0 0 0 .5px var(--hair), 0 4px 10px -2px rgba(0,0,0,.4), 0 30px 60px -18px rgba(0,0,0,.75);
    --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px rgba(0,0,0,.35), 0 10px 28px -8px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #191816; --surface: #252422; --head: #2a2926;
  --ink: #ece8e0; --ink-2: #aca79d; --ink-3: #78746c;
  --line: rgba(255,240,220,.07); --hair: rgba(255,240,220,.11);
  --accent: #e3895f; --accent-ink: #1d1c1a; --warn: #e0b055;
  --k-kw: #e59572; --k-fn: #86b4de; --k-str: #a3c98c; --k-com: #7d786e; --k-num: #d9b36a; --k-self: #c8a3e6; --k-p: #a39e93;
  --hi: rgba(134,180,222,.2);
  --mark: #d9d4ca; --mark-ink: #1d1c1a;
  --inote: rgba(255,240,220,.05);
  --hlrow: rgba(255,240,220,.07); --hlbar: #aca79d;
  --chg: rgba(224,176,85,.12); --chg-strong: rgba(224,176,85,.32); --del: rgba(227,137,95,.12); --add: rgba(163,201,140,.12);
  --hatch: rgba(255,240,220,.06);
  --edge: #78746c;
  --glass: rgba(42,41,38,.94);
  --tip-bg: rgba(245,243,238,.94); --tip-ink: #1d1c1a;
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 rgba(255,245,230,.06), 0 1px 1px rgba(0,0,0,.25), 0 3px 8px -2px rgba(0,0,0,.3), 0 18px 36px -14px rgba(0,0,0,.55);
  --sh-lift: 0 0 0 .5px var(--hair), 0 4px 10px -2px rgba(0,0,0,.4), 0 30px 60px -18px rgba(0,0,0,.75);
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px rgba(0,0,0,.35), 0 10px 28px -8px rgba(0,0,0,.55);
}
:root { --row: color-mix(in srgb, var(--accent) 9%, transparent); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sys); -webkit-font-smoothing: antialiased; }
.chrome, .chrome * { user-select: none; -webkit-user-select: none; cursor: default; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input, textarea { font: inherit; color: var(--ink); }

/* ---------- board ---------- */
.board { position: fixed; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); touch-action: none; overscroll-behavior: contain; }
.board:focus { outline: none; }
.board.panning, .board.space { cursor: grab; }
.board.panning * , .board.space * { cursor: grab !important; }
.board.connecting, .board.connecting * { cursor: crosshair !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; width: 1px; height: 1px; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.25; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0;
  transition: stroke-dashoffset calc(var(--t) * 260ms) var(--out), opacity .2s; }
.edge.hidden { stroke-dashoffset: 1; }
.edge.retract { transition-duration: calc(var(--t) * 140ms); transition-timing-function: var(--in); }
.edge.plain { stroke-dasharray: 4 4; stroke-dashoffset: 0; }
.edge.hot { stroke: var(--accent); stroke-width: 1.6; }
.edge.rubber { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; }
.board.linking, .board.linking * { cursor: alias !important; }
.card.drop-cand { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--k-fn) 70%, transparent), var(--sh-card); }
.card.drop-hot { box-shadow: 0 0 0 2.5px var(--k-fn), 0 0 0 6px var(--hi), var(--sh-card); }
.ehit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
.ahead { fill: none; stroke: var(--edge); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; transition: opacity calc(var(--t) * 120ms) linear; }
.ahead.hot { stroke: var(--accent); }
.port { fill: var(--surface); stroke: var(--edge); stroke-width: 1.25; transition: opacity calc(var(--t) * 120ms); }
.hidden-o { opacity: 0; }
.labels { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; }
.elabel { position: absolute; transform: translate(-50%, -50%); font: 11px/1 var(--mono); white-space: nowrap; color: var(--ink-2); background: var(--surface);
  box-shadow: 0 0 0 .5px var(--hair), 0 1px 2px rgba(0,0,0,.05); border-radius: 5px; padding: 4px 7px; pointer-events: auto;
  transition: opacity calc(var(--t) * 160ms) var(--out); }
.elabel.user { font-family: var(--sys); font-size: 11.5px; }
.vchips { position: absolute; transform: translate(-50%, -50%); display: flex; gap: 3px; align-items: center; pointer-events: auto; white-space: nowrap; }
.vchip { font: 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 5px; background: var(--surface); color: var(--ink-2); box-shadow: 0 0 0 .5px var(--hair), 0 1px 2px rgba(0,0,0,.05); }
.vchip:hover, .vchip.on { color: var(--k-fn); box-shadow: 0 0 0 1px var(--k-fn); background: color-mix(in srgb, var(--surface) 80%, var(--hi)); }
.vchip.loop { font-family: var(--sys); color: var(--ink-3); }
.vplus { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink-2);
  box-shadow: 0 0 0 .5px var(--hair), 0 2px 6px rgba(0,0,0,.12); font: 14px/1 var(--sys); pointer-events: auto; opacity: 0; transition: opacity .12s; z-index: 6; }
.vplus.show { opacity: 1; }
.vplus:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- cards ---------- */
.card { position: absolute; isolation: isolate; background: var(--surface); border-radius: 9px; box-shadow: var(--sh-card); transform-origin: 0 18px; display: flex; flex-direction: column;
  transition: box-shadow calc(var(--t) * 160ms) var(--out), scale calc(var(--t) * 260ms) cubic-bezier(.3, 1.35, .5, 1), opacity calc(var(--t) * 240ms) var(--out), filter calc(var(--t) * 240ms); }
.card.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4.5px color-mix(in srgb, var(--accent) 16%, transparent), var(--sh-card); }
.card.lift { scale: 1.012; box-shadow: var(--sh-lift); transition: box-shadow calc(var(--t) * 120ms) var(--out), scale calc(var(--t) * 120ms) var(--out); z-index: 10; }
.card.sel.lift { box-shadow: 0 0 0 1.5px var(--accent), var(--sh-lift); }
.card.dim { opacity: .28; filter: saturate(.4); }
.card.leaving { opacity: 0; scale: .96; transition: opacity calc(var(--t) * 140ms) var(--in), scale calc(var(--t) * 140ms) var(--in); }
.card.ping { animation: ping calc(var(--t) * 700ms) var(--out); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent), var(--sh-card); } 100% { box-shadow: 0 0 0 14px transparent, var(--sh-card); } }
.world.tidying .card { transition: left calc(var(--t) * 340ms) var(--out), top calc(var(--t) * 340ms) var(--out), box-shadow .16s; }
.chead { height: 36px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--head); border-radius: 9px 9px 0 0; }
.step { font: 600 10.5px/1 var(--mono); height: 19px; min-width: 20px; padding: 0 6px; border-radius: 5px; display: inline-grid; place-items: center; background: var(--row); color: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
.subc { font: 10.5px/1 var(--mono); height: 19px; padding: 0 6px; border-radius: 5px; display: inline-grid; place-items: center; color: var(--ink-2); background: var(--hlrow); flex: none; }
.subc:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 12%, transparent); }
.kind { font: italic 600 12px/1 var(--serif); color: var(--ink-3); flex: none; width: 10px; text-align: center; }
.kind.c { font: 600 11px/1 var(--mono); font-style: normal; }
.ctitle { font: 500 12px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; letter-spacing: -0.01em; flex: 0 1 auto; }
.cpath { color: var(--ink-3); font: 10.5px var(--mono); overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; border-radius: 4px; padding: 1px 3px; }
.cpath:hover { color: var(--ink); background: var(--hlrow); }
.rev { display: inline-flex; align-items: center; gap: 3px; font: 10.5px var(--mono); color: var(--ink-3); flex: none; padding: 2px 5px; border-radius: 5px; }
.rev:hover { color: var(--ink); background: var(--hlrow); }
.grow { flex: 1; }
.ib { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); transition: background .1s, color .1s, scale .12s; flex: none; }
.ib:hover, .tbtn:hover, .bname:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.ib:active, .tbtn:active, .bname:active { background: color-mix(in srgb, var(--ink) 12%, transparent); transition: none; scale: .96; }
.ib[disabled] { opacity: .35; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cdesc { padding: 7px 12px 6px; font-size: 12px; line-height: 1.55; color: var(--ink-2); border-bottom: 1px solid var(--line); flex: none; }
.cdesc[contenteditable="true"], .ctitle[contenteditable="true"], .slabel .sname[contenteditable="true"] { user-select: text; -webkit-user-select: text; cursor: text; outline: none; box-shadow: 0 0 0 1.5px var(--accent); border-radius: 3px; background: var(--surface); text-overflow: clip; }
.cdesc:empty { display: none; }
.cdesc[contenteditable="true"]:empty { display: block; min-height: 30px; }
.cbody { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; border-radius: 0 0 9px 9px; }
.card.autoh .cbody { max-height: 460px; }
.grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize !important; z-index: 3; }
.grip::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); border-radius: 0 0 2px 0; opacity: 0; transition: opacity .12s; }
.card:hover .grip::after { opacity: .7; }

/* code */
.code { position: relative; padding: 6px 0 8px; font: 11px/20px var(--mono); min-width: max-content; }
.gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 58px; z-index: 2; pointer-events: none; }
.gutter > * { pointer-events: auto; }
.no { position: absolute; left: 16px; width: 34px; height: 20px; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; opacity: .65; }
.no:hover { opacity: 1; color: var(--ink-2); }
.no.link { color: var(--accent); opacity: 1; }
.no.jump::before { content: ""; position: absolute; left: 6px; right: -4px; top: -1px; border-top: 1px dashed var(--ink-3); opacity: .7; }
.mk { position: absolute; left: 2px; width: 15px; height: 15px; margin-top: 2.5px; border-radius: 3.5px; background: var(--mark); color: var(--mark-ink); font: 600 9.5px/15px var(--sys); text-align: center; z-index: 2; }
.mk:hover, .mk.on { background: var(--accent); color: var(--accent-ink); }
.mkr { position: absolute; left: 9px; width: 1.5px; background: var(--mark); opacity: .45; border-radius: 1px; }
.addn { position: absolute; left: 1px; width: 17px; height: 17px; margin-top: 1.5px; border-radius: 4px; border: 1px dashed var(--ink-2); color: var(--ink-2); font: 13px/14px var(--sys); text-align: center; background: var(--surface); z-index: 3; }
.addn:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.rowbg { position: absolute; left: 0; right: 0; height: 20px; pointer-events: none; z-index: 0; }
.rowbg.origin { background: var(--row); }
.rowbg.hl { background: var(--hlrow); box-shadow: inset 2px 0 0 var(--hlbar); }
.rowbg.flash { animation: flash calc(var(--t) * 600ms) var(--out); }
.rowbg.dropline { background: var(--hi); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 28%, transparent); } 100% { background: var(--row); } }
.src { margin: 0 0 0 58px; padding-right: 24px; font: inherit; white-space: pre; position: relative; z-index: 1; }
.chrome .src, .chrome .src * { user-select: text; -webkit-user-select: text; cursor: text; }
.src .l { height: 20px; }
.src::selection, .src *::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
.chrome .src .gap, .chrome .src .gap *, .chrome .src .inote, .chrome .src .inote * { user-select: none; -webkit-user-select: none; cursor: default; }
.gap { height: 22px; margin: 1px 0; line-height: 22px; font: 11px/22px var(--sys); color: var(--ink-3); background: var(--hlrow); border-top: 1px dashed var(--hair); border-bottom: 1px dashed var(--hair); padding-left: 8px; margin-right: 12px; border-radius: 3px; }
.gap b { font-weight: 500; color: var(--ink-2); padding: 1px 5px; border-radius: 4px; }
.gap b:hover { color: var(--accent); background: var(--row); }
.inote { white-space: normal; font: 12px/1.55 var(--sys); color: var(--ink-2); background: var(--inote); box-shadow: inset 2px 0 0 var(--ink-3); margin: 2px 12px 4px -2px; padding: 5px 10px; border-radius: 0 5px 5px 0; max-width: 520px; }
.kw { color: var(--k-kw); } .fn { color: var(--k-fn); } .str { color: var(--k-str); } .com { color: var(--k-com); font-style: italic; }
.num { color: var(--k-num); } .self { color: var(--k-self); } .p { color: var(--k-p); } .dec { color: var(--k-num); }
.call { text-decoration: underline dotted color-mix(in srgb, var(--k-fn) 60%, transparent); text-underline-offset: 3px; cursor: pointer !important; border-radius: 3px; transition: background calc(var(--t) * 100ms); }
.call:hover { background: color-mix(in srgb, var(--k-fn) 12%, transparent); text-decoration-color: var(--k-fn); }
.src span.pk:hover { background: var(--hlrow); border-radius: 3px; }
.vhl { background: var(--hi) !important; box-shadow: 0 0 0 1px color-mix(in srgb, var(--k-fn) 50%, transparent); border-radius: 3px; }
.wd { background: var(--chg-strong); border-radius: 2px; }

/* text & note */
.card.text { background: transparent; box-shadow: none; border-radius: 4px; padding: 2px 4px; }
.card.text:hover { box-shadow: 0 0 0 1px var(--hair); outline: 1px dashed var(--ink-3); outline-offset: 2px; box-shadow: none; }
.card.text.sel { outline: 1.5px solid var(--accent); outline-offset: 2px; box-shadow: none; }
.card.text .tx { white-space: pre-wrap; word-break: break-word; outline: none; min-height: 1.4em; color: var(--ink); }
.tx.st-title { font: 600 26px/1.25 var(--serif); letter-spacing: -0.01em; }
.tx.st-heading { font: 600 16px/1.4 var(--sys); }
.tx.st-body { font: 13px/1.6 var(--sys); color: var(--ink-2); }
.tx.bold { font-weight: 700; }
.tx[contenteditable] { cursor: text !important; user-select: text !important; -webkit-user-select: text !important; }
.tx[contenteditable]:empty::before { content: attr(data-ph); color: var(--ink-3); }
.tx code, .nbody code, .sn-text code, .inote code { font: 11px var(--mono); background: var(--hlrow); padding: 0 3px; border-radius: 3px; }
.hw { position: absolute; top: 50%; width: 8px; height: 22px; margin-top: -11px; border-radius: 3px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--accent); cursor: ew-resize !important; display: none; }
.card.text.sel .hw { display: block; }
.hw.l { left: -8px; } .hw.r { right: -8px; }
.card.text .ttb { position: absolute; left: 0; top: -44px; display: none; white-space: nowrap; width: max-content; }
.card.text.sel.solo:not(.editing) .ttb { display: inline-flex; }
.card.note .nbody { padding: 10px 14px 12px; font-size: 13px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; word-break: break-word; outline: none; }
.card.note .nbody[contenteditable] { cursor: text !important; user-select: text !important; -webkit-user-select: text !important; }
.card.note .chead .ctitle { font-family: var(--sys); }

/* compare */
.cmp .colh { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); flex: none; background: var(--head); }
.cmp .colh > div { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; min-width: 0; white-space: nowrap; transition: opacity .2s; }
.cmp .colh > div + div { border-left: 1px solid var(--line); }
.cmp .tools { display: inline-flex; gap: 2px; }
.seg2 { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; color: var(--ink-2); }
.seg2:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.seg2.on { color: var(--accent); background: var(--row); }
.crows { font: 11px/20px var(--mono); padding: 4px 0 8px; min-width: max-content; }
.crow { display: grid; grid-template-columns: var(--cw, 1fr) var(--cw, 1fr); min-height: 20px; }
.cl { display: flex; min-width: 0; overflow: hidden; transition: opacity .2s; }
.cl + .cl { border-left: 1px solid var(--line); }
.cl .cno, .urow .cno { flex: none; width: 40px; text-align: right; padding-right: 10px; color: var(--ink-3); opacity: .65; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
.cl .l, .urow .l { white-space: pre; flex: 1; padding-right: 12px; height: 20px; }
.crow.chg .cl { background: var(--chg); }

rom nanovllm.engine.model_runner import ModelRunner","","","class LLMEngine:","","    def __init__(self, model, **kwargs):","        config_fields = {field.name for field in fields(Config)}","        config_kwargs = {k: v for k, v in kwargs.items() if k in config_fields}","        config = Config(model, **config_kwargs)","        Sequence.block_size = config.kvcache_block_size","        self.ps = []","        self.events = []","        ctx = mp.get_context(\"spawn\")","        for i in range(1, config.tensor_parallel_size):","            event = ctx.Event()","            process = ctx.Process(target=ModelRunner, args=(config, i, event))","            process.start()","            self.ps.append(process)","            self.events.append(event)","        self.model_runner = ModelRunner(config, 0, self.events)","        self.tokenizer = AutoTokenizer.from_pretrained(config.model, use_fast=True)","        config.eos = self.tokenizer.eos_token_id","        self.scheduler = Scheduler(config)","        atexit.register(self.exit)","","    def exit(self):","        self.model_runner.call(\"exit\")","        del self.model_runner","        for p in self.ps:","            p.join()","","    def add_request(self, prompt: str | list[int], sampling_params: SamplingParams):","        if isinstance(prompt, str):","            prompt = self.tokenizer.encode(prompt)","        seq = Sequence(prompt, sampling_params)","        self.scheduler.add(seq)","","    def step(self):","        seqs, is_prefill = self.scheduler.schedule()","        num_tokens = sum(seq.num_scheduled_tokens for seq in seqs) if is_prefill else -len(seqs)","        token_ids = self.model_runner.call(\"run\", seqs, is_prefill)","        self.scheduler.postprocess(seqs, token_ids, is_prefill)","        outputs = [(seq.seq_id, seq.completion_token_ids) for seq in seqs if seq.is_finished]","        return outputs, num_tokens","","    def is_finished(self):","        return self.scheduler.is_finished()","","    def generate(","        self,","        prompts: list[str] | list[list[int]],","        sampling_params: SamplingParams | list[SamplingParams],","        use_tqdm: bool = True,","    ) -> list[str]:","        pbar = tqdm(total=len(prompts), desc=\"Generating\", dynamic_ncols=True, disable=not use_tqdm)","        if not isinstance(sampling_params, list):","            sampling_params = [sampling_params] * len(prompts)","        for prompt, sp in zip(prompts, sampling_params):","            self.add_request(prompt, sp)","        outputs = {}","        prefill_throughput = decode_throughput = 0.","        while not self.is_finished():","            t = perf_counter()","            output, num_tokens = self.step()","            if num_tokens > 0:","                prefill_throughput = num_tokens / (perf_counter() - t)","            else:","                decode_throughput = -num_tokens / (perf_counter() - t)","            pbar.set_postfix({","                \"Prefill\": f\"{int(prefill_throughput)}tok/s\",","                \"Decode\": f\"{int(decode_throughput)}tok/s\",","            })","            for seq_id, token_ids in output:","                outputs[seq_id] = token_ids","                pbar.update(1)","        pbar.close()","        outputs = [outputs[seq_id] for seq_id in sorted(outputs.keys())]","        outputs = [{\"text\": self.tokenizer.decode(token_ids), \"token_ids\": token_ids} for token_ids in outputs]","        return outputs"],"engine/model_runner.py":["import pickle","import torch","import torch.distributed as dist","from multiprocessing.synchronize import Event","from multiprocessing.shared_memory import SharedMemory","","from nanovllm.config import Config","from nanovllm.engine.sequence import Sequence","from nanovllm.models.qwen3 import Qwen3ForCausalLM","from nanovllm.layers.sampler import Sampler","from nanovllm.utils.context import set_context, get_context, reset_context","from nanovllm.utils.loader import load_model","","","class ModelRunner:","","    def __init__(self, config: Config, rank: int, event: Event | list[Event]):","        self.config = config","        hf_config = config.hf_config","        self.block_size = config.kvcache_block_size","        self.enforce_eager = config.enforce_eager","        self.world_size = config.tensor_parallel_size","        self.rank = rank","        self.event = event","","        dist.init_process_group(\"nccl\", \"tcp://localhost:2333\", world_size=self.world_size, rank=rank)","        torch.cuda.set_device(rank)","        default_dtype = torch.get_default_dtype()","        torch.set_default_dtype(hf_config.dtype)","        torch.set_default_device(\"cuda\")","        self.model = Qwen3ForCausalLM(hf_config)","        load_model(self.model, config.model)","        self.sampler = Sampler()","        self.warmup_model()","        self.allocate_kv_cache()","        if not self.enforce_eager:","            self.capture_cudagraph()","        torch.set_default_device(\"cpu\")","        torch.set_default_dtype(default_dtype)","","        if self.world_size > 1:","            if rank == 0:","                self.shm = SharedMemory(name=\"nanovllm\", create=True, size=2**20)","                dist.barrier()","            else:","                dist.barrier()","                self.shm = SharedMemory(name=\"nanovllm\")","                self.loop()","","    def exit(self):","        if self.world_size > 1:","            self.shm.close()","            dist.barrier()","            if self.rank == 0:","                self.shm.unlink()","        if not self.enforce_eager:","            del self.graphs, self.graph_pool","        torch.cuda.synchronize()","        dist.destroy_process_group()","","    def loop(self):","        while True:","            method_name, args = self.read_shm()","            self.call(method_name, *args)","            if method_name == \"exit\":","                break","","    def read_shm(self):","        assert self.world_size > 1 and self.rank > 0","        self.event.wait()","        n = int.from_bytes(self.shm.buf[0:4], \"little\")","        method_name, *args = pickle.loads(self.shm.buf[4:n+4])","        self.event.clear()","        return method_name, args","","    def write_shm(self, method_name, *args):","        assert self.world_size > 1 and self.rank == 0","        data = pickle.dumps([method_name, *args])","        n = len(data)","        self.shm.buf[0:4] = n.to_bytes(4, \"little\")","        self.shm.buf[4:n+4] = data","        for event in self.event:","            event.set()","","    def call(self, method_name, *args):","        if self.world_size > 1 and self.rank == 0:","            self.write_shm(method_name, *args)","        method = getattr(self, method_name, None)","        return method(*args)","","    def warmup_model(self):","        torch.cuda.empty_cache()","        torch.cuda.reset_peak_memory_stats()","        max_num_batched_tokens, max_model_len = self.config.max_num_batched_tokens, self.config.max_model_len","        seq_len = min(max_num_batched_tokens, max_model_len)","        num_seqs = min(max_num_batched_tokens // seq_len, self.config.max_num_seqs)","        seqs = [Sequence([0] * seq_len) for _ in range(num_seqs)]","        for seq in seqs:","            seq.num_scheduled_tokens = seq_len","        self.run(seqs, True)","        torch.cuda.empty_cache()","","    def allocate_kv_cache(self):","        config = self.config","        hf_config = config.hf_config","        free, total = torch.cuda.mem_get_info()","        used = total - free","        peak = torch.cuda.memory_stats()[\"allocated_bytes.all.peak\"]","        current = torch.cuda.memory_stats()[\"allocated_bytes.all.current\"]","        num_kv_heads = hf_config.num_key_value_heads // self.world_size","        head_dim = getattr(hf_config, \"head_dim\", hf_config.hidden_size // hf_config.num_attention_heads)","        block_bytes = 2 * hf_config.num_hidden_layers * self.block_size * num_kv_heads * head_dim * hf_config.dtype.itemsize","        config.num_kvcache_blocks = int(total * config.gpu_memory_utilization - used - peak + current) // block_bytes","        assert config.num_kvcache_blocks > 0","        self.kv_cache = torch.empty(2, hf_config.num_hidden_layers, config.num_kvcache_blocks, self.block_size, num_kv_heads, head_dim)","        layer_id = 0","        for module in self.model.modules():","            if hasattr(module, \"k_cache\") and hasattr(module, \"v_cache\"):","                module.k_cache = self.kv_cache[0, layer_id]","                module.v_cache = self.kv_cache[1, layer_id]","                layer_id += 1","","    def prepare_block_tables(self, seqs: list[Sequence]):","        max_len = max(len(seq.block_table) for seq in seqs)","        block_tables = [seq.block_table + [-1] * (max_len - len(seq.block_table)) for seq in seqs]","        block_tables = torch.tensor(block_tables, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        return block_tables","","    def prepare_prefill(self, seqs: list[Sequence]):","        input_ids = []","        positions = []","        cu_seqlens_q = [0]","        cu_seqlens_k = [0]","        max_seqlen_q = 0","        max_seqlen_k = 0","        slot_mapping = []","        block_tables = None","        for seq in seqs:","            start = seq.num_cached_tokens","            seqlen_q = seq.num_scheduled_tokens","            end = start + seqlen_q","            seqlen_k = end","            input_ids.extend(seq[start:end])","            positions.extend(range(start, end))","            cu_seqlens_q.append(cu_seqlens_q[-1] + seqlen_q)","            cu_seqlens_k.append(cu_seqlens_k[-1] + seqlen_k)","            max_seqlen_q = max(seqlen_q, max_seqlen_q)","            max_seqlen_k = max(seqlen_k, max_seqlen_k)","            if not seq.block_table:    # warmup","                continue","            start_block = start // self.block_size","            end_block = (end + self.block_size - 1) // self.block_size","            for i in range(start_block, end_block):","                slot_start = seq.block_table[i] * self.block_size","                if i == start_block:","                    slot_start += start % self.block_size","                if i != end_block - 1:","                    slot_end = seq.block_table[i] * self.block_size + self.block_size","                else:","                    slot_end = seq.block_table[i] * self.block_size + end - i * self.block_size","                slot_mapping.extend(range(slot_start, slot_end))","        if cu_seqlens_k[-1] > cu_seqlens_q[-1]:    # prefix cache","            block_tables = self.prepare_block_tables(seqs)","        input_ids = torch.tensor(input_ids, dtype=torch.int64, pin_memory=True).cuda(non_blocking=True)","        positions = torch.tensor(positions, dtype=torch.int64, pin_memory=True).cuda(non_blocking=True)","        cu_seqlens_q = torch.tensor(cu_seqlens_q, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        cu_seqlens_k = torch.tensor(cu_seqlens_k, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        slot_mapping = torch.tensor(slot_mapping, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        set_context(True, cu_seqlens_q, cu_seqlens_k, max_seqlen_q, max_seqlen_k, slot_mapping, None, block_tables)","        return input_ids, positions","","    def prepare_decode(self, seqs: list[Sequence]):","        input_ids = []","        positions = []","        slot_mapping = []","        context_lens = []","        for seq in seqs:","            input_ids.append(seq.last_token)","            positions.append(len(seq) - 1)","            context_lens.append(len(seq))","            slot_mapping.append(seq.block_table[-1] * self.block_size + seq.last_block_num_tokens  - 1)","        input_ids = torch.tensor(input_ids, dtype=torch.int64, pin_memory=True).cuda(non_blocking=True)","        positions = torch.tensor(positions, dtype=torch.int64, pin_memory=True).cuda(non_blocking=True)","        slot_mapping = torch.tensor(slot_mapping, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        context_lens = torch.tensor(context_lens, dtype=torch.int32, pin_memory=True).cuda(non_blocking=True)","        block_tables = self.prepare_block_tables(seqs)","        set_context(False, slot_mapping=slot_mapping, context_lens=context_lens, block_tables=block_tables)","        return input_ids, positions","","    def prepare_sample(self, seqs: list[Sequence]):","        temperatures = [seq.temperature for seq in seqs]","        temperatures = torch.tensor(temperatures, dtype=torch.float32, pin_memory=True).cuda(non_blocking=True)","        return temperatures","","    @torch.inference_mode()","    def run_model(self, input_ids: torch.Tensor, positions: torch.Tensor, is_prefill: bool):","        if is_prefill or self.enforce_eager or input_ids.size(0) > 512:","            return self.model.compute_logits(self.model(input_ids, positions))","        else:","            bs = input_ids.size(0)","            context = get_context()","            graph = self.graphs[next(x for x in self.graph_bs if x >= bs)]","            graph_vars = self.graph_vars","            graph_vars[\"input_ids\"][:bs] = input_ids","            graph_vars[\"positions\"][:bs] = positions","            graph_vars[\"slot_mapping\"].fill_(-1)","            graph_vars[\"slot_mapping\"][:bs] = context.slot_mapping","            graph_vars[\"context_lens\"].zero_()","            graph_vars[\"context_lens\"][:bs] = context.context_lens","            graph_vars[\"block_tables\"][:bs, :context.block_tables.size(1)] = context.block_tables","            graph.replay()","            return self.model.compute_logits(graph_vars[\"outputs\"][:bs])","","    def run(self, seqs: list[Sequence], is_prefill: bool) -> list[int]:","        input_ids, positions = self.prepare_prefill(seqs) if is_prefill else self.prepare_decode(seqs)","        temperatures = self.prepare_sample(seqs) if self.rank == 0 else None","        logits = self.run_model(input_ids, positions, is_prefill)","        token_ids = self.sampler(logits, temperatures).tolist() if self.rank == 0 else None","        reset_context()","        return token_ids","","    @torch.inference_mode()","    def capture_cudagraph(self):","        config = self.config","        hf_config = config.hf_config","        max_bs = min(self.config.max_num_seqs, 512)","        max_num_blocks = (config.max_model_len + self.block_size - 1) // self.block_size","        input_ids = torch.zeros(max_bs, dtype=torch.int64)","        positions = torch.zeros(max_bs, dtype=torch.int64)","        slot_mapping = torch.zeros(max_bs, dtype=torch.int32)","        context_lens = torch.zeros(max_bs, dtype=torch.int32)","        block_tables = torch.zeros(max_bs, max_num_blocks, dtype=torch.int32)","        outputs = torch.zeros(max_bs, hf_config.hidden_size)","        self.graph_bs = [1, 2, 4, 8] + list(range(16, max_bs + 1, 16))","        self.graphs = {}","        self.graph_pool = None","","        for bs in reversed(self.graph_bs):","            graph = torch.cuda.CUDAGraph()","            set_context(False, slot_mapping=slot_mapping[:bs], context_lens=context_lens[:bs], block_tables=block_tables[:bs])","            outputs[:bs] = self.model(input_ids[:bs], positions[:bs])    # warmup","            with torch.cuda.graph(graph, self.graph_pool):","                outputs[:bs] = self.model(input_ids[:bs], positions[:bs])    # capture","            if self.graph_pool is None:","                self.graph_pool = graph.pool()","            self.graphs[bs] = graph","            torch.cuda.synchronize()","            reset_context()","","        self.graph_vars = dict(","            input_ids=input_ids,","            positions=positions,","            slot_mapping=slot_mapping,","            context_lens=context_lens,","            block_tables=block_tables,","            outputs=outputs,","        )"],"engine/scheduler.py":["from collections import deque","","from nanovllm.config import Config","from nanovllm.engine.sequence import Sequence, SequenceStatus","from nanovllm.engine.block_manager import BlockManager","","","class Scheduler:","","    def __init__(self, config: Config):","        self.max_num_seqs = config.max_num_seqs","        self.max_num_batched_tokens = config.max_num_batched_tokens","        self.eos = config.eos","        self.block_size = config.kvcache_block_size","        self.block_manager = BlockManager(config.num_kvcache_blocks, config.kvcache_block_size)","        self.waiting: deque[Sequence] = deque()","        self.running: deque[Sequence] = deque()","","    def is_finished(self):","        return not self.waiting and not self.running","","    def add(self, seq: Sequence):","        self.waiting.append(seq)","","    def schedule(self) -> tuple[list[Sequence], bool]:","        scheduled_seqs = []","        num_batched_tokens = 0","","        # prefill","        while self.waiting and len(scheduled_seqs) < self.max_num_seqs:","            seq = self.waiting[0]","            remaining = self.max_num_batched_tokens - num_batched_tokens","            if remaining == 0:","                break","            if not seq.block_table:","                num_cached_blocks = self.block_manager.can_allocate(seq)","                if num_cached_blocks == -1:","                    break","                num_tokens = seq.num_tokens - num_cached_blocks * self.block_size","            else:","                num_tokens = seq.num_tokens - seq.num_cached_tokens","            if remaining < num_tokens and scheduled_seqs:  # only allow chunked prefill for the first seq","                break","            if not seq.block_table:","                self.block_manager.allocate(seq, num_cached_blocks)","            seq.num_scheduled_tokens = min(num_tokens, remaining)","            num_batched_tokens += seq.num_scheduled_tokens","            if seq.num_cached_tokens + seq.num_scheduled_tokens == seq.num_tokens:","                seq.status = SequenceStatus.RUNNING","                self.waiting.popleft()","                self.running.append(seq)","            scheduled_seqs.append(seq)","","        if scheduled_seqs:","            return scheduled_seqs, True","","        # decode","        while self.running and len(scheduled_seqs) < self.max_num_seqs:","            seq = self.running.popleft()","            while not self.block_manager.can_append(seq):","                if self.running:","                    self.preempt(self.running.pop())","                else:","                    self.preempt(seq)","                    break","            else:","                seq.num_scheduled_tokens = 1","                seq.is_prefill = False","                self.block_manager.may_append(seq)","                scheduled_seqs.append(seq)","        assert scheduled_seqs","        self.running.extendleft(reversed(scheduled_seqs))","        return scheduled_seqs, False","","    def preempt(self, seq: Sequence):","        seq.status = SequenceStatus.WAITING","        seq.is_prefill = True","        self.block_manager.deallocate(seq)","        self.waiting.appendleft(seq)","","    def postprocess(self, seqs: list[Sequence], token_ids: list[int], is_prefill: bool):","        for seq, token_id in zip(seqs, token_ids):","            self.block_manager.hash_blocks(seq)","            seq.num_cached_tokens += seq.num_scheduled_tokens","            seq.num_scheduled_tokens = 0","            if is_prefill and seq.num_cached_tokens < seq.num_tokens:","                continue","            seq.append_token(token_id)","            if (not seq.ignore_eos and token_id == self.eos) or seq.num_completion_tokens == seq.max_tokens:","                seq.status = SequenceStatus.FINISHED","                self.block_manager.deallocate(seq)","                self.running.remove(seq)"],"engine/sequence.py":["from copy import copy","from enum import Enum, auto","from itertools import count","","from nanovllm.sampling_params import SamplingParams","","","class SequenceStatus(Enum):","    WAITING = auto()","    RUNNING = auto()","    FINISHED = auto()","","","class Sequence:","    block_size = 256","    counter = count()","","    def __init__(self, token_ids: list[int], sampling_params = SamplingParams()):","        self.seq_id = next(Sequence.counter)","        self.status = SequenceStatus.WAITING","        self.token_ids = copy(token_ids)","        self.last_token = token_ids[-1]","        self.num_tokens = len(self.token_ids)","        self.num_prompt_tokens = len(token_ids)","        self.num_cached_tokens = 0","        self.num_scheduled_tokens = 0","        self.is_prefill = True","        self.block_table = []","        self.temperature = sampling_params.temperature","        self.max_tokens = sampling_params.max_tokens","        self.ignore_eos = sampling_params.ignore_eos","","    def __len__(self):","        return self.num_tokens","","    def __getitem__(self, key):","        return self.token_ids[key]","","    @property","    def is_finished(self):","        return self.status == SequenceStatus.FINISHED","","    @property","    def num_completion_tokens(self):","        return self.num_tokens - self.num_prompt_tokens","","    @property","    def prompt_token_ids(self):","        return self.token_ids[:self.num_prompt_tokens]","","    @property","    def completion_token_ids(self):","        return self.token_ids[self.num_prompt_tokens:]","","    @property","    def num_blocks(self):","        return (self.num_tokens + self.block_size - 1) // self.block_size","","    @property","    def last_block_num_tokens(self):","        return self.num_tokens - (self.num_blocks - 1) * self.block_size","","    def block(self, i):","        assert 0 <= i < self.num_blocks","        return self.token_ids[i*self.block_size: (i+1)*self.block_size]","","    def append_token(self, token_id: int):","        self.token_ids.append(token_id)","        self.last_token = token_id","        self.num_tokens += 1","","    def __getstate__(self):","        last_state = self.last_token if not self.is_prefill else self.token_ids","        return (self.num_tokens, self.num_prompt_tokens, self.num_cached_tokens, self.num_scheduled_tokens, self.block_table, last_state)","","    def __setstate__(self, state):","        self.num_tokens, self.num_prompt_tokens, self.num_cached_tokens, self.num_scheduled_tokens, self.block_table, last_state = state","        if isinstance(last_state, list):","            self.token_ids = last_state","            self.last_token = self.token_ids[-1]","        else:","            self.token_ids = []","            self.last_token = last_state"],"layers/activation.py":["import torch","from torch import nn","import torch.nn.functional as F","","","class SiluAndMul(nn.Module):","","    @torch.compile","    def forward(self, x: torch.Tensor) -> torch.Tensor:","        x, y = x.chunk(2, -1)","        return F.silu(x) * y"],"layers/attention.py":["import torch","from torch import nn","import triton","import triton.language as tl","","from flash_attn import flash_attn_varlen_func, flash_attn_with_kvcache","from nanovllm.utils.context import get_context","","","@triton.jit","def store_kvcache_kernel(","    key_ptr,","    key_stride,","    value_ptr,","    value_stride,","    k_cache_ptr,","    v_cache_ptr,","    slot_mapping_ptr,","    D: tl.constexpr,","):","    idx = tl.program_id(0)","    slot = tl.load(slot_mapping_ptr + idx)","    if slot == -1: return","    key_offsets = idx * key_stride + tl.arange(0, D)","    value_offsets = idx * value_stride + tl.arange(0, D)","    key = tl.load(key_ptr + key_offsets)","    value = tl.load(value_ptr + value_offsets)","    cache_offsets = slot * D + tl.arange(0, D)","    tl.store(k_cache_ptr + cache_offsets, key)","    tl.store(v_cache_ptr + cache_offsets, value)","","","def store_kvcache(key: torch.Tensor, value: torch.Tensor, k_cache: torch.Tensor, v_cache: torch.Tensor, slot_mapping: torch.Tensor):","    N, num_heads, head_dim = key.shape","    D = num_heads * head_dim","    assert key.stride(-1) == 1 and value.stride(-1) == 1","    assert key.stride(1) == head_dim and value.stride(1) == head_dim","    assert k_cache.stride(1) == D and v_cache.stride(1) == D","    assert slot_mapping.numel() == N","    store_kvcache_kernel[(N,)](key, key.stride(0), value, value.stride(0), k_cache, v_cache, slot_mapping, D)","","","class Attention(nn.Module):","","    def __init__(","        self,","        num_heads,","        head_dim,","        scale,","        num_kv_heads,","    ):","        super().__init__()","        self.num_heads = num_heads","        self.head_dim = head_dim","        self.scale = scale","        self.num_kv_heads = num_kv_heads","        self.k_cache = self.v_cache = torch.tensor([])","","    def forward(self, q: torch.Tensor, k: torch.Tensor, v: torch.Tensor):","        context = get_context()","        k_cache, v_cache = self.k_cache, self.v_cache","        if k_cache.numel() and v_cache.numel():","            store_kvcache(k, v, k_cache, v_cache, context.slot_mapping)","        if context.is_prefill:","            if context.block_tables is not None:    # prefix cache","                k, v = k_cache, v_cache","            o = flash_attn_varlen_func(q, k, v,","                                       max_seqlen_q=context.max_seqlen_q, cu_seqlens_q=context.cu_seqlens_q,","                                       max_seqlen_k=context.max_seqlen_k, cu_seqlens_k=context.cu_seqlens_k,","                                       softmax_scale=self.scale, causal=True, block_table=context.block_tables)","        else:    # decode","            o = flash_attn_with_kvcache(q.unsqueeze(1), k_cache, v_cache,","                                        cache_seqlens=context.context_lens, block_table=context.block_tables, ","                                        softmax_scale=self.scale, causal=True)","        return o"],"layers/embed_head.py":["import torch","from torch import nn","import torch.nn.functional as F","import torch.distributed as dist","","from nanovllm.utils.context import get_context","","","class VocabParallelEmbedding(nn.Module):","","    def __init__(","        self,","        num_embeddings: int,","        embedding_dim: int,","    ):","        super().__init__()","        self.tp_rank = dist.get_rank()","        self.tp_size = dist.get_world_size()","        assert num_embeddings % self.tp_size == 0","        self.num_embeddings = num_embeddings","        self.num_embeddings_per_partition = self.num_embeddings // self.tp_size","        self.vocab_start_idx = self.num_embeddings_per_partition * self.tp_rank","        self.vocab_end_idx = self.vocab_start_idx + self.num_embeddings_per_partition","        self.weight = nn.Parameter(torch.empty(self.num_embeddings_per_partition, embedding_dim))","        self.weight.weight_loader = self.weight_loader","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor):","        param_data = param.data","        shard_size = param_data.size(0)","        start_idx = self.tp_rank * shard_size","        loaded_weight = loaded_weight.narrow(0, start_idx, shard_size)","        param_data.copy_(loaded_weight)","","    def forward(self, x: torch.Tensor):","        if self.tp_size > 1:","            mask = (x >= self.vocab_start_idx) & (x < self.vocab_end_idx)","            x = mask * (x - self.vocab_start_idx)","        y = F.embedding(x, self.weight)","        if self.tp_size > 1:","            y = mask.unsqueeze(1) * y","            dist.all_reduce(y)","        return y","","","class ParallelLMHead(VocabParallelEmbedding):","","    def __init__(","        self,","        num_embeddings: int,","        embedding_dim: int,","        bias: bool = False,","    ):","        assert not bias","        super().__init__(num_embeddings, embedding_dim)","","    def forward(self, x: torch.Tensor):","        context = get_context()","        if context.is_prefill:","            last_indices = context.cu_seqlens_q[1:] - 1","            x = x[last_indices].contiguous()","        logits = F.linear(x, self.weight)","        if self.tp_size > 1:","            all_logits = [torch.empty_like(logits) for _ in range(self.tp_size)] if self.tp_rank == 0 else None","            dist.gather(logits, all_logits, 0)","            logits = torch.cat(all_logits, -1) if self.tp_rank == 0 else None","        return logits"],"layers/layernorm.py":["import torch","from torch import nn","","","class RMSNorm(nn.Module):","","    def __init__(","        self,","        hidden_size: int,","        eps: float = 1e-6,","    ) -> None:","        super().__init__()","        self.eps = eps","        self.weight = nn.Parameter(torch.ones(hidden_size))","","    @torch.compile","    def rms_forward(","        self,","        x: torch.Tensor,","    ) -> torch.Tensor:","        orig_dtype = x.dtype","        x = x.float()","        var = x.pow(2).mean(dim=-1, keepdim=True)","        x.mul_(torch.rsqrt(var + self.eps))","        x = x.to(orig_dtype).mul_(self.weight)","        return x","","    @torch.compile","    def add_rms_forward(","        self,","        x: torch.Tensor,","        residual: torch.Tensor,","    ) -> tuple[torch.Tensor, torch.Tensor]:","        orig_dtype = x.dtype","        x = x.float().add_(residual.float())","        residual = x.to(orig_dtype)","        var = x.pow(2).mean(dim=-1, keepdim=True)","        x.mul_(torch.rsqrt(var + self.eps))","        x = x.to(orig_dtype).mul_(self.weight)","        return x, residual","","    def forward(","        self,","        x: torch.Tensor,","        residual: torch.Tensor | None = None,","    ) -> torch.Tensor | tuple[torch.Tensor, torch.Tensor]:","        if residual is None:","            return self.rms_forward(x)","        else:","            return self.add_rms_forward(x, residual)"],"layers/linear.py":["import torch","from torch import nn","import torch.nn.functional as F","import torch.distributed as dist","","","def divide(numerator, denominator):","    assert numerator % denominator == 0","    return numerator // denominator","","","class LinearBase(nn.Module):","","    def __init__(","        self,","        input_size: int,","        output_size: int,","        bias: bool = False,","        tp_dim: int | None = None,","    ):","        super().__init__()","        self.tp_dim = tp_dim","        self.tp_rank = dist.get_rank()","        self.tp_size = dist.get_world_size()","        self.weight = nn.Parameter(torch.empty(output_size, input_size))","        self.weight.weight_loader = self.weight_loader","        if bias:","            self.bias = nn.Parameter(torch.empty(output_size))","            self.bias.weight_loader = self.weight_loader","        else:","            self.register_parameter(\"bias\", None)","","    def forward(self, x: torch.Tensor) -> torch.Tensor:","        raise NotImplementedError","","","class ReplicatedLinear(LinearBase):","","    def __init__(","        self,","        input_size: int,","        output_size: int,","        bias: bool = False,","    ):","        super().__init__(input_size, output_size, bias)","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor):","        param.data.copy_(loaded_weight)","","    def forward(self, x: torch.Tensor) -> torch.Tensor:","        return F.linear(x, self.weight, self.bias)","","","class ColumnParallelLinear(LinearBase):","","    def __init__(","        self,","        input_size: int,","        output_size: int,","        bias: bool = False,","    ):","        tp_size = dist.get_world_size()","        super().__init__(input_size, divide(output_size, tp_size), bias, 0)","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor):","        param_data = param.data","        shard_size = param_data.size(self.tp_dim)","        start_idx = self.tp_rank * shard_size","        loaded_weight = loaded_weight.narrow(self.tp_dim, start_idx, shard_size)","        param_data.copy_(loaded_weight)","","    def forward(self, x: torch.Tensor) -> torch.Tensor:","        return F.linear(x, self.weight, self.bias)","","","class MergedColumnParallelLinear(ColumnParallelLinear):","","    def __init__(","        self,","        input_size: int,","        output_sizes: list[int],","        bias: bool = False,","    ):","        self.output_sizes = output_sizes","        super().__init__(input_size, sum(output_sizes), bias)","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor, loaded_shard_id: int):","        param_data = param.data","        shard_offset = sum(self.output_sizes[:loaded_shard_id]) // self.tp_size","        shard_size = self.output_sizes[loaded_shard_id] // self.tp_size","        param_data = param_data.narrow(self.tp_dim, shard_offset, shard_size)","        loaded_weight = loaded_weight.chunk(self.tp_size, self.tp_dim)[self.tp_rank]","        param_data.copy_(loaded_weight)","","","class QKVParallelLinear(ColumnParallelLinear):","","    def __init__(","        self,","        hidden_size: int,","        head_size: int,","        total_num_heads: int,","        total_num_kv_heads: int | None = None,","        bias: bool = False,","    ):","        tp_size = dist.get_world_size()","        total_num_kv_heads = total_num_kv_heads or total_num_heads","        self.head_size = head_size","        self.num_heads = divide(total_num_heads, tp_size)","        self.num_kv_heads = divide(total_num_kv_heads, tp_size)","        output_size = (total_num_heads + 2 * total_num_kv_heads) * self.head_size","        super().__init__(hidden_size, output_size, bias)","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor, loaded_shard_id: str):","        param_data = param.data","        assert loaded_shard_id in [\"q\", \"k\", \"v\"]","        if loaded_shard_id == \"q\":","            shard_size = self.num_heads * self.head_size","            shard_offset = 0","        elif loaded_shard_id == \"k\":","            shard_size = self.num_kv_heads * self.head_size","            shard_offset = self.num_heads * self.head_size","        else:","            shard_size = self.num_kv_heads * self.head_size","            shard_offset = self.num_heads * self.head_size + self.num_kv_heads * self.head_size","        param_data = param_data.narrow(self.tp_dim, shard_offset, shard_size)","        loaded_weight = loaded_weight.chunk(self.tp_size, self.tp_dim)[self.tp_rank]","        param_data.copy_(loaded_weight)","","","class RowParallelLinear(LinearBase):","","    def __init__(","        self,","        input_size: int,","        output_size: int,","        bias: bool = False,","    ):","        tp_size = dist.get_world_size()","        super().__init__(divide(input_size, tp_size), output_size, bias, 1)","","    def weight_loader(self, param: nn.Parameter, loaded_weight: torch.Tensor):","        param_data = param.data","        if param_data.ndim == 1:","            param_data.copy_(loaded_weight)","            return","        shard_size = param_data.size(self.tp_dim)","        start_idx = self.tp_rank * shard_size","        loaded_weight = loaded_weight.narrow(self.tp_dim, start_idx, shard_size)","        param_data.copy_(loaded_weight)","","    def forward(self, x: torch.Tensor) -> torch.Tensor:","        y = F.linear(x, self.weight, self.bias if self.tp_rank == 0 else None)","        if self.tp_size > 1:","            dist.all_reduce(y)","        return y"],"layers/rotary_embedding.py":["from functools import lru_cache","import torch","from torch import nn","","","def apply_rotary_emb(","    x: torch.Tensor,","    cos: torch.Tensor,","    sin: torch.Tensor,",") -> torch.Tensor:","    x1, x2 = torch.chunk(x.float(), 2, dim=-1)","    y1 = x1 * cos - x2 * sin","    y2 = x2 * cos + x1 * sin","    return torch.cat((y1, y2), dim=-1).to(x.dtype)","","","class RotaryEmbedding(nn.Module):","","    def __init__(","        self,","        head_size: int,","        rotary_dim: int,","        max_position_embeddings: int,","        base: float,","    ) -> None:","        super().__init__()","        self.head_size = head_size","        assert rotary_dim == head_size","        inv_freq = 1.0 / (base**(torch.arange(0, rotary_dim, 2, dtype=torch.float) / rotary_dim))","        t = torch.arange(max_position_embeddings, dtype=torch.float)","        freqs = torch.einsum(\"i,j -> ij\", t, inv_freq)","        cos = freqs.cos()","        sin = freqs.sin()","        cache = torch.cat((cos, sin), dim=-1).unsqueeze_(1)","        self.register_buffer(\"cos_sin_cache\", cache, persistent=False)","","    @torch.compile","    def forward(","        self,","        positions: torch.Tensor,","        query: torch.Tensor,","        key: torch.Tensor,","    ) -> tuple[torch.Tensor, torch.Tensor]:","        cos_sin = self.cos_sin_cache[positions]","        cos, sin = cos_sin.chunk(2, dim=-1)","        query = apply_rotary_emb(query, cos, sin)","        key = apply_rotary_emb(key, cos, sin)","        return query, key","","","@lru_cache(1)","def get_rope(","    head_size: int,","    rotary_dim: int,","    max_position: int,","    base: float,","):","    rotary_emb = RotaryEmbedding(head_size, rotary_dim, max_position, base)","    return rotary_emb"],"layers/sampler.py":["import torch","from torch import nn","","","class Sampler(nn.Module):","","    @torch.compile","    def forward(self, logits: torch.Tensor, temperatures: torch.Tensor):","        logits = logits.float().div_(temperatures.unsqueeze(dim=1))","        probs = torch.softmax(logits, dim=-1)","        sample_tokens = probs.div_(torch.empty_like(probs).exponential_(1).clamp_min_(1e-10)).argmax(dim=-1)","        return sample_tokens"],"llm.py":["from nanovllm.engine.llm_engine import LLMEngine","","","class LLM(LLMEngine):","    pass"],"models/qwen3.py":["import torch","from torch import nn","import torch.distributed as dist","from transformers import Qwen3Config","","from nanovllm.layers.activation import SiluAndMul","from nanovllm.layers.attention import Attention","from nanovllm.layers.layernorm import RMSNorm","from nanovllm.layers.linear import QKVParallelLinear, MergedColumnParallelLinear, RowParallelLinear","from nanovllm.layers.rotary_embedding import get_rope","from nanovllm.layers.embed_head import VocabParallelEmbedding, ParallelLMHead","","","class Qwen3Attention(nn.Module):","","    def __init__(","        self,","        hidden_size: int,","        num_heads: int,","        num_kv_heads: int,","        max_position: int = 4096 * 32,","        head_dim: int | None = None,","        rms_norm_eps: float = 1e-06,","        qkv_bias: bool = False,","        rope_theta: float = 10000,","        rope_scaling: dict | None = None,","    ) -> None:","        super().__init__()","        tp_size = dist.get_world_size()","        self.total_num_heads = num_heads","        assert self.total_num_heads % tp_size == 0","        self.num_heads = self.total_num_heads // tp_size","        self.total_num_kv_heads = num_kv_heads","        assert self.total_num_kv_heads % tp_size == 0","        self.num_kv_heads = self.total_num_kv_heads // tp_size","        self.head_dim = head_dim or hidden_size // self.total_num_heads","        self.q_size = self.num_heads * self.head_dim","        self.kv_size = self.num_kv_heads * self.head_dim","        self.scaling = self.head_dim ** -0.5","        self.qkv_bias = qkv_bias","","        self.qkv_proj = QKVParallelLinear(","            hidden_size,","            self.head_dim,","            self.total_num_heads,","            self.total_num_kv_heads,","            bias=qkv_bias,","        )","        self.o_proj = RowParallelLinear(","            self.total_num_heads * self.head_dim,","            hidden_size,","            bias=False,","        )","        if isinstance(rope_scaling, dict):","            rope_theta = rope_scaling.get(\"rope_th // ---------- flows: Call links form trees; numbering 1, 1.1, 1.2.1; A·/B· prefix when >1 tree ----------
function computeFlows() {
  const cards = S.cards, parent = {}, kids = {};
  const isNode = id => cards[id] && cards[id].kind === 'code';
  for (const L of S.links) {
    if (L.t !== 'call' || !isNode(L.a) || !isNode(L.b) || L.a === L.b || parent[L.b]) continue;
    let p = L.a, cyc = false;
    while (p) { if (p === L.b) { cyc = true; break; } p = parent[p] && parent[p].a; }
    if (cyc) continue;

  }
  for (const k in kids) kids[k].sort((x, y) => x.l - y.l || x.c0 - y.c0 || x.n - y.n);
  const roots = Object.values(cards).filter(c => c.kind === 'code' && !parent[c.id] && (kids[c.id] || c.flow)).sort((a, b) => a.n - b.n).map(c => c.id);
  const num = {}, tree = {}, order = {};
  // root shows a letter (A, B…); its children are numbered from 1 (1, 2, 2.1 …); with >1 tree children get "A·"
  roots.forEach((r, i) => {
    const letter = String.fromCharCode(65 + i), pre = roots.length > 1 ? letter + '·' : '';
    order[r] = [];
    const walk = (id, label) => { num[id] = label ? pre + label : letter; tree[id] = r; order[r].push(id); (kids[id] || []).forEach((L, j) => walk(L.b, label ? label + '.' + (j + 1) : String(j + 1))); };
    walk(r, '');

  for (const s of S.sects) if (s.col) s.ids.forEach(i => h.add(i));
  // a compare card is hidden only if both columns are

function openVars(lid) {

  popEl.style.width = '300px';
  const anchor = () => { const gg = edgeEls[lid]; if (!gg) return null; return { x: gg.mx * cam.k.v + cam.x.v + 14, y: gg.my * cam.k.v + cam.y.v, w: 0, h: 6 }; };

  popEl.onclick = null; popEl.onkeydown = null;

}
function rowEl(cardId, line) {

function hiVar(lid, k, on) {

    if (B) for (let l = B.s; l <= Math.min(B.e, B.s + 8); l++) { const r = rowEl(B.id, l); if (r) $$('[data-c0]', r).forEach(s => { if (s.textContent === param) s.classList.add('vhl'); }); if (/\)\s*(->.*)?:\s*$/.test(NV.files[B.f][l - 1])) break; }

labelsL.addEventListener('pointerover', e => { const ch = e.target.closest('.vchip[data-k]'); if (ch) hiVar(ch.closest('.vchips').dataset.link, ch.dataset.k, true); });

// ---------- Add Function… (place a function / class card at viewport centre) ----------
function openSearch(w) {
  closeAllPops();
  popEl.innerHTML = `<div class="pb"><input class="fld" placeholder="Search functions and classes…  e.g. run, prepare_decode"><div class="sres"></div></div><div class="pf" style="font-size:11px;color:var(--ink-3)">Enter: Place on Board · Esc: Close</div>`;
  popEl.style.width = '440px';
  popAnchor = null; openPop(popEl);
  const W = board.clientWidth; popEl.style.left = (W - 440) / 2 + 'px'; popEl.style.top = '70px';
  const inp = popEl.querySelector('input'), res = popEl.querySelector('.sres');
  let hits = [], hi = 0;
  const draw = () => { res.innerHTML = hits.map((id, i) => `<button class="cand${i === hi ? ' on' : ''}" data-sid="${id}"><span class="kind ${SYMS[id].k === 'c' ? 'c' : ''}">${glyph(SYMS[id].k)}</span><code>${esc(SYMS[id].q)}</code><span class="loc">${SYMS[id].f}:${SYMS[id].dl}</span></button>`).join(''); };
  const go = sid => {
    closePop();
    const { w: vw, h: vh } = view(); const ctr = w && w.x != null ? w : toWorld(vw / 2 - 260, vh / 2 - 160);
    let nc; mut(() => { nc = addCard(codeCard(sid)); nc.x = ctr.x; nc.y = ctr.y; avoidOverlap(nc); });
    select(nc.id); const el = cardEl(nc.id); if (el) el.classList.add('ping'); revealCard(nc.id, false);
  };
  inp.oninput = () => { const q = inp.value.trim().toLowerCase(); hits = q ? Object.keys(SYMS).filter(id => SYMS[id].q.toLowerCase().includes(q)).sort((a, b) => (SYMS[a].n.toLowerCase().startsWith(q) ? 0 : 1) - (SYMS[b].n.toLowerCase().startsWith(q) ? 0 : 1) || SYMS[a].q.length - SYMS[b].q.length).slice(0, 8) : []; hi = 0; draw(); };
  popEl.onkeydown = e => { e.stopPropagation(); if (e.key === 'Escape') closePop(); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hi = clamp(hi + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, hits.length - 1)); draw(); } if (e.key === 'Enter' && hits[hi]) go(hits[hi]); };
  popEl.onclick = e => { const b = e.target.closest('[data-sid]'); if (b) go(b.dataset.sid); };
  popEl.onchange = null;
  inp.focus({ preventScroll: true });
}

board.addEventListener('click', ev => {
  if (ev.target.closest(UI) || swallowClick) return;

  if (call) { const s = getSelection(); if (s && !s.isCollapsed && s.toString().length > 1) return; onCallClick(call); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const ce = b.closest('.card'), id = ce && ce.dataset.id, c = id && S.cards[id];
  const act = b.dataset.act;
  if (act === 'open') { const cc = b.dataset.colOpen ? S.cards[b.dataset.colOpen] : c; if (cc) openInEditor(cc.f, cc.s); }
  else if (act === 'menu') { if (!sel.has(id) || sel.size > 1) select(id); const r = rectB(b); openCtx(cardMenu(id), r.x + r.w - 210, r.y + r.h + 4); }
  else if (act === 'commit') {
    const cc = b.dataset.cid ? S.cards[b.dataset.cid] : c, r = rectB(b);
    openCtx([{ head: `Commits Touching ${cc.title}` }, { label: `${COMMIT}  Merge pull request #218`, kbd: 'Pinned', check: true, act: () => { } }, null,
      { label: 'Compare with…', disabled: true, why: 'Only one commit (bb823b3) is available in this mock' }, { label: 'Enter Commit / Branch / Tag…', disabled: true }], r.x, r.y + r.h + 4);
  }
  else if (act === 'expandsub') mut(() => { c.sub = false; });
  else if (act === 'showgap') { const g = b.closest('.gap'), a = +g.dataset.a; mut(() => { c.hid = c.hid.filter(h => h[0] !== a); }); }
  else if (act === 'addnote') openAddNote(lineSel);
  else if (act === 'tst') mut(() => { c.st = b.dataset.v; });
  else if (act === 'tbold') mut(() => { c.bold = !c.bold; });
  else if (act === 'tbg') mut(() => { c.bg = true; c.w = Math.max(c.w, 260); });
  else if (act === 'cswap') mut(() => { c.cols.reverse(); });
  else if (act === 'cuni') mut(() => { c.uni = !c.uni; });
  else if (act === 'csame') mut(() => { c.same = !c.same; });
  else if (act === 'scol') { const s = S.sects.find(x => x.id === b.closest('.slabel').dataset.sect); if (s) toggleSect(s); }
});

// =====================================================================
// Walkthrough: one call tree, in number order
// =====================================================================
const presentEl = $('#present'), btnWalk = $('#btnWalk');
let walk = null;
function startWalk() {
  closeAllPops();
  if (walk) return exitWalk();
  const pick = selCards().find(c => c.kind === 'code' || c.kind === 'compare');
  let id = pick ? (pick.kind === 'compare' ? pick.cols.find(x => F.tree[x]) : pick.id) : null;
  if (!id || !F.tree[id]) {
    if (!pick && F.roots.length === 1) id = F.roots[0];
    else return toast(pick ? 'This card is not in a call flow.' : 'Select a card in a flow first, then press P.');
  }
  const root = F.tree[id], list = F.order[root].filter(x => !hiddenIds.has(x));
  walk = { root, list, i: Math.max(0, list.indexOf(id)), saved: { x: cam.x.t, y: cam.y.t, k: cam.k.t } };
  presentEl.classList.add('on'); btnWalk.classList.add('on');
  showStep(walk.i);
}
function showStep(i) {
  if (!walk) return;
  const n = walk.list.length; walk.i = (i + n) % n;
  applyWalk();
  const cur = walk.list[walk.i], el = cardEl(topId(cur)); if (!el) return;
  // only the camera moves: frame the current card (plus the line its Call link comes from, if that still fits); never enlarge cards
  const c = S.cards[topId(cur)];
  let r = { x: c.x - 24, y: c.y - 24, w: el.offsetWidth + 48, h: el.offsetHeight + 48 };
  const L = F.parent[cur], p = L && anchorLine(L.a, L.l);
  if (p) { const u = union([r, { x: p.x - 60, y: p.y - 30, w: 80, h: 60 }]); if (fitRect(u, 1).k >= 0.6) r = u; }
  const f = fitRect(r, 1); camTo(f.x, f.y, f.k, true);
}
function applyWalk() {
  $$('.cdimcol').forEach(n => n.classList.remove('cdimcol'));
  if (!walk) {
    for (const el of cardsL.querySelectorAll('.card')) el.classList.remove('dim');
    for (const id in edgeEls) { const g = edgeEls[id]; [g.path, g.head, g.port, g.chips, g.lab].forEach(n => n && (n.style.opacity = '')); }
    $$('.sect', world).forEach(s => s.style.opacity = '');
    return;
  }
  walk.list = walk.list.filter(x => S.cards[x]);
  if (!walk.list.length) return exitWalk(true);
  const cur = walk.list[walk.i % walk.list.length], top = topId(cur);
  for (const el of cardsL.querySelectorAll('.card')) el.classList.toggle('dim', el.dataset.id !== top);
  const c = S.cards[cur];
  if (c.cmp) { const k = S.cards[c.cmp], other = k.cols.find(x => x !== cur); $$(`[data-col="${other}"]`, cardEl(top)).forEach(n => n.classList.add('cdimcol')); }
  for (const id in edgeEls) { const g = edgeEls[id], on = g.L.a === cur || g.L.b === cur; [g.path, g.head, g.port, g.chips, g.lab].forEach(n => n && (n.style.opacity = on ? '' : .18)); }
  $$('.sect', world).forEach(s => s.style.opacity = .3);
  $('#pNum').textContent = F.num[cur] || '';
  $('#pTitle').textContent = c.title;
  $('#pCnt').textContent = `${walk.i + 1} / ${walk.list.length}`;
}
function exitWalk(silent) {
  if (!walk) return;
  const s = walk.saved; walk = null;
  presentEl.classList.remove('on'); btnWalk.classList.remove('on');
  applyWalk();
  if (!silent) camTo(s.x, s.y, s.k, true);
}
btnWalk.onclick = () => walk ? exitWalk() : startWalk();
$('#pNext').onclick = () => showStep(walk.i + 1);
$('#pPrev').onclick = () => showStep(walk.i - 1);
$('#pExit').onclick = () => exitWalk();

// =====================================================================
// Keyboard
// =====================================================================
const editingNow = e => { const t = e.target; return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); };
document.addEventListener('keydown', ev => {
  if (ev.key === 'Meta' || ev.key === 'Control') {
    modHeld = true;
    if (peekState && peekEl.classList.contains('open')) pinPeek();
    if (snState && snEl.classList.contains('open') && !snState.pinned) showSnpop(snState.mk, true);
  }
  if (editingNow(ev)) return;
  const mod = ev.metaKey || ev.ctrlKey, k = ev.key, kl = k.toLowerCase();
  if (k === ' ' && !mod) { spaceHeld = true; board.classList.add('space'); ev.preventDefault(); return; }
  if (k === 'Escape') {
    if (ctx.classList.contains('open')) return closeCtx();
    if (popEl.classList.contains('open')) return closePop();
    if (peekEl.classList.contains('open') || snEl.classList.contains('open') || $('.pinned-peek')) { hidePeek(true); hideSnpop(true); $$('.pinned-peek').forEach(n => n.remove()); return; }
    if ($('#keys').classList.contains('open')) return toggleKeys(false);
    if (connectFrom) { endConnect(); return toast('Connect cancelled'); }
    if (walk) return exitWalk();
    select(null); getSelection().removeAllRanges(); return;
  }
  if (walk && (k === 'ArrowRight' || k === 'ArrowDown')) { ev.preventDefault(); return showStep(walk.i + 1); }
  if (walk && (k === 'ArrowLeft' || k === 'ArrowUp')) { ev.preventDefault(); return showStep(walk.i - 1); }
  if (mod && kl === 'z') { ev.preventDefault(); return ev.shiftKey ? redo() : undo(); }
  if (mod && kl === 'y') { ev.preventDefault(); return redo(); }
  if (mod && kl === 'a') { ev.preventDefault(); return selectAll(); }
  if (mod && kl === 'd') { ev.preventDefault(); return duplicateSel(); }
  if (mod && kl === 'k') { ev.preventDefault(); return openSearch(); }
  if (mod && k === '0') { ev.preventDefault(); return fitAll(); }
  if (mod && k === '1') { ev.preventDefault(); const { w, h } = view(); return camTo(w / 2 - (w / 2 - cam.x.t) / cam.k.t, h / 2 - (h / 2 - cam.y.t) / cam.k.t, 1); }
  if (mod && (k === '=' || k === '+')) { ev.preventDefault(); return zoomBy(1.25); }
  if (mod && k === '-') { ev.preventDefault(); return zoomBy(0.8); }
  if (mod && kl === 'c') { const s = getSelection(); if (s && !s.isCollapsed) return; /* native copy of code text */ const c = selCards().find(x => x.kind === 'code'); if (c) { ev.preventDefault(); copyText(NV.files[c.f].slice(c.s - 1, c.e).join('\n'), 'Copied code'); } return; }
  if (mod) return;
  if (k === 'Delete' || k === 'Backspace') { ev.preventDefault(); if (lineSel && !sel.size) return; return deleteSel(); }
  if (k === '!' || (ev.shiftKey && ev.code === 'Digit1')) return fitAll();
  if (k === '?') return toggleKeys();
  if (kl === 's' && lineSel) { ev.preventDefault(); return openAddNote(lineSel); }
  if (kl === 's') return toast('Select lines in a code card first');
  if (kl === 'h' && lineSel) { ev.preventDefault(); return hideLines(lineSel.id, lineSel.a, lineSel.b); }
  if (kl === 't' || kl === 'n') { ev.preventDefault(); const w = toWorld(lastPtr.x, lastPtr.y); return newText(w.x, w.y, kl === 'n'); }
  if (kl === 'p') return startWalk();
  if (k === 'Enter') { const c = selCards()[0]; if (c && c.kind === 'code') openInEditor(c.f, c.s); else if (c && c.kind === 'text') editText(c.id); }
});
document.addEventListener('keyup', ev => {
  if (ev.key === ' ') { spaceHeld = false; board.classList.remove('space'); }
  if (ev.key === 'Meta' || ev.key === 'Control') modHeld = false;
});
window.addEventListener('blur', () => { spaceHeld = false; modHeld = false; board.classList.remove('space'); });

// =====================================================================
// Tooltips (from base): 500ms first time, then instant while sliding between buttons
// =====================================================================
const tip = $('#tip'); let tipTimer, warmUntil = 0;
function showTip(b) {
  const r = b.getBoundingClientRect(), s = board.getBoundingClientRect(), below = r.top - s.top < 60;
  tip.innerHTML = `${esc(b.dataset.tip)}${b.dataset.kbd ? `<kbd>${esc(b.dataset.kbd)}</kbd>` : ''}`;
  tip.style.left = clamp(r.left + r.width / 2 - s.left, 60, s.width - 60) + 'px';
  tip.style.top = (below ? r.bottom - s.top + 8 : r.top - s.top - 30) + 'px';
  tip.classList.add('show');
}
function hideTip() { clearTimeout(tipTimer); if (tip.classList.contains('show')) warmUntil = performance.now() + 800; tip.classList.remove('show'); }
board.addEventListener('pointerover', e => {
  const b = e.target.closest('[data-tip]'); if (!b || drag) return;
  clearTimeout(tipTimer);
  if (tip.classList.contains('show') || performance.now() < warmUntil) showTip(b); else tipTimer = setTimeout(() => showTip(b), 500);
});
board.addEventListener('pointerout', e => { const b = e.target.closest('[data-tip]'); if (b && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'))) hideTip(); });
board.addEventListener('pointerdown', () => { hideTip(); warmUntil = 0; }, true);

// =====================================================================

const KEYS = [
  ['Board', [['Click a dotted call', 'Expand: new callee card + Call link'], ['Drag a dotted call', 'Drop on a card: link it · on canvas: new card there'], ['Right-click a call', 'Link to Existing Card…'], ['Hover a name', 'Definition peek (⌘-hover pins)'], ['Drag title bar', 'Move card'], ['Drag empty canvas', 'Marquee select'], ['Space + Drag', 'Pan'], ['Scroll / two fingers', 'Pan'], [`${K.mod}Scroll / pinch`, 'Zoom'], ['Double-click canvas', 'New Text'], ['⇧Click', 'Add to selection']]],
  ['Lines (select code first)', [['S', 'Add Sidenote'], ['H', 'Hide Lines'], ['Click line number', 'Select line (⇧ extends)'], ['Right-click', 'Line menu: Highlight, Copy…']]],
  ['Commands', [['T', 'New Text'], ['N', 'New Note'], [`${K.mod}K`, 'Add Function…'], ['P', 'Walk Through Flow'], ['← →', 'Previous / Next step'], ['Esc', 'Close popup / Exit / Clear selection'], ['Delete ⌫', 'Delete selection'], [`${K.mod}A`, 'Select All Cards'], [`${K.mod}D`, 'Duplicate (no links, no number)'], [`${K.mod}Z  ${K.shift}${K.mod}Z`, 'Undo / Redo'], ['Enter', 'Open in Editor'], [`${K.shift}1  ${K.mod}0`, 'Fit to Window'], [`${K.mod}1`, 'Zoom to 100%'], ['?', 'This panel']]],
];
function toggleKeys(on) {
  const k = $('#keys'); on = on ?? !k.classList.contains('open');
  if (on) k.innerHTML = `<h3>Keyboard Shortcuts<span class="grow"></span><button class="ib" id="keysX" aria-label="Close">×</button></h3>` + KEYS.map(([h, rows]) => `<h4>${h}</h4><table>${rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>`).join('');
  k.classList.toggle('open', on);
  if (on) $('#keysX').onclick = () => toggleKeys(false);
}
$('#btnKeys').onclick = () => toggleKeys();
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#btnReset').onclick = () => { resetDemo(); toast('Board reset to the starting state'); };

// =====================================================================
// Start
// =====================================================================
function initialCamera() {
  const rs = [...cardsL.querySelectorAll('.card')].map(el => rectW(el));
  const u = union(rs), { w, h } = view();
  const k = clamp(Math.min((w - 96) / u.w, (h - 140) / u.h), 0.62, 1);
  camSet(Math.max(48, (w - u.w * k) / 2) - u.x * k, 70 - u.y * k, k);
}
function resetDemo() {
  exitWalk(true); closeAllPops(); $$('.pinned-peek').forEach(n => n.remove());
  lsDel(); sel.clear(); undoS.length = 0; redoS.length = 0; lineSel = null;
  startState(); render(); updUndo(); initialCamera();
}
function init() {
  let ok = false;
  const saved = lsGet();
  if (saved) { try { const s = JSON.parse(saved); if (s && s.v === 1 && s.cards && Object.keys(s.cards).length) { S = s; ok = true; } } catch (e) { ok = false; } }
  if (!ok) startState();
  render(); updUndo();
  initialCamera();
  window.CB = { get S() { return S; }, camSet, fitAll, render, expandTo, startWalk, exitWalk, selectAll, select, sel, F: () => F, cam, toWorld, undo, redo, resetDemo };
}
init();
// the board is overflow:hidden; never let focus() or scrollIntoView shift it
board.addEventListener('scroll', () => { if (board.scrollLeft || board.scrollTop) { board.scrollLeft = 0; board.scrollTop = 0; } });
let rsT; new ResizeObserver(() => { clearTimeout(rsT); rsT = setTimeout(redrawEdges, 60); }).observe(board);

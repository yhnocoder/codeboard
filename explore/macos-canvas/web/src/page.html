<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="page.css">
<style>
  :root {
    --ink: #211f1b; --ink-2: #625e56; --ink-3: #8f8a80; --surface: #fdfcfa; --hlrow: #f3f0e9;
    --hair: rgba(60, 45, 20, .16); --line: rgba(60, 45, 20, .22); --accent: #b4532a; --accent-ink: #fff;
    --warn: #b3261e; --k-fn: #2f5f9e; --sh-float: 0 6px 24px rgba(0, 0, 0, .14);
    --sys: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; --mono: "SF Mono", Menlo, monospace;
    --md-fs: 13.5px;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  html { overflow: hidden; }  /* body stays visible: it must not clip the Note when the editor scales it */
  #note { box-sizing: border-box; padding: 10px; color: var(--ink); font-family: var(--sys); line-height: 1.6; }
  #note.card { background: var(--surface); }
  #note.still, #note.still * { caret-color: transparent !important; }
  #note.bare { padding: 0; background: transparent; }
</style>
</head>
<body><div id="note" class="md"></div><script src="page.js"></script></body>
</html>

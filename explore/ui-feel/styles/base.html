<title>%%TITLE%%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="%%FONTS%%">
<style>
/* 页面外框：上方切换条；左边模拟 VS Code 半屏 webview 里的白板，右边是这种风格的取舍 */
:root {
  color-scheme: light;
  --page: light-dark(#f5f4f1, #141413);
  --page-ink: light-dark(#23211d, #ecebe7);
  --page-ink-2: light-dark(#6a665e, #a19d95);
  --page-hair: light-dark(rgba(40,30,10,.12), rgba(255,250,240,.1));
  --seg-bg: light-dark(rgba(40,30,10,.06), rgba(255,250,240,.07));
  --seg-on: light-dark(#ffffff, #3a3936);
  --vs-tabs: light-dark(#f3f3f3, #252526);
  --vs-tab-on: light-dark(#ffffff, #1e1e1e);
  --vs-ink: light-dark(#333333, #cccccc);
  --vs-ink-2: light-dark(#8a8a8a, #8b8b8b);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
/* 页面里的「浅 / 深」按钮：宿主会改写 html 上的 data-theme，所以设在 body 上 */
body[data-mode="dark"] { color-scheme: dark; }
body[data-mode="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font: 13px/1.5 var(--sys); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.chrome, .chrome * { user-select: none; -webkit-user-select: none; cursor: default; -webkit-user-drag: none; }
.chrome .src, .chrome .src * { user-select: text; -webkit-user-select: text; cursor: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.chrome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
header h1 { font: 600 17px/1.2 var(--sys); margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--page-ink-2); font-size: 12.5px; }
.grow { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border-radius: 8px; background: var(--seg-bg); gap: 2px; }
.seg button { padding: 3px 11px; border-radius: 6px; font-size: 12.5px; color: var(--page-ink-2); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--page-ink); box-shadow: 0 0 0 .5px var(--page-hair), 0 1px 2px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--page-ink-2); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 24px; align-items: start; }
@media (max-width: 940px) { .main { grid-template-columns: minmax(0, 1fr); } }
.frame { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px var(--page-hair), 0 12px 40px -16px light-dark(rgba(40,30,10,.25), rgba(0,0,0,.7)); min-width: 0; }
.tabs { height: 34px; background: var(--vs-tabs); display: flex; align-items: stretch; font-size: 12.5px; color: var(--vs-ink-2); }
.tabs .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.tabs .tab.on { background: var(--vs-tab-on); color: var(--vs-ink); }

/* ---------- 白板骨架：只管位置，长相交给各风格 ---------- */
.board { position: relative; height: 640px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); }
@media (max-width: 600px) { .board { height: 540px; } }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; width: 1px; height: 1px; }
.card { position: absolute; overflow: hidden; }
.cband, .cname, .cmeta, .cnote, .cfoot, .cside, .caption, .rail, .dim, .eyebrow, .prog, .lab, .frame-deco, .scene { display: none; }
.scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chead { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ctitle, .cpath { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cpath { flex: 1 1 0; }
.rev { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.code { white-space: pre; }
.code { display: flex; position: relative; }
/* 代码是一整段 <pre>：选区连续，复制出来就是原文；行号在旁边单独一列，选不中 */
.gutter { flex: none; position: relative; z-index: 1; }
.gutter .no { display: block; text-align: right; font-variant-numeric: tabular-nums; }
.src { flex: 1; min-width: 0; margin: 0; padding: 0; font: inherit; color: inherit; white-space: pre; overflow: clip; position: relative; z-index: 1;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.src::selection, .src *::selection { background: var(--selbg, color-mix(in srgb, var(--accent, #c15f3c) 26%, transparent)); }
.hlrow { position: absolute; left: 0; right: 0; pointer-events: none; }
.elabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.caption { position: absolute; }
.over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.tb-left { left: 12px; top: 10px; }
.tb-right { right: 12px; top: 10px; }
.dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.pill { display: inline-flex; align-items: center; gap: 2px; }
.bname { display: inline-flex; align-items: center; gap: 4px; }
.ib { height: 28px; min-width: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.zoom { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.toast { position: absolute; z-index: 6; left: 50%; bottom: 62px; transform: translateX(-50%); white-space: nowrap; display: flex; gap: 10px; align-items: center; }

/* ---------- 右侧说明 ---------- */
.notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.notes h2 { font: 600 15px/1.3 var(--sys); margin: 0; }
.notes p { margin: 0; color: var(--page-ink-2); font-size: 12.5px; line-height: 1.6; }
.notes h3 { font: 600 12.5px var(--sys); margin: 4px 0 0; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li { font-size: 12.5px; line-height: 1.55; padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--page-ink-2); }
.notes .fuse { padding: 12px; border-radius: 8px; background: var(--seg-bg); display: flex; flex-direction: column; gap: 6px; }

%%CSS%%
</style>

<div class="wrap">
  <header class="chrome">
    <div><h1>%%H1%%</h1><div class="sub">%%SUB%%</div></div>
    <div class="grow"></div>
    <div class="ctl">主题
      <div class="seg" id="segT" role="group" aria-label="主题">
        <button id="t-sys" data-t="" aria-pressed="true">跟随</button>
        <button id="t-light" data-t="light">浅</button>
        <button id="t-dark" data-t="dark">深</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="frame chrome">
      <div class="tabs"><div class="tab">llm_engine.py</div><div class="tab on">第一张白板</div></div>
      <div class="board %%BOARDCLASS%%" id="board">
        <div class="scene" aria-hidden="true"></div>
        <div class="frame-deco"></div>
        <div class="world" id="world"><svg class="edges" id="edges"></svg></div>
        <nav class="rail"><span class="on">第一张白板</span><span>KV cache</span><span>prefill · decode</span></nav>
        <div class="over tb-left"><div class="pill"><span class="bname"><small class="eyebrow">%%EYEBROW%%</small><span class="bn">第一张白板</span><svg class="ico chev" viewBox="0 0 16 16"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></span></div></div>
        <div class="over tb-right"><div class="pill">
          <span class="prog"><i class="on"></i><i></i><i></i></span>
          <button class="tbtn" id="btnPresent"><svg class="ico" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></svg><span class="tl">讲解</span></button>
          <button class="ib focus-btn" aria-label="专注"><svg class="ico" viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
        </div></div>
        <div class="over dock"><div class="pill">
          <button class="ib"><svg class="ico" viewBox="0 0 16 16"><path d="M3 3h10v6.5L9.5 13H3z"/><path d="M9.5 13V9.5H13"/></svg><span class="lab">便签</span></button>
          <button class="ib"><svg class="ico" viewBox="0 0 16 16"><path d="M6 4.5 2.5 8 6 11.5M10 4.5 13.5 8 10 11.5"/></svg><span class="lab">代码</span></button>
          <button class="ib"><svg class="ico" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5" stroke-dasharray="2.5 2"/></svg><span class="lab">分组</span></button>
          <button class="ib"><svg class="ico" viewBox="0 0 16 16"><path d="M7 9a2.8 2.8 0 0 0 4 0l1.8-1.8a2.8 2.8 0 0 0-4-4L8 4M9 7a2.8 2.8 0 0 0-4 0L3.2 8.8a2.8 2.8 0 0 0 4 4L8 12"/></svg><span class="lab">连线</span></button>
          <span class="sep"></span>
          <button class="ib" aria-label="缩小"><svg class="ico" viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
          <span class="zoom">38%</span>
          <button class="ib" aria-label="放大"><svg class="ico" viewBox="0 0 16 16"><path d="M4 8h8M8 4v8"/></svg></button>
        </div></div>
        <div class="toast"><span class="tdot"></span>Scheduler.schedule 已经展开过了<b>定位</b></div>
      </div>
    </div>
    <aside class="notes" id="notes">%%NOTES%%</aside>
  </div>
</div>

<script>
const CFG = Object.assign({ wA: 330, wB: 300, gap: 130, vgap: 56, route: 'curve', head: 'chevron', port: 'circle', pad: { l: 28, r: 28, t: 64, b: 70 } }, %%CFG%%);
const CARDS = [
  { id: 'a', file: 'f1', step: '1', title: 'LLMEngine.step', path: 'nanovllm/engine/llm_engine.py', rev: 'bb823b3', start: 49, sel: true,
    note: '一次推理迭代：调度、跑模型、收尾', fig: 'FIG. 1 — ONE STEP OF THE ENGINE', glyph: 'sun',
    code: ['def step(self):', '    seqs, is_prefill = self.scheduler.schedule()', '    token_ids = self.model_runner.call("run", seqs, is_prefill)',
      '    self.scheduler.postprocess(seqs, token_ids)', '    outputs = [(seq.seq_id, seq.completion_token_ids) for seq in seqs if seq.is_finished]',
      '    num_tokens = sum(len(seq) for seq in seqs) if is_prefill else -len(seqs)', '    return outputs, num_tokens'],
    links: { 1: 'b', 2: 'c' }, calls: ['schedule', 'call', 'postprocess'] },
  { id: 'b', file: 'f2', step: '1.1', title: 'Scheduler.schedule', path: 'nanovllm/engine/scheduler.py', rev: 'bb823b3', isNew: true, start: 24,
    note: '先凑 prefill 批次，凑不满再走 decode', fig: 'FIG. 1.1 — THE BATCH IS CHOSEN', glyph: 'orbit',
    code: ['def schedule(self) -> tuple[list[Sequence], bool]:', '    scheduled_seqs = []', '    num_seqs = 0', '    num_batched_tokens = 0', '    # prefill',
      '    while self.waiting and num_seqs < self.max_num_seqs:', '        seq = self.waiting[0]', '        if num_batched_tokens + len(seq) > self.max_num_batched_tokens:',
      '            break', '        self.block_manager.allocate(seq)'], calls: ['allocate'] },
  { id: 'c', file: 'f3', step: '1.2', title: 'ModelRunner.run', path: 'nanovllm/engine/model_runner.py', rev: 'bb823b3', start: 208,
    note: '准备输入、前向一次、只在 rank 0 采样', fig: 'FIG. 1.2 — THE MODEL IS CONSULTED', glyph: 'wave',
    code: ['def run(self, seqs: list[Sequence], is_prefill: bool) -> list[int]:', '    input_ids, positions = self.prepare_prefill(seqs) if is_prefill else self.prepare_decode(seqs)',
      '    temperatures = self.prepare_sample(seqs) if self.rank == 0 else None', '    logits = self.run_model(input_ids, positions, is_prefill)',
      '    token_ids = self.sampler(logits, temperatures).tolist() if self.rank == 0 else None', '    reset_context()', '    return token_ids'], calls: ['run_model'] },
];
const LABELS = { b: 'seqs, is_prefill', c: 'token_ids' };
const GLYPHS = {
  sun: '<circle cx="24" cy="24" r="4.5" fill="currentColor" stroke="none"/>' + Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6, r1 = 9, r2 = i % 2 ? 15 : 19; return `<path d="M${24 + r1 * Math.cos(a)} ${24 + r1 * Math.sin(a)} L${24 + r2 * Math.cos(a)} ${24 + r2 * Math.sin(a)}"/>`; }).join(''),
  orbit: '<ellipse cx="24" cy="24" rx="19" ry="12"/><ellipse cx="24" cy="24" rx="12" ry="7.5"/><circle cx="24" cy="24" r="3.5" fill="currentColor" stroke="none"/><circle cx="40" cy="15" r="2.2" fill="currentColor" stroke="none"/>',
  wave: '<path d="M4 20c5-7 9-7 14 0s9 7 14 0 9-7 12-2"/><path d="M4 30c5-7 9-7 14 0s9 7 14 0 9-7 12-2"/>',
};

const cn = s => s.replace(/\d/g, d => '〇一二三四五六七八九'[d]).replace('.', '之');
const KW = new Set('def return for in if else elif while and or not is None True False class break continue del import from as with lambda yield'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(line, calls) {
  const re = /(#.*$)|("[^"]*"|'[^']*')|(\d+)|([A-Za-z_]\w*)|([^\sA-Za-z_\d"'#]+)|(\s+)/g;
  let out = '', m;
  while ((m = re.exec(line))) {
    const [t, com, str, num, id, p] = m;
    if (com) out += `<span class="com">${esc(t)}</span>`;
    else if (str) out += `<span class="str">${esc(t)}</span>`;
    else if (num) out += `<span class="num">${t}</span>`;
    else if (id) {
      const next = line.slice(re.lastIndex).trimStart()[0];
      if (KW.has(id)) out += `<span class="kw">${id}</span>`;
      else if (id === 'self') out += `<span class="self">${id}</span>`;
      else if (next === '(') out += `<span class="fn${calls.includes(id) ? ' call' : ''}">${id}</span>`;
      else out += id;
    } else if (p) out += `<span class="p">${esc(t)}</span>`;
    else out += t;
  }
  return out;
}

const board = document.getElementById('board'), world = document.getElementById('world'), edges = document.getElementById('edges');
let bounds = { x: 0, y: 0, w: 1, h: 1 };
function render() {
  world.querySelectorAll('.card, .elabel, .caption, .dim').forEach(n => n.remove());
  for (const c of CARDS) {
    const el = document.createElement('div');
    const file = c.path.split('/').pop(), end = c.start + c.code.length - 1;
    el.className = `card ${c.file}` + (c.sel ? ' sel' : '') + (c.isNew ? ' is-new' : '');
    el.style.width = (c.id === 'a' ? CFG.wA : CFG.wB) + 'px';
    const rev = c.isNew ? '<span class="rev new"><i></i>有新版本</span>' : `<span class="rev"><i></i>${c.rev}</span>`;
    el.innerHTML = `
      <div class="chead"><span class="step" data-cn="${cn(c.step)}">${c.step}</span><span class="ctitle">${c.title}</span><span class="cpath">${file}</span>${rev}</div>
      <div class="cband"><span class="bt">${c.title}</span><span class="big">${c.step.padStart(2, '0')}</span></div>
      <div class="cname">${c.title}</div>
      <div class="cmeta"><div><small>文件</small>${file}</div><div><small>行</small>${c.start}–${end}</div><div><small>提交</small>${c.isNew ? '有新版本' : c.rev}</div></div>
      <div class="cnote">${c.note}</div>
      <div class="cside"><span>${cn(c.step)}</span></div>
      <div class="code">${Object.keys(c.links || {}).map(i => `<div class="hlrow" data-i="${i}"></div>`).join('')}<div class="gutter">${c.code.map((l, i) => `<span class="no${c.links && c.links[i] ? ' link' : ''}">${c.start + i}</span>`).join('')}</div><pre class="src">${c.code.map(l => hl(l, c.calls)).join('\n')}</pre></div>
      <div class="cfoot"><span><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>L${c.start}–${end}</span><span class="act">${c.isNew ? '跟进到最新' : '在编辑器打开'}<svg class="ico" viewBox="0 0 16 16"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/></svg></span></div>`;
    world.appendChild(el); c.el = el;
    const cap = document.createElement('div'); cap.className = 'caption'; cap.textContent = c.fig; world.appendChild(cap); c.cap = cap;
  }
  layout();
}
function layout() {
  const [a, b, c] = CARDS;
  const h = x => x.el.offsetHeight;
  b.x = c.x = CFG.wA + CFG.gap; b.y = 0; c.y = h(b) + CFG.vgap;
  a.x = 0; a.y = Math.max(0, (c.y + h(c)) / 2 - h(a) / 2 - 30);
  for (const k of CARDS) {
    k.el.style.left = k.x + 'px'; k.el.style.top = k.y + 'px';
    k.cap.style.left = k.x + 'px'; k.cap.style.top = (k.y + h(k) + 12) + 'px'; k.cap.style.width = k.el.offsetWidth + 'px';
  }
  drawEdges(); if (window.decorate) decorate(CARDS, world);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of world.children) { if (n.tagName === 'svg' || getComputedStyle(n).display === 'none') continue;
    x0 = Math.min(x0, n.offsetLeft); y0 = Math.min(y0, n.offsetTop); x1 = Math.max(x1, n.offsetLeft + n.offsetWidth); y1 = Math.max(y1, n.offsetTop + n.offsetHeight); }
  bounds = { x: x0 - 30, y: y0 - 30, w: x1 - x0 + 60, h: y1 - y0 + 60 };
  fit();
}
function lineBox(c, i) {
  const code = c.el.querySelector('.code'), src = c.el.querySelector('.src'), cs = getComputedStyle(code);
  const lh = parseFloat(getComputedStyle(src).lineHeight);
  return { top: code.offsetTop + parseFloat(cs.paddingTop) + i * lh, h: lh, rel: parseFloat(cs.paddingTop) + i * lh };
}
function drawEdges() {
  for (const c of CARDS) c.el.querySelectorAll('.hlrow').forEach(r => { const b = lineBox(c, +r.dataset.i); r.style.top = b.rel + 'px'; r.style.height = b.h + 'px'; });
  let svg = '';
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  for (const c of CARDS) for (const [i, to] of Object.entries(c.links || {})) {
    const t = byId[to];
    const lb = lineBox(c, +i), hd = t.el.querySelector(CFG.entry || '.chead');
    const x1 = c.x + c.el.offsetWidth - (CFG.port === 'pin' ? 14 : 0), y1 = c.y + lb.top + lb.h / 2;
    const x2 = t.x + (CFG.head === 'pin' ? 16 : -4), y2 = t.y + hd.offsetTop + hd.offsetHeight / 2;
    let d, mx, my;
    if (CFG.route === 'elbow') {
      const xm = x1 + (x2 - x1) * (+i === 1 ? 0.4 : 0.55);
      d = `M${x1} ${y1} H${xm} V${y2} H${x2}`; mx = xm; my = (y1 + y2) / 2;
    } else if (CFG.route === 'sag') { // 线是软的，两头钉住，中间往下垂
      const xm = (x1 + x2) / 2, cy = Math.max(y1, y2) + (CFG.sag || 50);
      d = `M${x1} ${y1} Q${xm} ${cy} ${x2} ${y2}`; mx = xm; my = (y1 + 2 * cy + y2) / 4;
    } else {
      const dx = Math.max(30, (x2 - x1) * 0.6);
      d = `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
      mx = (x1 + 3 * (x1 + dx) + 3 * (x2 - dx) + x2) / 8; my = (y1 + y2) / 2;
    }
    svg += `<path class="edge ${t.file}" d="${d}"/>`;
    if (CFG.head === 'triangle') svg += `<path class="ahead fill ${t.file}" d="M${x2 + 2} ${y2} l-8 -4 v8 z"/>`;
    else if (CFG.head === 'pin') svg += `<circle class="ahead pin" cx="${x2}" cy="${y2}" r="5"/>`;
    else if (CFG.head === 'none') {}
    else if (CFG.head === 'dot') svg += `<circle class="ahead fill ${t.file}" cx="${x2}" cy="${y2}" r="3.5"/>`;
    else svg += `<path class="ahead ${t.file}" d="M${x2 - 5} ${y2 - 4} L${x2} ${y2} L${x2 - 5} ${y2 + 4}"/>`;
    if (CFG.port === 'pin') svg += `<circle class="port pin" cx="${x1}" cy="${y1}" r="5"/>`;
    else if (CFG.port === 'square') svg += `<rect class="port ${t.file}" x="${x1 - 3}" y="${y1 - 3}" width="6" height="6"/>`;
    else if (CFG.port === 'diamond') svg += `<path class="port ${t.file}" d="M${x1} ${y1 - 4} l4 4 -4 4 -4 -4z"/>`;
    else svg += `<circle class="port ${t.file}" cx="${x1}" cy="${y1}" r="3.5"/>`;
    const lab = document.createElement('div'); lab.className = 'elabel ' + t.file; lab.textContent = LABELS[to];
    lab.style.left = mx + 'px'; lab.style.top = my + 'px'; world.appendChild(lab);
  }
  edges.innerHTML = (CFG.defs || '') + svg;
}
function fit() {
  const p = CFG.pad, W = board.clientWidth - p.l - p.r, H = board.clientHeight - p.t - p.b;
  const k = Math.min(W / bounds.w, H / bounds.h, 1.1);
  const x = p.l + (W - bounds.w * k) / 2 - bounds.x * k, y = p.t + (H - bounds.h * k) / 2 - bounds.y * k;
  world.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  const z = board.querySelector('.zoom'); if (z) z.textContent = Math.round(k * 100) + '%';
}
new ResizeObserver(fit).observe(board);
document.getElementById('segT').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#segT button').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (b.dataset.t) document.body.dataset.mode = b.dataset.t; else delete document.body.dataset.mode;
});

render();
document.fonts && document.fonts.ready.then(layout);
</script>

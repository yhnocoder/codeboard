<title>CodeBoard 材质</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* 布局：上方切换条；左边是一块模拟「VS Code 半屏 webview」的白板，右边是这一版改了什么 */
:root {
  color-scheme: light;
  --page: light-dark(#f5f4f1, #141413);
  --page-ink: light-dark(#23211d, #ecebe7);
  --page-ink-2: light-dark(#6a665e, #a19d95);
  --page-hair: light-dark(rgba(40,30,10,.12), rgba(255,250,240,.1));
  --seg-bg: light-dark(rgba(40,30,10,.06), rgba(255,250,240,.07));
  --seg-on: light-dark(#ffffff, #3a3936);
  --vs-tabs: light-dark(#f3f3f3, #252526);
  --vs-tab-on: light-dark(#ffffff, #1e1e1e);
  --vs-ink: light-dark(#333333, #cccccc);
  --vs-ink-2: light-dark(#8a8a8a, #8b8b8b);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: "Source Serif 4", "Songti SC", "Noto Serif SC", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font: 13px/1.5 var(--sys); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.chrome, .chrome * { user-select: none; -webkit-user-select: none; cursor: default; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--accent, #4c8bf5); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.chrome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
header h1 { font: 600 17px/1.2 var(--sys); margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--page-ink-2); font-size: 12.5px; }
.grow { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--seg-bg); gap: 2px; }
.seg button { padding: 3px 11px; border-radius: 6px; font-size: 12.5px; color: var(--page-ink-2); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--page-ink); box-shadow: 0 0 0 .5px var(--page-hair), 0 1px 2px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--page-ink-2); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 920px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 模拟 webview ---------- */
.frame { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px var(--page-hair), 0 12px 40px -16px light-dark(rgba(40,30,10,.25), rgba(0,0,0,.7)); min-width: 0; }
.tabs { height: 34px; background: var(--vs-tabs); display: flex; align-items: stretch; font-size: 12.5px; color: var(--vs-ink-2); }
.tabs .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.tabs .tab.on { background: var(--vs-tab-on); color: var(--vs-ink); }
.tabs svg { width: 14px; height: 14px; }

/* ---------- 白板：三套 token ---------- */
.board {
  /* v1 */
  --bg: light-dark(#f4f2ec, #1b1a18); --surface: light-dark(#ffffff, #2a2926); --head: var(--surface);
  --ink: light-dark(#1f1e1b, #ece9e1); --ink-2: light-dark(#5d5a53, #b4afa5); --ink-3: light-dark(#8f8a80, #868177);
  --line: light-dark(#e3dfd4, #3a3833); --hair: var(--line);
  --accent: light-dark(#c15f3c, #db7a56); --accent-ink: light-dark(#fff, #1b1a18);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: light-dark(#c48a1f, #e0b055); --ok: light-dark(#5a8a4c, #8dbb79);
  --row: light-dark(#f8e8dc, #43302a);
  --k-kw: light-dark(#9a3f22, #e59572); --k-fn: light-dark(#2e5d86, #86b4de); --k-str: light-dark(#4a7536, #a3c98c);
  --k-com: light-dark(#9a958a, #7d786e); --k-num: light-dark(#8a6416, #d9b36a); --k-self: light-dark(#7a4f9a, #c8a3e6); --k-p: light-dark(#6f6a62, #a39e93);
  --sh-card: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --sh-float: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --glass: var(--surface); --ui: var(--sys); --title: var(--serif);
  position: relative; background: var(--bg); color: var(--ink); overflow: hidden; aspect-ratio: 780 / 600; font-family: var(--ui);
}
.board[data-v="warm"] {
  --bg: light-dark(#eeece6, #191816); --surface: light-dark(#fdfcfa, #252422); --head: light-dark(#f8f6f1, #2a2926);
  --ink: light-dark(#211f1b, #ece8e0); --ink-2: light-dark(#625e56, #aca79d); --ink-3: light-dark(#9a958b, #78746c);
  --line: light-dark(rgba(60,45,20,.09), rgba(255,240,220,.07)); --hair: light-dark(rgba(60,45,20,.16), rgba(255,240,220,.11));
  --accent: light-dark(#b5552d, #e3895f); --row: color-mix(in srgb, var(--accent) 9%, transparent);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,.9), rgba(255,245,230,.06)),
    0 1px 1px light-dark(rgba(50,35,10,.04), rgba(0,0,0,.25)), 0 3px 8px -2px light-dark(rgba(50,35,10,.06), rgba(0,0,0,.3)),
    0 18px 36px -14px light-dark(rgba(50,35,10,.16), rgba(0,0,0,.55));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(50,35,10,.08), rgba(0,0,0,.35)), 0 10px 28px -8px light-dark(rgba(50,35,10,.18), rgba(0,0,0,.55));
  --glass: light-dark(rgba(253,252,250,.72), rgba(42,41,38,.66));
}
.board[data-v="graphite"] {
  --bg: light-dark(#ebebed, #1b1b1d); --surface: light-dark(#ffffff, #28282b); --head: light-dark(#fbfbfc, #2d2d30);
  --ink: light-dark(#1d1d1f, #f2f2f4); --ink-2: light-dark(#6e6e73, #a1a1a6); --ink-3: light-dark(#a0a0a6, #6c6c72);
  --line: light-dark(rgba(0,0,0,.07), rgba(255,255,255,.06)); --hair: light-dark(rgba(0,0,0,.14), rgba(255,255,255,.1));
  --accent: light-dark(#0a6cdc, #4e9cff); --accent-ink: #fff; --row: color-mix(in srgb, var(--accent) 8%, transparent);
  --warn: light-dark(#c27c0e, #f0b440);
  --k-kw: light-dark(#a8329d, #f467ab); --k-fn: light-dark(#2f6f78, #6cc2b4); --k-str: light-dark(#c2361f, #ff7f6b);
  --k-com: light-dark(#7b8692, #7d8894); --k-num: light-dark(#2a2ad0, #d6c36d); --k-self: light-dark(#6c36a8, #b28cf0); --k-p: light-dark(#4c4c52, #b9b9be);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,1), rgba(255,255,255,.07)),
    0 1px 1px light-dark(rgba(0,0,0,.04), rgba(0,0,0,.3)), 0 3px 8px -2px light-dark(rgba(0,0,0,.06), rgba(0,0,0,.35)),
    0 18px 36px -14px light-dark(rgba(0,0,0,.14), rgba(0,0,0,.6));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)), 0 10px 28px -8px light-dark(rgba(0,0,0,.16), rgba(0,0,0,.6));
  --glass: light-dark(rgba(255,255,255,.7), rgba(44,44,47,.66)); --title: var(--sys);
}

.world { position: absolute; left: 0; top: 0; width: 780px; height: 600px; transform-origin: 0 0; }
.edges { position: absolute; inset: 0; overflow: visible; }
.edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.board:not([data-v="v1"]) .edge { stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; }
.head-fill { fill: var(--ink); }
.board:not([data-v="v1"]) .head-fill { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.port { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.25; }
.board[data-v="v1"] .port { display: none; }

.elabel { position: absolute; transform: translate(-50%, -50%); font: 11px/1 var(--mono); white-space: nowrap; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.board:not([data-v="v1"]) .elabel { border: 0; color: var(--ink-2); background: var(--surface); box-shadow: 0 0 0 .5px var(--hair), 0 1px 2px light-dark(rgba(0,0,0,.05), rgba(0,0,0,.3)); border-radius: 5px; padding: 4px 7px; }

.card { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-card); overflow: hidden; }
.board:not([data-v="v1"]) .card { border: 0; border-radius: 9px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft), var(--sh-card); }
.board:not([data-v="v1"]) .card.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4.5px color-mix(in srgb, var(--accent) 16%, transparent), var(--sh-card); }
.chead { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--head); }
.board:not([data-v="v1"]) .chead { height: 36px; }
.step { font: 600 10.5px/1 var(--mono); height: 19px; min-width: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.board[data-v="warm"] .step { background: var(--soft); color: var(--accent); border-radius: 5px; font-weight: 600; }
.board[data-v="graphite"] .step { background: none; color: var(--ink-3); padding: 0; min-width: 0; font-weight: 500; }
.ctitle { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.board:not([data-v="v1"]) .ctitle { font-size: 12px; letter-spacing: -0.01em; }
.cpath { color: var(--ink-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.board:not([data-v="v1"]) .cpath { font-size: 11px; }
.rev { display: inline-flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; flex: none; }
.rev i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.rev.new { border-color: var(--warn); color: var(--ink-2); background: color-mix(in srgb, var(--warn) 13%, transparent); }
.rev.new i { background: var(--warn); }
.board:not([data-v="v1"]) .rev { border: 0; padding: 0; background: none; }
.board:not([data-v="v1"]) .rev i { display: none; }
.board:not([data-v="v1"]) .rev.new { color: var(--warn); }
.board:not([data-v="v1"]) .rev.new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }

.code { padding: 6px 0 8px; font: 11.5px/20px var(--mono); }
.board:not([data-v="v1"]) .code { font-size: 11px; }
.ln { display: flex; white-space: pre; position: relative; }
.ln .no { width: 40px; text-align: right; padding-right: 12px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; opacity: .8; }
.board:not([data-v="v1"]) .ln .no { opacity: .6; }
.ln .tx { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.ln.link { background: var(--row); }
.board:not([data-v="v1"]) .ln.link .no { color: var(--accent); opacity: 1; }
.kw { color: var(--k-kw); } .fn { color: var(--k-fn); } .str { color: var(--k-str); } .com { color: var(--k-com); font-style: italic; }
.num { color: var(--k-num); } .self { color: var(--k-self); } .p { color: var(--k-p); }
.board:not([data-v="v1"]) .call { text-decoration: underline dotted color-mix(in srgb, var(--k-fn) 55%, transparent); text-underline-offset: 3px; }

/* 浮层：顶栏、工具坞、toast，不随画布缩放 */
.over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.tb-left { left: 12px; top: 10px; }
.tb-right { right: 12px; top: 10px; }
.dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-float); border-radius: 9px; padding: 4px; }
.board:not([data-v="v1"]) .pill { border: 0; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-radius: 10px; }
.bname { font: 600 14px var(--title); padding: 3px 6px 3px 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.board:not([data-v="v1"]) .bname { font-size: 13px; }
.board[data-v="graphite"] .bname { font-weight: 600; letter-spacing: -0.01em; }
.ib { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); transition: background .12s, color .12s; }
.ib:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.ib:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; color: var(--ink-2); font-size: 12.5px; }
.tbtn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.board:not([data-v="v1"]) .sep { background: var(--hair); width: .5px; }
.zoom { font: 11.5px var(--mono); color: var(--ink-2); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.board[data-v="v1"] .dock { gap: 10px; }
.board[data-v="v1"] .dock .sep { display: none; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.board:not([data-v="v1"]) .ico { stroke-width: 1.4; }
.toast { position: absolute; z-index: 6; left: 16px; bottom: 60px; font-size: 12.5px; padding: 8px 14px; border-radius: 8px; background: light-dark(#fffaf0, #3a3934); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--sh-float); }
.board:not([data-v="v1"]) .toast { border: 0; background: light-dark(rgba(34,32,28,.88), rgba(245,243,238,.92)); color: light-dark(#f6f4ef, #1d1c1a); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 8px; padding: 7px 12px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.35); display: flex; gap: 10px; align-items: center; }
.toast b { font-weight: 500; color: var(--accent); }
.board:not([data-v="v1"]) .toast b { color: inherit; opacity: .6; font-weight: 400; }

/* ---------- 右侧说明 ---------- */
.notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.notes h2 { font: 600 15px/1.3 var(--sys); margin: 0; }
.notes .lead { margin: 0; color: var(--page-ink-2); font-size: 12.5px; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.notes li { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; font-size: 12.5px; line-height: 1.55; }
.notes li span:first-child { color: var(--page-ink-2); }
.notes code { font: 11.5px var(--mono); }
.tip { font-size: 12px; color: var(--page-ink-2); border-top: .5px solid var(--page-hair); padding-top: 12px; }
</style>

<div class="wrap">
  <header class="chrome">
    <div>
      <h1>白板材质对照</h1>
      <div class="sub">同一块白板、同一份数据，只换材质。左边模拟 VS Code 里的 webview。</div>
    </div>
    <div class="grow"></div>
    <div class="ctl">版本
      <div class="seg" id="segV" role="group" aria-label="版本">
        <button id="v-v1" data-v="v1">v1 现状</button>
        <button id="v-warm" data-v="warm" aria-pressed="true">暖墨</button>
        <button id="v-graphite" data-v="graphite">石墨</button>
      </div>
    </div>
    <div class="ctl">主题
      <div class="seg" id="segT" role="group" aria-label="主题">
        <button id="t-sys" data-t="" aria-pressed="true">跟随</button>
        <button id="t-light" data-t="light">浅</button>
        <button id="t-dark" data-t="dark">深</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="frame chrome">
      <div class="tabs"><div class="tab">llm_engine.py</div><div class="tab on">
        <svg viewBox="0 0 16 16" class="ico"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M5.5 6.5h5M5.5 9.5h3"/></svg>第一张白板</div></div>
      <div class="board" id="board" data-v="warm">
        <div class="world" id="world"><svg class="edges" id="edges" width="780" height="600"></svg></div>
        <div class="over tb-left"><div class="pill"><span class="bname">第一张白板 <svg class="ico" viewBox="0 0 16 16" style="width:13px;height:13px"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></span></div></div>
        <div class="over tb-right"><div class="pill">
          <button class="tbtn"><svg class="ico" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></svg>讲解</button>
          <button class="ib" aria-label="专注"><svg class="ico" viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
        </div></div>
        <div class="over dock">
          <div class="pill">
            <button class="ib" aria-label="便签"><svg class="ico" viewBox="0 0 16 16"><path d="M3 3h10v6.5L9.5 13H3z"/><path d="M9.5 13V9.5H13"/></svg></button>
            <button class="ib" aria-label="代码"><svg class="ico" viewBox="0 0 16 16"><path d="M6 4.5 2.5 8 6 11.5M10 4.5 13.5 8 10 11.5"/></svg></button>
            <button class="ib" aria-label="分组"><svg class="ico" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5" stroke-dasharray="2.5 2"/></svg></button>
            <button class="ib" aria-label="图片"><svg class="ico" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="m3 11.5 3.5-3.5 3 3L11 9.5l2.5 2.5"/></svg></button>
            <button class="ib" aria-label="连线"><svg class="ico" viewBox="0 0 16 16"><path d="M7 9a2.8 2.8 0 0 0 4 0l1.8-1.8a2.8 2.8 0 0 0-4-4L8 4M9 7a2.8 2.8 0 0 0-4 0L3.2 8.8a2.8 2.8 0 0 0 4 4L8 12"/></svg></button>
            <span class="sep"></span>
            <button class="ib" aria-label="缩小"><svg class="ico" viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
            <span class="zoom">38%</span>
            <button class="ib" aria-label="放大"><svg class="ico" viewBox="0 0 16 16"><path d="M4 8h8M8 4v8"/></svg></button>
            <button class="ib" aria-label="适应"><svg class="ico" viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
          </div>
        </div>
        <div class="toast" id="toast">Scheduler.schedule 已经展开过了 <b>定位</b></div>
      </div>
    </div>

    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const CARDS = [
  { id: 'a', step: '1', title: 'LLMEngine.step', path: 'nanovllm/engine/llm_engine.py', rev: 'bb823b3', x: 20, y: 130, w: 310, start: 49, sel: true,
    code: [
      'def step(self):',
      '    seqs, is_prefill = self.scheduler.schedule()',
      '    token_ids = self.model_runner.call("run", seqs, is_prefill)',
      '    self.scheduler.postprocess(seqs, token_ids)',
      '    outputs = [(seq.seq_id, seq.completion_token_ids) for seq in seqs if seq.is_finished]',

const LABELS = { b: 'seqs, is_prefill', c: 'token_ids' };

const KW = new Set('def return for in if else elif while and or not is None True False class break continue del import from as with lambda yield'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(line, calls) {
  const re = /(#.*$)|("[^"]*"|'[^']*')|(\d+)|([A-Za-z_]\w*)|([^\sA-Za-z_\d"'#]+)|(\s+)/g;
  let out = '', m;
  while ((m = re.exec(line))) {
    const [t, com, str, num, id, p] = m;
    if (com) out += `<span class="com">${esc(t)}</span>`;
    else if (str) out += `<span class="str">${esc(t)}</span>`;
    else if (num) out += `<span class="num">${t}</span>`;
    else if (id) {
      const next = line.slice(re.lastIndex).trimStart()[0];
      if (KW.has(id)) out += `<span class="kw">${id}</span>`;
      else if (id === 'self') out += `<span class="self">${id}</span>`;
      else if (next === '(') out += `<span class="fn${calls.includes(id) ? ' call' : ''}">${id}</span>`;
      else out += id;
    } else if (p) out += `<span class="p">${esc(t)}</span>`;
    else out += t;
  }
  return out;
}

const world = document.getElementById('world'), edges = document.getElementById('edges'), board = document.getElementById('board');
const LH = 20, CODE_PAD = 6;
function headH() { return board.dataset.v === 'v1' ? 38 : 36; }

function render() {
  world.querySelectorAll('.card, .elabel').forEach(n => n.remove());
  for (const c of CARDS) {
    const el = document.createElement('div');
    el.className = 'card' + (c.sel ? ' sel' : '');
    el.style.cssText = `left:${c.x}px;top:${c.y}px;width:${c.w}px`;
    const rev = c.isNew ? `<span class="rev new"><i></i>有新版本</span>` : `<span class="rev"><i></i>${c.rev}</span>`;
    el.innerHTML = `<div class="chead"><span class="step">${c.step}</span><span class="ctitle">${c.title}</span><span class="cpath">${c.path.split('/').pop()}</span>${rev}</div>
      <div class="code">${c.code.map((l, i) => `<div class="ln${c.links && c.links[i] ? ' link' : ''}"><span class="no">${c.start + i}</span><span class="tx">${hl(l, c.calls)}</span></div>`).join('')}</div>`;
    world.appendChild(el);
  }
  drawEdges();
}

function drawEdges() {
  const v1 = board.dataset.v === 'v1';
  let svg = '';
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  for (const c of CARDS) for (const [i, to] of Object.entries(c.links || {})) {
    const t = byId[to];
    const x1 = c.x + c.w, y1 = c.y + headH() + 1 + CODE_PAD + (+i) * LH + LH / 2;
    const x2 = t.x - (v1 ? 2 : 6), y2 = t.y + headH() / 2;
    const dx = Math.max(30, (x2 - x1) * 0.6);
    const d = `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
    svg += `<path class="edge" d="${d}"/>`;
    svg += v1 ? `<path class="head-fill" d="M${x2 + 2} ${y2} l-8 -4 v8 z"/>` : `<path class="head-fill" d="M${x2 - 5} ${y2 - 4} L${x2} ${y2} L${x2 - 5} ${y2 + 4}"/>`;
    svg += `<circle class="port" cx="${x1}" cy="${y1}" r="3"/>`;
    // 贝塞尔中点放标签
    const mx = (x1 + 3 * (x1 + dx) + 3 * (x2 - dx) + x2) / 8, my = (y1 + 3 * y1 + 3 * y2 + y2) / 8;
    const lab = document.createElement('div');
    lab.className = 'elabel'; lab.textContent = LABELS[to];
    lab.style.left = mx + 'px'; lab.style.top = my + 'px';
    world.appendChild(lab);
  }
  edges.innerHTML = svg;
}

function fit() { world.style.transform = `scale(${board.clientWidth / 780})`; }
new ResizeObserver(fit).observe(board);

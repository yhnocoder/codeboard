<title>CodeBoard 材质</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&family=DM+Mono:wght@400;500&family=Archivo:wght@500;600;700&family=Jost:wght@300;400;500;600&family=Fraunces:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Marcellus&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=UnifrakturMaguntia&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap">
<style>
/* 页面外框：上方切换条；左边模拟 VS Code 半屏 webview 里的白板，右边是这种风格的取舍 */
:root {
  color-scheme: light;
  --page: light-dark(#f5f4f1, #141413);
  --page-ink: light-dark(#23211d, #ecebe7);
  --page-ink-2: light-dark(#6a665e, #a19d95);
  --page-hair: light-dark(rgba(40,30,10,.12), rgba(255,250,240,.1));
  --seg-bg: light-dark(rgba(40,30,10,.06), rgba(255,250,240,.07));
  --seg-on: light-dark(#ffffff, #3a3936);
  --vs-tabs: light-dark(#f3f3f3, #252526);
  --vs-tab-on: light-dark(#ffffff, #1e1e1e);
  --vs-ink: light-dark(#333333, #cccccc);
  --vs-ink-2: light-dark(#8a8a8a, #8b8b8b);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
/* 页面里的「浅 / 深」按钮：宿主会改写 html 上的 data-theme，所以设在 body 上 */
body[data-mode="dark"] { color-scheme: dark; }
body[data-mode="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font: 13px/1.5 var(--sys); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.chrome, .chrome * { user-select: none; -webkit-user-select: none; cursor: default; -webkit-user-drag: none; }
.chrome .src, .chrome .src * { user-select: text; -webkit-user-select: text; cursor: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.chrome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
header h1 { font: 600 17px/1.2 var(--sys); margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--page-ink-2); font-size: 12.5px; }
.grow { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border-radius: 8px; background: var(--seg-bg); gap: 2px; }
.seg button { padding: 3px 11px; border-radius: 6px; font-size: 12.5px; color: var(--page-ink-2); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--page-ink); box-shadow: 0 0 0 .5px var(--page-hair), 0 1px 2px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--page-ink-2); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 24px; align-items: start; }
@media (max-width: 940px) { .main { grid-template-columns: minmax(0, 1fr); } }
.frame { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px var(--page-hair), 0 12px 40px -16px light-dark(rgba(40,30,10,.25), rgba(0,0,0,.7)); min-width: 0; }
.tabs { height: 34px; background: var(--vs-tabs); display: flex; align-items: stretch; font-size: 12.5px; color: var(--vs-ink-2); }
.tabs .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.tabs .tab.on { background: var(--vs-tab-on); color: var(--vs-ink); }

/* ---------- 白板骨架：只管位置，长相交给各风格 ---------- */
.board { position: relative; height: 640px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); }
@media (max-width: 600px) { .board { height: 540px; } }
.tilt { position: absolute; inset: 0; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; width: 1px; height: 1px; }
.card { position: absolute; overflow: hidden; }
.board:not([data-v="city"]) .traffic { display: none !important; }
.cband, .cname, .cmeta, .cnote, .cfoot, .cside, .caption, .rail, .dim, .eyebrow, .prog, .lab, .frame-deco, .scene { display: none; }
.scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chead { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ctitle, .cpath { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cpath { flex: 1 1 0; }
.rev { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.code { white-space: pre; }
.code { display: flex; position: relative; }
/* 代码是一整段 <pre>：选区连续，复制出来就是原文；行号在旁边单独一列，选不中 */
.gutter { flex: none; position: relative; z-index: 1; }
.gutter .no { display: block; text-align: right; font-variant-numeric: tabular-nums; }
.src { flex: 1; min-width: 0; margin: 0; padding: 0; font: inherit; color: inherit; white-space: pre; overflow: clip; position: relative; z-index: 1;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.src::selection, .src *::selection { background: var(--selbg, color-mix(in srgb, var(--accent, #c15f3c) 26%, transparent)); }
.hlrow { position: absolute; left: 0; right: 0; pointer-events: none; }
.elabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.caption { position: absolute; }
.over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.tb-left { left: 12px; top: 10px; }
.tb-right { right: 12px; top: 10px; }
.dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.pill { display: inline-flex; align-items: center; gap: 2px; }
.bname { display: inline-flex; align-items: center; gap: 4px; }
.ib { height: 28px; min-width: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.zoom { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.toast { position: absolute; z-index: 6; left: 50%; bottom: 62px; transform: translateX(-50%); white-space: nowrap; display: flex; gap: 10px; align-items: center; }

/* ---------- 右侧说明 ---------- */
.notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.notes h2 { font: 600 15px/1.3 var(--sys); margin: 0; }
.notes p { margin: 0; color: var(--page-ink-2); font-size: 12.5px; line-height: 1.6; }
.notes h3 { font: 600 12.5px var(--sys); margin: 4px 0 0; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li { font-size: 12.5px; line-height: 1.55; padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--page-ink-2); }
.notes .fuse { padding: 12px; border-radius: 8px; background: var(--seg-bg); display: flex; flex-direction: column; gap: 6px; }

.board { --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --serif: "Source Serif 4", "Songti SC", "Noto Serif SC", Georgia, serif; }
.board {
  /* v1 */
  --bg: light-dark(#f4f2ec, #1b1a18); --surface: light-dark(#ffffff, #2a2926); --head: var(--surface);
  --ink: light-dark(#1f1e1b, #ece9e1); --ink-2: light-dark(#5d5a53, #b4afa5); --ink-3: light-dark(#8f8a80, #868177);
  --line: light-dark(#e3dfd4, #3a3833); --hair: var(--line);
  --accent: light-dark(#c15f3c, #db7a56); --accent-ink: light-dark(#fff, #1b1a18);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: light-dark(#c48a1f, #e0b055); --ok: light-dark(#5a8a4c, #8dbb79);
  --row: light-dark(#f8e8dc, #43302a);
  --k-kw: light-dark(#9a3f22, #e59572); --k-fn: light-dark(#2e5d86, #86b4de); --k-str: light-dark(#4a7536, #a3c98c);
  --k-com: light-dark(#9a958a, #7d786e); --k-num: light-dark(#8a6416, #d9b36a); --k-self: light-dark(#7a4f9a, #c8a3e6); --k-p: light-dark(#6f6a62, #a39e93);
  --sh-card: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --sh-float: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --glass: var(--surface); --ui: var(--sys); --title: var(--serif);
  position: relative; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--ui);
}
.board[data-v="warm"] {
  --bg: light-dark(#eeece6, #191816); --surface: light-dark(#fdfcfa, #252422); --head: light-dark(#f8f6f1, #2a2926);
  --ink: light-dark(#211f1b, #ece8e0); --ink-2: light-dark(#625e56, #aca79d); --ink-3: light-dark(#9a958b, #78746c);
  --line: light-dark(rgba(60,45,20,.09), rgba(255,240,220,.07)); --hair: light-dark(rgba(60,45,20,.16), rgba(255,240,220,.11));
  --accent: light-dark(#b5552d, #e3895f); --row: color-mix(in srgb, var(--accent) 9%, transparent);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,.9), rgba(255,245,230,.06)),
    0 1px 1px light-dark(rgba(50,35,10,.04), rgba(0,0,0,.25)), 0 3px 8px -2px light-dark(rgba(50,35,10,.06), rgba(0,0,0,.3)),
    0 18px 36px -14px light-dark(rgba(50,35,10,.16), rgba(0,0,0,.55));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(50,35,10,.08), rgba(0,0,0,.35)), 0 10px 28px -8px light-dark(rgba(50,35,10,.18), rgba(0,0,0,.55));
  --glass: light-dark(rgba(253,252,250,.72), rgba(42,41,38,.66));
}
.board[data-v="graphite"] {
  --bg: light-dark(#ebebed, #1b1b1d); --surface: light-dark(#ffffff, #28282b); --head: light-dark(#fbfbfc, #2d2d30);
  --ink: light-dark(#1d1d1f, #f2f2f4); --ink-2: light-dark(#6e6e73, #a1a1a6); --ink-3: light-dark(#a0a0a6, #6c6c72);
  --line: light-dark(rgba(0,0,0,.07), rgba(255,255,255,.06)); --hair: light-dark(rgba(0,0,0,.14), rgba(255,255,255,.1));
  --accent: light-dark(#0a6cdc, #4e9cff); --accent-ink: #fff; --row: color-mix(in srgb, var(--accent) 8%, transparent);
  --warn: light-dark(#c27c0e, #f0b440);
  --k-kw: light-dark(#a8329d, #f467ab); --k-fn: light-dark(#2f6f78, #6cc2b4); --k-str: light-dark(#c2361f, #ff7f6b);
  --k-com: light-dark(#7b8692, #7d8894); --k-num: light-dark(#2a2ad0, #d6c36d); --k-self: light-dark(#6c36a8, #b28cf0); --k-p: light-dark(#4c4c52, #b9b9be);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,1), rgba(255,255,255,.07)),
    0 1px 1px light-dark(rgba(0,0,0,.04), rgba(0,0,0,.3)), 0 3px 8px -2px light-dark(rgba(0,0,0,.06), rgba(0,0,0,.35)),
    0 18px 36px -14px light-dark(rgba(0,0,0,.14), rgba(0,0,0,.6));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)), 0 10px 28px -8px light-dark(rgba(0,0,0,.16), rgba(0,0,0,.6));
  --glass: light-dark(rgba(255,255,255,.7), rgba(44,44,47,.66)); --title: var(--sys);
}

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.board:is([data-v="warm"],[data-v="graphite"]) .edge { stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ahead { fill: var(--ink); }
.board:is([data-v="warm"],[data-v="graphite"]) .ahead { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .port { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.25; }
.board[data-v="v1"] .port { display: none; }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .elabel { position: absolute; transform: translate(-50%, -50%); font: 11px/1 var(--mono); white-space: nowrap; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.board:is([data-v="warm"],[data-v="graphite"]) .elabel { border: 0; color: var(--ink-2); background: var(--surface); box-shadow: 0 0 0 .5px var(--hair), 0 1px 2px light-dark(rgba(0,0,0,.05), rgba(0,0,0,.3)); border-radius: 5px; padding: 4px 7px; }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .card { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-card); overflow: hidden; }
.board:is([data-v="warm"],[data-v="graphite"]) .card { border: 0; border-radius: 9px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft), var(--sh-card); }
.board:is([data-v="warm"],[data-v="graphite"]) .card.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4.5px color-mix(in srgb, var(--accent) 16%, transparent), var(--sh-card); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .chead { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--head); }
.board:is([data-v="warm"],[data-v="graphite"]) .chead { height: 36px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .step { font: 600 10.5px/1 var(--mono); height: 19px; min-width: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.board[data-v="warm"] .step { background: var(--soft); color: var(--accent); border-radius: 5px; font-weight: 600; }
.board[data-v="graphite"] .step { background: none; color: var(--ink-3); padding: 0; min-width: 0; font-weight: 500; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ctitle { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.board:is([data-v="warm"],[data-v="graphite"]) .ctitle { font-size: 12px; letter-spacing: -0.01em; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .cpath { color: var(--ink-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.board:is([data-v="warm"],[data-v="graphite"]) .cpath { font-size: 11px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev { display: inline-flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; flex: none; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev.new { border-color: var(--warn); color: var(--ink-2); background: color-mix(in srgb, var(--warn) 13%, transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev.new i { background: var(--warn); }
.board:is([data-v="warm"],[data-v="graphite"]) .rev { border: 0; padding: 0; background: none; }
.board:is([data-v="warm"],[data-v="graphite"]) .rev i { display: none; }
.board:is([data-v="warm"],[data-v="graphite"]) .rev.new { color: var(--warn); }
.board:is([data-v="warm"],[data-v="graphite"]) .rev.new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .code { padding: 6px 0 8px; font: 11.5px/20px var(--mono); }
.board:is([data-v="warm"],[data-v="graphite"]) .code { font-size: 11px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ln { display: flex; white-space: pre; position: relative; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .gutter .no { width: 40px; text-align: right; padding-right: 12px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; opacity: .8; }
.board:is([data-v="warm"],[data-v="graphite"]) .gutter .no { opacity: .6; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .src { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .hlrow { background: var(--row); }
.board:is([data-v="warm"],[data-v="graphite"]) .no.link { color: var(--accent); opacity: 1; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .kw { color: var(--k-kw); } .fn { color: var(--k-fn); } .str { color: var(--k-str); } .com { color: var(--k-com); font-style: italic; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .num { color: var(--k-num); } .self { color: var(--k-self); } .p { color: var(--k-p); }
.board:is([data-v="warm"],[data-v="graphite"]) .call { text-decoration: underline dotted color-mix(in srgb, var(--k-fn) 55%, transparent); text-underline-offset: 3px; }

/* 浮层：顶栏、工具坞、toast，不随画布缩放 */
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tb-left { left: 12px; top: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tb-right { right: 12px; top: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-float); border-radius: 9px; padding: 4px; }
.board:is([data-v="warm"],[data-v="graphite"]) .pill { border: 0; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-radius: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .bname { font: 600 14px var(--title); padding: 3px 6px 3px 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.board:is([data-v="warm"],[data-v="graphite"]) .bname { font-size: 13px; }
.board[data-v="graphite"] .bname { font-weight: 600; letter-spacing: -0.01em; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); transition: background .12s, color .12s; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; color: var(--ink-2); font-size: 12.5px; }

.board[data-v="soft"] .no.link { color: var(--coral); }
.board[data-v="soft"] .kw { color: var(--k-kw); } .board[data-v="soft"] .fn { color: var(--k-fn); } .board[data-v="soft"] .str { color: var(--k-str); } .board[data-v="soft"] .com { color: var(--k-com); }

.board[data-v="soft"] .port { fill: var(--surface); stroke: var(--coral); stroke-width: 1.5; }

  border-right: 1px solid var(--hair); background: color-mix(in srgb, var(--surface) 55%, transparent); }
.board[data-v="soft"] .rail span { writing-mode: vertical-rl; text-orientation: sideways; rotate: 180deg; font: 400 12px var(--ui); color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; position: relative; }

.board[data-v="soft"] .tb-left { left: 78px; top: 16px; }

/* 多彩卡片：奶油底、2px 墨线、直角；每个源文件分到一种颜色，卡片顶部是这块颜色加一个小图形 */
.board[data-v="color"] {

  --k-com: light-dark(#9a8c78, #7e7464); --k-num: light-dark(#8a6a12, #e6c26a); --k-self: light-dark(#7b4a7a, #d9a2d6); --k-p: light-dark(#6e6253, #a99d89);

.board[data-v="color"] .card.sel { box-shadow: 6px 6px 0 0 var(--line); }
.board[data-v="color"] .chead { order: 0; height: 30px; gap: 0; border-bottom: 2px solid var(--line); font: 500 9.5px var(--ui); letter-spacing: .2em; text-transform: uppercase; }

.board[data-v="color"] .f1, .board[data-v="color"] .f3 { --bink: var(--paper-ink); } .board[data-v="color"] .f2 { --bink: #2a231c; }
.board[data-v="color"] .bt { font: 600 16px var(--ui); letter-spacing: .03em; color: var(--bink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.board[data-v="color"] .num { color: var(--k-num); } .board[data-v="color"] .self { color: var(--k-self); } .board[data-v="color"] .p { color: var(--k-p); }

.board[data-v="color"] .ico { stroke-width: 1.7; }

/* 报纸：新闻纸底、黑色油墨；白板名是报头，每张卡片是一篇报道：栏目眉题、粗体大标题、斜体导语，代码像打字机排的引文 */
.board[data-v="news"] {

}

.board[data-v="news"] .cpath { color: var(--ink-3); }

.board[data-v="news"] .hlrow { background: light-dark(rgba(25,23,20,.07), rgba(236,231,220,.07)); }
.board[data-v="news"] .no.link { color: var(--ink); font-weight: 700; }
.board[data-v="news"] .kw { font-weight: 700; } .board[data-v="news"] .fn { color: var(--ink); } .board[data-v="news"] .str { color: var(--ink-2); font-style: italic; }

.board[data-v="news"] .edge { fill: none; stroke: var(--ink); stroke-width: 1; }
.board[data-v="news"] .ahead { fill: var(--ink); }
.board[data-v="news"] .port { fill: var(--ink); stroke: none; }
.board[data-v="news"] .elabel { font: italic 400 12px var(--head); color: var(--ink); background: var(--bg); padding: 1px 6px; }
.board[data-v="news"] .elabel::before { content: "— "; } .board[data-v="news"] .elabel::after { content: " —"; }

/* 报头 */
.board[data-v="news"] .tb-left { left: 0; right: 0; top: 12px; justify-content: center; pointer-events: none; }
.board[data-v="news"] .tb-left .pill { background: none; width: calc(100% - 48px); }

.board[data-v="news"] .eyebrow { display: block; order: 2; width: 100%; text-align: center; font: 400 10px var(--mono); letter-spacing: .14em; color: var(--ink-2);
  border-top: .5px solid var(--rule); padding-top: 4px; margin-top: 4px; }

.board[data-v="news"] .tb-left .chev { display: none; }

/* 艺术：一张深绿油墨印在薄荷纸上的海报。双线框、居中排版、字距拉得很开；每张卡片下面有一行图注 */
.board[data-v="art"] {
  --selbg: color-mix(in srgb, var(--k-fn) 24%, transparent);
  --bg: light-dark(#ecefe7, #0f1f19);
  --paper: light-dark(#f6f7f2, #142821);
  --ink: light-dark(#13372b, #dfe9df);
  --ink-2: light-dark(#3f5f52, #a8bdb0);
  --ink-3: light-dark(#7e958a, #62806f);
  --rule: light-dark(#2e5547, #8fae9d);
  --gridc: light-dark(rgba(19,55,43,.055), rgba(223,233,223,.045));
  --band: light-dark(#13372b, #cfe0d3);
  --band-ink: light-dark(#e6eee5, #0f1f19);
  --ui: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display: "Marcellus", "Songti SC", "Noto Serif SC", Georgia, serif;
  --k-kw: light-dark(#13372b, #e9f2e8); --k-fn: light-dark(#1f6a50, #8fd1b0); --k-str: light-dark(#7a5a2a, #d9bf8c);
  --k-com: light-dark(#87998f, #5f7a6c); --k-num: light-dark(#7a5a2a, #d9bf8c); --k-self: light-dark(#4f6f62, #a8c4b5); --k-p: light-dark(#6f857a, #86a093);
  background-image: linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px);
  background-size: 44px 44px;
}
.board[data-v="art"] .frame-deco { display: block; position: absolute; inset: 8px; border: 1px solid var(--rule); pointer-events: none; z-index: 3; }
.board[data-v="art"] .frame-deco::after { content: ""; position: absolute; inset: 4px; border: .5px solid var(--rule); }
.board[data-v="art"] .card { background: var(--paper); border: 1px solid var(--rule); outline: .5px solid var(--rule); outline-offset: 3px; overflow: visible; display: flex; flex-direction: column; }
.board[data-v="art"] .card.sel { border-width: 1.5px; outline: 1px solid var(--ink); outline-offset: 5px; }
.board[data-v="art"] .chead { order: 0; justify-content: center; height: auto; padding: 10px 14px 0; gap: 10px; font: 400 9.5px var(--mono); letter-spacing: .32em; color: var(--ink-2); text-transform: uppercase; }
.board[data-v="art"] .step::before { content: "NO.\00a0"; }
.board[data-v="art"] .ctitle, .board[data-v="art"] .rev { display: none; }
.board[data-v="art"] .cpath { flex: none; }
.board[data-v="art"] .cname { order: 1; display: block; text-align: center; padding: 3px 14px 0; font: 400 17px/1.25 var(--display); color: var(--ink); letter-spacing: .02em; }

.board[data-v="art"] .cmeta { order: 2; display: flex; justify-content: center; gap: 16px; padding: 4px 10px 9px; text-align: center; font: 500 10.5px var(--mono); color: var(--ink); letter-spacing: .06em; }
.board[data-v="art"] .cmeta small { font: 400 8.5px var(--mono); letter-spacing: .24em; color: var(--ink-3); margin-right: 6px; }
.board[data-v="art"] .cmeta div:first-child { display: none; }
.board[data-v="art"] .is-new .cmeta div:last-child { color: var(--k-fn); }
.board[data-v="art"] .code { order: 3; border-top: .5px solid var(--rule); padding: 8px 0 10px; font: 10.5px/19px var(--mono); color: var(--ink); }
.board[data-v="art"] .gutter .no { width: 40px; padding-right: 10px; color: var(--ink-3); }
.board[data-v="art"] .hlrow { background: color-mix(in srgb, var(--k-fn) 10%, transparent); }
.board[data-v="art"] .no.link { color: var(--ink); }
.board[data-v="art"] .kw { color: var(--k-kw); font-weight: 600; } .board[data-v="art"] .fn { color: var(--k-fn); } .board[data-v="art"] .str { color: var(--k-str); } .board[data-v="art"] .com { color: var(--k-com); font-style: italic; }
.board[data-v="art"] .num { color: var(--k-num); } .board[data-v="art"] .self { color: var(--k-self); } .board[data-v="art"] .p { color: var(--k-p); }
.board[data-v="art"] .call { text-decoration: underline .5px var(--k-fn); text-underline-offset: 3px; }
.board[data-v="art"] .caption { display: block; text-align: center; font: 400 9px var(--mono); letter-spacing: .3em; color: var(--ink-2); }
.board[data-v="art"] .edge { fill: none; stroke: var(--rule); stroke-width: 1; }
.board[data-v="art"] .ahead { fill: none; stroke: var(--rule); stroke-width: 1; }
.board[data-v="art"] .port { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.board[data-v="art"] .elabel { font: 9.5px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: .5px solid var(--rule); padding: 4px 9px; }

.board[data-v="art"] .tb-left { left: 0; right: 0; top: 22px; justify-content: center; pointer-events: none; }
.board[data-v="art"] .tb-left .pill { background: none; }
.board[data-v="art"] .bname { flex-direction: column; gap: 6px; }
.board[data-v="art"] .eyebrow { display: block; font: 400 9px var(--mono); letter-spacing: .4em; color: var(--ink-2); padding-bottom: 6px; border-bottom: .5px solid var(--rule); }
.board[data-v="art"] .bn { font: 400 24px/1 var(--display); letter-spacing: .08em; color: var(--ink); }
.board[data-v="art"] .tb-left .chev { display: none; }
.board[data-v="art"] .tb-right { top: 22px; right: 24px; }
.board[data-v="art"] .tb-right .pill { background: none; }
.board[data-v="art"] .tbtn, .board[data-v="art"] .ib { color: var(--ink); font: 400 9.5px var(--mono); letter-spacing: .3em; }
.board[data-v="art"] .focus-btn { display: none; }
.board[data-v="art"] #btnPresent { border: .5px solid var(--rule); background: var(--paper); height: 26px; }

.board[data-v="art"] .dock { bottom: 22px; }

.board[data-v="art"] .dock .ib { color: var(--band-ink); font: 400 9.5px var(--mono); letter-spacing: .3em; padding: 0 10px; }
.board[data-v="art"] .dock .ib .ico { display: none; }
.board[data-v="art"] .dock .lab { display: inline; }
.board[data-v="art"] .dock .ib:not([aria-label]) + .ib:not([aria-label])::before { content: "·"; position: relative; left: -10px; opacity: .5; }
.board[data-v="art"] .dock .ib[aria-label] .ico { display: block; width: 13px; height: 13px; }
.board[data-v="art"] .sep { width: .5px; height: 14px; background: var(--band-ink); opacity: .4; margin: 0 6px; }
.board[data-v="art"] .zoom { color: var(--band-ink); font: 400 10px var(--mono); letter-spacing: .1em; }
.board[data-v="art"] .toast { bottom: 66px; background: var(--paper); border: .5px solid var(--rule); outline: .5px solid var(--rule); outline-offset: 2px; color: var(--ink); font: 400 10px var(--mono); letter-spacing: .2em; padding: 7px 14px; }

/* 竹简：每行代码写在一根竹简上，左边一根宽简竖写编号，两道麻绳穿起来；朱砂做批注色 */
.board[data-v="bamboo"] {
  --bg: light-dark(#ebe4d3, #17120d);
  --tex: light-dark(rgba(90,70,40,.05), rgba(255,220,170,.035));
  --slip: light-dark(#dcc596, #4b3c27);
  --slip-hi: light-dark(#e6d3a8, #574631);
  --gap: light-dark(#9c7d4c, #110c07);
  --grain: light-dark(rgba(110,80,30,.07), rgba(0,0,0,.18));
  --ink: light-dark(#21180e, #f0e3c4);
  --ink-2: light-dark(#5b4630, #c9b48d);
  --ink-3: light-dark(#977c54, #8d7856);
  --zhu: light-dark(#ac2f1b, #ec6a4f);
  --cord: light-dark(#5e3f1d, #b48a52);
  --cord-2: light-dark(#87612f, #7c5b31);
  --selbg: light-dark(rgba(172,47,27,.2), rgba(236,106,79,.32));
  --ui: "Noto Serif SC", "Songti SC", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  background-image: repeating-linear-gradient(0deg, var(--tex) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, var(--tex) 0 1px, transparent 1px 4px);
}
.board[data-v="bamboo"] .card { overflow: visible; display: grid; grid-template-columns: 30px minmax(0, 1fr); background: none;
  filter: drop-shadow(0 1px 1px light-dark(rgba(60,40,10,.25), rgba(0,0,0,.6))) drop-shadow(0 10px 14px light-dark(rgba(60,40,10,.18), rgba(0,0,0,.5))); }
.board[data-v="bamboo"] .card.sel { outline: 1.5px solid var(--zhu); outline-offset: 5px; border-radius: 2px; }
/* 首简：竖写编号 */
.board[data-v="bamboo"] .cside { display: flex; grid-column: 1; grid-row: 1 / 4; justify-content: center; padding-top: 12px; margin-right: 2px; border-radius: 3px 0 0 3px;
  background: linear-gradient(90deg, var(--slip-hi), var(--slip)); box-shadow: inset -1px 0 0 var(--gap); }
.board[data-v="bamboo"] .cside span { writing-mode: vertical-rl; font: 400 15px/1 var(--brush); color: var(--zhu); letter-spacing: .12em; }
/* 标题简 */
.board[data-v="bamboo"] .chead { grid-column: 2; grid-row: 1; height: 30px; padding: 0 26px 0 10px; background: var(--slip-hi); border-bottom: 2px solid var(--gap); border-radius: 0 3px 0 0; }
.board[data-v="bamboo"] .step { display: none; }
.board[data-v="bamboo"] .ctitle { font: 600 12px var(--mono); color: var(--ink); }
.board[data-v="bamboo"] .cpath { font: 10.5px var(--mono); color: var(--ink-3); }
.board[data-v="bamboo"] .rev { font: 10px var(--mono); color: var(--ink-3); }
.board[data-v="bamboo"] .rev.new { font: 400 12px var(--brush); color: var(--slip-hi); background: var(--zhu); padding: 1px 5px 0; border-radius: 2px; letter-spacing: .1em; }
.board[data-v="bamboo"] .cnote { display: block; grid-column: 2; grid-row: 2; padding: 3px 26px 2px 10px; font: 400 14px/20px var(--brush); color: var(--ink-2); background: var(--slip); border-bottom: 2px solid var(--gap); letter-spacing: .06em; }
/* 正文：一行一简，简与简之间留一道缝 */
.board[data-v="bamboo"] .code { grid-column: 2; grid-row: 3; padding: 0; font: 10.5px/19px var(--mono); color: var(--ink); border-radius: 0 0 3px 0;
  background: repeating-linear-gradient(90deg, var(--grain) 0 1px, transparent 1px 9px), repeating-linear-gradient(180deg, transparent 0 38px, var(--grain) 38px 57px, transparent 57px 76px, rgba(255,255,255,.06) 76px 95px), repeating-linear-gradient(180deg, var(--slip) 0 17px, var(--gap) 17px 19px); }
.board[data-v="bamboo"] .code::before, .board[data-v="bamboo"] .code::after { content: ""; position: absolute; top: -52px; bottom: -4px; width: 3px; z-index: 2; border-radius: 2px;
  background: repeating-linear-gradient(160deg, var(--cord) 0 3px, var(--cord-2) 3px 5px); box-shadow: 1px 0 1px rgba(0,0,0,.25); }

const BASECFG = Object.assign({}, CFG), VCFG = {"v1": {"head": "triangle"}, "warm": {}, "graphite": {}, "draft": {"route": "elbow", "head": "triangle", "port": "square", "gap": 150}, "soft": {"head": "dot", "gap": 150, "pad": {"l": 84, "r": 28, "t": 96, "b": 84}}, "color": {"head": "triangle", "gap": 150}, "news": {"head": "triangle", "gap": 150, "pad": {"l": 40, "r": 40, "t": 120, "b": 80}}, "art": {"port": "diamond", "gap": 150, "pad": {"l": 44, "r": 44, "t": 100, "b": 84}}, "bamboo": {"head": "dot", "gap": 140, "pad": {"l": 28, "r": 28, "t": 70, "b": 72}}, "ink": {"head": "dot", "gap": 150, "pad": {"l": 32, "r": 32, "t": 78, "b": 76}, "defs": "<defs><filter id=\"brush\" filterUnits=\"userSpaceOnUse\" x=\"-3000\" y=\"-3000\" width=\"8000\" height=\"8000\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".9\" numOctaves=\"2\" seed=\"2\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/></filter></defs>"}, "clay": {"head": "dot", "gap": 150, "pad": {"l": 40, "r": 40, "t": 80, "b": 84}, "defs": "<defs><filter id=\"isoShadow\" filterUnits=\"userSpaceOnUse\" x=\"-3000\" y=\"-3000\" width=\"8000\" height=\"8000\"><feDropShadow dx=\"3\" dy=\"3\" stdDeviation=\"0\" flood-opacity=\".22\"/></filter></defs>"}, "city": {"route": "street", "head": "car", "merge": true, "port": "circle", "gap": 240, "layers": ["casing", "road", "lane"], "pad": {"l": 32, "r": 32, "t": 74, "b": 76}}}, NOTES = {"v1": "<h2>v1 现状</h2><p>整体干净，但材质偏「网页 div」：实线边框、同一种阴影、强调色用得太多。</p>", "warm": "<h2>暖墨 · 已选定</h2><p>延续 v1 的暖灰和陶土色，把材质做实：0.5px 发丝线加三层阴影，工具条磨砂半透明，强调色只留给「选中」和「箭头出发的那一行」。</p>", "graphite": "<h2>石墨</h2><p>中性灰，强调色跟随 VS Code 的 focus 颜色，和编辑器融为一体，最接近原生 macOS app。</p>", "draft": "<h2>制图</h2><p>参考 Merit 的唇笔图纸。只有墨和线，没有颜色、阴影和圆角。</p><ul>\n<li><b>箭头</b>走直角虚线，像标注引线；起点是代码行右侧的小方块。</li>\n<li><b>便签</b>是细节标注框，用点线引到某一行。</li>\n<li><b>新版本</b>是实心方块，旧版本是空心方块。</li>\n<li><b>选中</b>是外面再套一圈虚线框。</li></ul>\n<h3>取舍</h3><ul><li>最安静，截图放进文档最好看。</li><li>没有颜色，卡片一多，状态不容易一眼看到。</li><li>缩小后 1px 细线会发虚，要按缩放加粗。</li></ul>", "soft": "<h2>柔光</h2><p>参考白色手表商店那张：大留白、细字重、大面积柔和投影，珊瑚色只用在一个圆按钮和几个小点上。底色带一点暖。</p><ul>\n<li><b>代码</b>放在卡片里一块下沉的凹槽中，这是「拟物」的部分。</li>\n<li><b>白板列表</b>做成左侧竖排的标签栏，当前白板下面一条珊瑚短线。</li>\n<li><b>讲解</b>是右下角的珊瑚色圆形按钮。</li>\n<li><b>新版本</b>是一颗珊瑚色小圆点，像购物车角标。</li></ul>\n<h3>取舍</h3><ul><li>最「产品化」，演示时很体面。</li><li>大投影和大圆角很占地方，半宽 webview 里卡片之间要拉得更开。</li><li>深色主题下拟物感会弱很多。</li></ul>", "color": "<h2>多彩卡片</h2><p>参考 Marigold：奶油底、2px 墨线、直角，颜色成块使用。</p><ul>\n<li><b>每个源文件一种颜色</b>：llm_engine 橙、scheduler 黄、model_runner 青，卡片顶部是这块颜色加一个小图形和大号编号。</li>\n<li><b>卡片头</b>分成格子：步骤号、文件名、版本状态；底部格子放行号区间和「跟进到最新」。</li>\n<li><b>斜体衬线</b>那一行是卡片的一句话说明，相当于标题下的批注。</li>\n<li><b>讲解进度</b>是右上角的小方格，走到哪一步就填哪一格。</li>\n<li><b>选中</b>是右下方的实心偏移投影。</li></ul>\n<h3>取舍</h3><ul><li>辨识度最高，一眼分清哪张卡来自哪个文件。</li><li>颜色块占高度，卡片一多会很热闹；文件超过 6–8 个时颜色要复用。</li></ul>", "news": "<h2>报纸</h2><p>新闻纸底、黑色油墨，整块白板排成一张报纸的版面。</p><ul>\n<li><b>白板名</b>是报头：哥特体报名，下面一行期号和提交号，再加一道双线。</li>\n<li><b>每张卡片是一篇报道</b>：顶部粗线，眉题写「第 1.1 版 · 文件名」，函数名是粗体大标题，斜体导语是一句话说明。</li>\n<li><b>代码</b>用打字机字体，像报道里的引文。</li>\n<li><b>新版本</b>是一枚红色小印章，提示条是黑底的「快讯」。</li>\n<li><b>箭头上的数据</b>写成斜体，两边加破折号，像图片说明。</li></ul>\n<h3>取舍</h3><ul><li>阅读感最强，适合讲解或导出成长图。</li><li>标题和导语占高度，代码区域比暖墨小。</li><li>几乎没有颜色，状态要靠印章和粗细来区分。</li></ul>", "art": "<h2>艺术</h2><p>参考 Severance 晚宴海报：薄荷纸、深绿油墨、双线框、居中排版、字距拉得很开。</p><ul>\n<li><b>白板</b>四周有双线边框，背景是很淡的方格纸（这是风格的一部分，可以去掉）。</li>\n<li><b>卡片头</b>居中：编号和文件名、衬线大标题、文件 / 行 / 提交三栏信息。</li>\n<li><b>图注</b>写在卡片下方，像插图编号：FIG. 1.1 — THE BATCH IS CHOSEN。</li>\n<li><b>工具条</b>是一条深绿色色带，按钮是字距拉开的文字。</li></ul>\n<h3>取舍</h3><ul><li>最有个性，截图分享最好看。</li><li>头部很高，同样大小的白板能放的代码最少。</li><li>双线和网格缩小后会变成噪点。</li></ul>", "bamboo": "<h2>竹简</h2><p>每张卡片是一卷竹简：一行代码写在一根简上，简与简之间留一道缝，两道麻绳从头穿到尾。</p><ul>\n<li><b>首简</b>是左边一根宽简，竖着写编号「一之一」，用朱砂。</li>\n<li><b>标题简</b>写函数名，下面一根简用毛笔字写这张卡的一句话说明。</li>\n<li><b>朱砂</b>是唯一的颜色，相当于古人的批注：关键字、可展开的调用、箭头出发的那一行。</li>\n<li><b>连线</b>是麻绳，两头打结；箭头上的数据挂在一块小木签上。</li>\n<li><b>有新版本</b>是一枚朱红小印。</li></ul>\n<h3>取舍</h3><ul><li>代码行和竹简一一对应，行感很强，读长函数时眼睛不容易串行。</li><li>行距被竹简锁死在 19px，用户改字号时竹简要跟着变宽。</li><li>首简占掉 30px 宽度，半宽 webview 里代码区更窄。</li></ul>", "ink": "<h2>水墨</h2><p>宣纸底，下方几层淡墨远山，一缕雾慢慢左右飘（70 秒一个来回，几乎感觉不到）。不画太阳。浅色是一幅画；深色换成碑帖拓片，黑底白字。</p><ul>\n<li><b>编号</b>是一枚白文朱印「一之一」，盖在卡片右上角；<b>有新版本</b>是朱文印「新」，红框红字。</li>\n<li><b>标题下</b>是一笔干笔墨痕，代替分隔线。</li>\n<li><b>代码配色</b>用国画颜料：函数是花青，字符串和数字是赭石，关键字是浓墨，朱砂只标可展开的调用。</li>\n<li><b>连线</b>是毛笔线，边缘有一点纸纹的毛刺；起止都是一个墨点。</li>\n<li><b>工具条</b>是一条素宣纸，一侧搁着一支毛笔。</li>\n<li><b>讲解</b>按钮是一枚朱印，按下去像盖章；白板名用行草写，后面盖一枚「白板」小印。</li></ul>\n<h3>取舍</h3><ul><li>最安静、最有中文气质，适合长时间读代码。</li><li>远山和雾在卡片很多时几乎被挡住，主要在空白处起作用。</li><li>毛笔线用了 SVG 滤镜，连线多时要关掉滤镜保性能。</li></ul>", "clay": "<h2>3D · 等距积木</h2><p>白板是一张等距网格纸，卡片是一块块往右下方挤出厚度的彩色积木，像等距视角的小游戏。和柔光的白色软阴影正好相反：实心的厚度、黑色描边、饱和色。</p><ul>\n<li><b>每个源文件一种颜色</b>：llm_engine 是珊瑚红，scheduler 是青绿，model_runner 是靛蓝。标题带和侧面都是这个颜色。</li>\n<li><b>选中</b>就是积木被抬起来：往左上移一点，厚度从 9px 变成 13px，外面一圈黄色。</li>\n<li><b>连线</b>是一根黑色粗线，影子朝同一个方向，看起来也有厚度；起点是黄色小圆钮。</li>\n<li><b>标签、工具条、按钮</b>都是同一套积木按键，按下去会往右下沉，厚度消失。</li>\n<li><b>有新版本</b>和白板名都是黄色积木块。</li></ul>\n<h3>取舍</h3><ul><li>立体感来自固定方向的厚度，没有倾斜和透视，文字始终是正的，也没有常驻动画。</li><li>颜色重、描边粗，卡片很多时会很热闹；文件超过 6 个时颜色要复用。</li><li>右下方的厚度会占掉一点空间，卡片之间要多留 10px。</li></ul>", "city": "<h2>城市道路</h2><p>白板是一张平面城市地图：街区、河流、公园做底，调用关系画成真正的马路。</p><ul>\n<li><b>连线</b>是马路：灰色路面、白色路沿、黄色中线，横平竖直，拐角是圆的。</li>\n<li><b>箭头</b>换成一辆小车：停在路的尽头，车头朝着被调用的卡片。</li>\n<li><b>几张卡同时调用一张卡</b>时，几条路在这张卡前面的同一个路口汇合，最后一段路共用，只停一辆车。演示里多了一张 ModelRunner.loop：其他 rank 的进程在这里收到命令后，也会走到 run。</li>\n<li><b>卡片标题</b>是蓝底白字的路牌；<b>编号</b>是红色的国道牌，比如 G1.1。</li>\n<li><b>箭头上的数据</b>写在绿色的高速指路牌上。</li>\n<li><b>有新版本</b>是橙白相间的施工牌。</li>\n<li><b>工具条</b>是一整块蓝色标识牌，按钮是牌上的白色图标，缩放比例只是牌角的一行小字；右上角是一盏红绿灯（车流开关，绿灯表示车在开）加一块写着「讲解」的标识牌。</li>\n<li><b>车流</b>：右上角的红绿灯可以开关。打开时小车从调用行出发，沿着路开到被调用的卡片前，靠右行驶；系统开了「减少动态效果」时不显示。</li>\n<li><b>深色</b>是夜里的地图：路面暗下来，中线和车灯是暖黄色。</li></ul>\n<h3>取舍</h3><ul><li>方向感最强：一眼能看出谁调用谁、数据往哪儿流。</li><li>马路比普通连线宽很多，卡片之间要留出路的宽度。</li><li>车流是常驻动画，在 VS Code 里建议默认关掉，由用户自己打开；白板不在前台时暂停。</li><li>汇合后共用的最后一段上放不下各自的数据牌，所以牌子挂在每条路的起点那段。</li></ul>"}, SCENES = {"ink": "<svg viewBox=\"0 0 800 640\" preserveAspectRatio=\"xMidYMax slice\">\n  <defs>\n    <filter id=\"paper\" x=\"0\" y=\"0\" width=\"100%\" height=\"100%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".9\" numOctaves=\"2\" seed=\"3\"/><feColorMatrix values=\"0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .06 0\"/></filter>\n    <filter id=\"wash\" x=\"-10%\" y=\"-30%\" width=\"120%\" height=\"160%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".012 .05\" numOctaves=\"3\" seed=\"7\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"26\"/><feGaussianBlur stdDeviation=\"2.4\"/></filter>\n    <filter id=\"fog\"><feGaussianBlur stdDeviation=\"18\"/></filter>\n    <linearGradient id=\"fade\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".75\" stop-color=\"#fff\" stop-opacity=\".25\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/></linearGradient>\n    <mask id=\"mfade\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"640\" fill=\"url(#fade)\"/></mask>\n  </defs>\n  <rect width=\"800\" height=\"640\" filter=\"url(#paper)\"/>\n  <g mask=\"url(#mfade)\">\n    <path class=\"mtn\" opacity=\".13\" filter=\"url(#wash)\" d=\"M-20 470 C60 420 110 360 170 380 S260 300 330 340 420 280 480 330 560 300 620 260 700 330 820 300 V640 H-20Z\"/>\n    <path class=\"mtn\" opacity=\".2\" filter=\"url(#wash)\" d=\"M-20 520 C40 500 90 430 150 455 S240 410 300 450 380 470 430 430 520 380 590 420 680 460 820 420 V640 H-20Z\"/>\n    <path class=\"mtn\" opacity=\".32\" filter=\"url(#wash)\" d=\"M420 640 C460 590 500 520 560 540 S650 480 700 520 760 560 820 540 V640Z\"/>\n  </g>\n  <ellipse class=\"mist\" cx=\"300\" cy=\"470\" rx=\"320\" ry=\"26\" filter=\"url(#fog)\" opacity=\".9\"/>\n  <ellipse class=\"mist\" cx=\"620\" cy=\"540\" rx=\"260\" ry=\"20\" filter=\"url(#fog)\" opacity=\".8\" style=\"animation-delay:-30s\"/>\n</svg>\n", "city": "<svg viewBox=\"0 0 800 640\" preserveAspectRatio=\"xMidYMid slice\">\n  <path class=\"river\" d=\"M-40 560 C120 520 210 600 330 560 S520 470 600 520 760 600 860 560 L860 620 C760 650 640 590 560 580 S380 640 300 625 120 590 -40 625Z\"/>\n  <path class=\"park\" d=\"M60 70 h150 a14 14 0 0 1 14 14 v80 a14 14 0 0 1 -14 14 h-150 a14 14 0 0 1 -14 -14 v-80 a14 14 0 0 1 14 -14z\"/>\n  <path class=\"park\" d=\"M610 430 h120 a14 14 0 0 1 14 14 v50 a14 14 0 0 1 -14 14 h-120 a14 14 0 0 1 -14 -14 v-50 a14 14 0 0 1 14 -14z\"/>\n  <g class=\"trees\"><circle cx=\"90\" cy=\"110\" r=\"9\"/><circle cx=\"118\" cy=\"128\" r=\"11\"/><circle cx=\"160\" cy=\"100\" r=\"8\"/><circle cx=\"186\" cy=\"140\" r=\"10\"/><circle cx=\"640\" cy=\"465\" r=\"9\"/><circle cx=\"676\" cy=\"480\" r=\"11\"/><circle cx=\"712\" cy=\"458\" r=\"8\"/></g>\n  <g class=\"bldg\"><rect x=\"300\" y=\"60\" width=\"40\" height=\"28\" rx=\"3\"/><rect x=\"350\" y=\"60\" width=\"26\" height=\"40\" rx=\"3\"/><rect x=\"420\" y=\"70\" width=\"52\" height=\"24\" rx=\"3\"/><rect x=\"40\" y=\"420\" width=\"44\" height=\"30\" rx=\"3\"/><rect x=\"96\" y=\"410\" width=\"30\" height=\"44\" rx=\"3\"/><rect x=\"250\" y=\"440\" width=\"60\" height=\"22\" rx=\"3\"/><rect x=\"560\" y=\"70\" width=\"34\" height=\"34\" rx=\"3\"/><rect x=\"690\" y=\"90\" width=\"48\" height=\"26\" rx=\"3\"/></g>\n</svg>\n"};
function setV(v) {
  board.dataset.v = v; board.querySelector('.scene').innerHTML = SCENES[v] || ''; CFG = Object.assign({}, BASECFG, VCFG[v]);
  document.querySelectorAll('#segV button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v));
  document.getElementById('notes').innerHTML = NOTES[v] + '<p class="tip">切换深浅主题看两边是否都成立。所有风格用的是同一份白板数据。</p>';
  render();
}
document.getElementById('segV').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setV(b.dataset.v); });
setV('warm');

document.fonts && document.fonts.ready.then(layout);
</script>

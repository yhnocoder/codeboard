<title>CodeBoard 材质</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&family=DM+Mono:wght@400;500&family=Archivo:wght@500;600&family=Jost:wght@300;400;500;600&family=Fraunces:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Marcellus&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=UnifrakturMaguntia&display=swap">
<style>
/* 页面外框：上方切换条；左边模拟 VS Code 半屏 webview 里的白板，右边是这种风格的取舍 */
:root {
  color-scheme: light;
  --page: light-dark(#f5f4f1, #141413);
  --page-ink: light-dark(#23211d, #ecebe7);
  --page-ink-2: light-dark(#6a665e, #a19d95);
  --page-hair: light-dark(rgba(40,30,10,.12), rgba(255,250,240,.1));
  --seg-bg: light-dark(rgba(40,30,10,.06), rgba(255,250,240,.07));
  --seg-on: light-dark(#ffffff, #3a3936);
  --vs-tabs: light-dark(#f3f3f3, #252526);
  --vs-tab-on: light-dark(#ffffff, #1e1e1e);
  --vs-ink: light-dark(#333333, #cccccc);
  --vs-ink-2: light-dark(#8a8a8a, #8b8b8b);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
/* 页面里的「浅 / 深」按钮：宿主会改写 html 上的 data-theme，所以设在 body 上 */
body[data-mode="dark"] { color-scheme: dark; }
body[data-mode="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font: 13px/1.5 var(--sys); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.chrome, .chrome * { user-select: none; -webkit-user-select: none; cursor: default; -webkit-user-drag: none; }
.chrome .src, .chrome .src * { user-select: text; -webkit-user-select: text; cursor: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.chrome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
header h1 { font: 600 17px/1.2 var(--sys); margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--page-ink-2); font-size: 12.5px; }
.grow { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--seg-bg); gap: 2px; }
.seg button { padding: 3px 11px; border-radius: 6px; font-size: 12.5px; color: var(--page-ink-2); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--page-ink); box-shadow: 0 0 0 .5px var(--page-hair), 0 1px 2px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--page-ink-2); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 24px; align-items: start; }
@media (max-width: 940px) { .main { grid-template-columns: minmax(0, 1fr); } }
.frame { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px var(--page-hair), 0 12px 40px -16px light-dark(rgba(40,30,10,.25), rgba(0,0,0,.7)); min-width: 0; }
.tabs { height: 34px; background: var(--vs-tabs); display: flex; align-items: stretch; font-size: 12.5px; color: var(--vs-ink-2); }
.tabs .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.tabs .tab.on { background: var(--vs-tab-on); color: var(--vs-ink); }

/* ---------- 白板骨架：只管位置，长相交给各风格 ---------- */
.board { position: relative; height: 640px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); }
@media (max-width: 600px) { .board { height: 540px; } }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; width: 1px; height: 1px; }
.card { position: absolute; overflow: hidden; }
.cband, .cname, .cmeta, .cnote, .cfoot, .caption, .rail, .dim, .eyebrow, .prog, .lab, .frame-deco { display: none; }
.chead { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ctitle, .cpath { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cpath { flex: 1 1 0; }
.rev { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.code { white-space: pre; }
.code { display: flex; position: relative; }
/* 代码是一整段 <pre>：选区连续，复制出来就是原文；行号在旁边单独一列，选不中 */
.gutter { flex: none; position: relative; z-index: 1; }
.gutter .no { display: block; text-align: right; font-variant-numeric: tabular-nums; }
.src { flex: 1; min-width: 0; margin: 0; padding: 0; font: inherit; color: inherit; white-space: pre; overflow: hidden; position: relative; z-index: 1;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.src::selection, .src *::selection { background: var(--selbg, color-mix(in srgb, var(--accent, #c15f3c) 26%, transparent)); }
.hlrow { position: absolute; left: 0; right: 0; pointer-events: none; }
.elabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.caption { position: absolute; }
.over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.tb-left { left: 12px; top: 10px; }
.tb-right { right: 12px; top: 10px; }
.dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.pill { display: inline-flex; align-items: center; gap: 2px; }
.bname { display: inline-flex; align-items: center; gap: 4px; }
.ib { height: 28px; min-width: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.zoom { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.toast { position: absolute; z-index: 6; left: 50%; bottom: 62px; transform: translateX(-50%); white-space: nowrap; display: flex; gap: 10px; align-items: center; }

/* ---------- 右侧说明 ---------- */
.notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.notes h2 { font: 600 15px/1.3 var(--sys); margin: 0; }
.notes p { margin: 0; color: var(--page-ink-2); font-size: 12.5px; line-height: 1.6; }
.notes h3 { font: 600 12.5px var(--sys); margin: 4px 0 0; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li { font-size: 12.5px; line-height: 1.55; padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--page-ink-2); }
.notes .fuse { padding: 12px; border-radius: 8px; background: var(--seg-bg); display: flex; flex-direction: column; gap: 6px; }

.board { --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --serif: "Source Serif 4", "Songti SC", "Noto Serif SC", Georgia, serif; }
.board {
  /* v1 */
  --bg: light-dark(#f4f2ec, #1b1a18); --surface: light-dark(#ffffff, #2a2926); --head: var(--surface);
  --ink: light-dark(#1f1e1b, #ece9e1); --ink-2: light-dark(#5d5a53, #b4afa5); --ink-3: light-dark(#8f8a80, #868177);
  --line: light-dark(#e3dfd4, #3a3833); --hair: var(--line);
  --accent: light-dark(#c15f3c, #db7a56); --accent-ink: light-dark(#fff, #1b1a18);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: light-dark(#c48a1f, #e0b055); --ok: light-dark(#5a8a4c, #8dbb79);
  --row: light-dark(#f8e8dc, #43302a);
  --k-kw: light-dark(#9a3f22, #e59572); --k-fn: light-dark(#2e5d86, #86b4de); --k-str: light-dark(#4a7536, #a3c98c);
  --k-com: light-dark(#9a958a, #7d786e); --k-num: light-dark(#8a6416, #d9b36a); --k-self: light-dark(#7a4f9a, #c8a3e6); --k-p: light-dark(#6f6a62, #a39e93);
  --sh-card: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --sh-float: 0 1px 2px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.3)), 0 4px 14px light-dark(rgba(40,30,10,.05), rgba(0,0,0,.2));
  --glass: var(--surface); --ui: var(--sys); --title: var(--serif);
  position: relative; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--ui);
}
.board[data-v="warm"] {
  --bg: light-dark(#eeece6, #191816); --surface: light-dark(#fdfcfa, #252422); --head: light-dark(#f8f6f1, #2a2926);
  --ink: light-dark(#211f1b, #ece8e0); --ink-2: light-dark(#625e56, #aca79d); --ink-3: light-dark(#9a958b, #78746c);
  --line: light-dark(rgba(60,45,20,.09), rgba(255,240,220,.07)); --hair: light-dark(rgba(60,45,20,.16), rgba(255,240,220,.11));
  --accent: light-dark(#b5552d, #e3895f); --row: color-mix(in srgb, var(--accent) 9%, transparent);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,.9), rgba(255,245,230,.06)),
    0 1px 1px light-dark(rgba(50,35,10,.04), rgba(0,0,0,.25)), 0 3px 8px -2px light-dark(rgba(50,35,10,.06), rgba(0,0,0,.3)),
    0 18px 36px -14px light-dark(rgba(50,35,10,.16), rgba(0,0,0,.55));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(50,35,10,.08), rgba(0,0,0,.35)), 0 10px 28px -8px light-dark(rgba(50,35,10,.18), rgba(0,0,0,.55));
  --glass: light-dark(rgba(253,252,250,.72), rgba(42,41,38,.66));
}
.board[data-v="graphite"] {
  --bg: light-dark(#ebebed, #1b1b1d); --surface: light-dark(#ffffff, #28282b); --head: light-dark(#fbfbfc, #2d2d30);
  --ink: light-dark(#1d1d1f, #f2f2f4); --ink-2: light-dark(#6e6e73, #a1a1a6); --ink-3: light-dark(#a0a0a6, #6c6c72);
  --line: light-dark(rgba(0,0,0,.07), rgba(255,255,255,.06)); --hair: light-dark(rgba(0,0,0,.14), rgba(255,255,255,.1));
  --accent: light-dark(#0a6cdc, #4e9cff); --accent-ink: #fff; --row: color-mix(in srgb, var(--accent) 8%, transparent);
  --warn: light-dark(#c27c0e, #f0b440);
  --k-kw: light-dark(#a8329d, #f467ab); --k-fn: light-dark(#2f6f78, #6cc2b4); --k-str: light-dark(#c2361f, #ff7f6b);
  --k-com: light-dark(#7b8692, #7d8894); --k-num: light-dark(#2a2ad0, #d6c36d); --k-self: light-dark(#6c36a8, #b28cf0); --k-p: light-dark(#4c4c52, #b9b9be);
  --sh-card: 0 0 0 .5px var(--hair), inset 0 .5px 0 light-dark(rgba(255,255,255,1), rgba(255,255,255,.07)),
    0 1px 1px light-dark(rgba(0,0,0,.04), rgba(0,0,0,.3)), 0 3px 8px -2px light-dark(rgba(0,0,0,.06), rgba(0,0,0,.35)),
    0 18px 36px -14px light-dark(rgba(0,0,0,.14), rgba(0,0,0,.6));
  --sh-float: 0 0 0 .5px var(--hair), 0 2px 6px -1px light-dark(rgba(0,0,0,.08), rgba(0,0,0,.4)), 0 10px 28px -8px light-dark(rgba(0,0,0,.16), rgba(0,0,0,.6));
  --glass: light-dark(rgba(255,255,255,.7), rgba(44,44,47,.66)); --title: var(--sys);
}

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.board:is([data-v="warm"],[data-v="graphite"]) .edge { stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ahead { fill: var(--ink); }
.board:is([data-v="warm"],[data-v="graphite"]) .ahead { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .port { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.25; }
.board[data-v="v1"] .port { display: none; }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .elabel { position: absolute; transform: translate(-50%, -50%); font: 11px/1 var(--mono); white-space: nowrap; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.board:is([data-v="warm"],[data-v="graphite"]) .elabel { border: 0; color: var(--ink-2); background: var(--surface); box-shadow: 0 0 0 .5px var(--hair), 0 1px 2px light-dark(rgba(0,0,0,.05), rgba(0,0,0,.3)); border-radius: 5px; padding: 4px 7px; }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .card { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-card); overflow: hidden; }
.board:is([data-v="warm"],[data-v="graphite"]) .card { border: 0; border-radius: 9px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft), var(--sh-card); }
.board:is([data-v="warm"],[data-v="graphite"]) .card.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4.5px color-mix(in srgb, var(--accent) 16%, transparent), var(--sh-card); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .chead { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--head); }
.board:is([data-v="warm"],[data-v="graphite"]) .chead { height: 36px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .step { font: 600 10.5px/1 var(--mono); height: 19px; min-width: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.board[data-v="warm"] .step { background: var(--soft); color: var(--accent); border-radius: 5px; font-weight: 600; }
.board[data-v="graphite"] .step { background: none; color: var(--ink-3); padding: 0; min-width: 0; font-weight: 500; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ctitle { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.board:is([data-v="warm"],[data-v="graphite"]) .ctitle { font-size: 12px; letter-spacing: -0.01em; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .cpath { color: var(--ink-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.board:is([data-v="warm"],[data-v="graphite"]) .cpath { font-size: 11px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev { display: inline-flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; flex: none; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev.new { border-color: var(--warn); color: var(--ink-2); background: color-mix(in srgb, var(--warn) 13%, transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .rev.new i { background: var(--warn); }
.board:is([data-v="warm"],[data-v="graphite"]) .rev { border: 0; padding: 0; background: none; }
.board:is([data-v="warm"],[data-v="graphite"]) .rev i { display: none; }
.board:is([data-v="warm"],[data-v="graphite"]) .rev.new { color: var(--warn); }
.board:is([data-v="warm"],[data-v="graphite"]) .rev.new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }

.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .code { padding: 6px 0 8px; font: 11.5px/20px var(--mono); }
.board:is([data-v="warm"],[data-v="graphite"]) .code { font-size: 11px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ln { display: flex; white-space: pre; position: relative; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .gutter .no { width: 40px; text-align: right; padding-right: 12px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; opacity: .8; }
.board:is([data-v="warm"],[data-v="graphite"]) .gutter .no { opacity: .6; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .src { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .hlrow { background: var(--row); }
.board:is([data-v="warm"],[data-v="graphite"]) .no.link { color: var(--accent); opacity: 1; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .kw { color: var(--k-kw); } .fn { color: var(--k-fn); } .str { color: var(--k-str); } .com { color: var(--k-com); font-style: italic; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .num { color: var(--k-num); } .self { color: var(--k-self); } .p { color: var(--k-p); }
.board:is([data-v="warm"],[data-v="graphite"]) .call { text-decoration: underline dotted color-mix(in srgb, var(--k-fn) 55%, transparent); text-underline-offset: 3px; }

/* 浮层：顶栏、工具坞、toast，不随画布缩放 */
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .over { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tb-left { left: 12px; top: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tb-right { right: 12px; top: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .dock { bottom: 12px; left: 50%; transform: translateX(-50%); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-float); border-radius: 9px; padding: 4px; }
.board:is([data-v="warm"],[data-v="graphite"]) .pill { border: 0; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-radius: 10px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .bname { font: 600 14px var(--title); padding: 3px 6px 3px 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.board:is([data-v="warm"],[data-v="graphite"]) .bname { font-size: 13px; }
.board[data-v="graphite"] .bname { font-weight: 600; letter-spacing: -0.01em; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); transition: background .12s, color .12s; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .ib:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tbtn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; color: var(--ink-2); font-size: 12.5px; }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .tbtn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.board:is([data-v="v1"],[data-v="warm"],[data-v="graphite"]) .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }

.board[data-v="soft"] .no.link { color: var(--coral); }
.board[data-v="soft"] .kw { color: var(--k-kw); } .board[data-v="soft"] .fn { color: var(--k-fn); } .board[data-v="soft"] .str { color: var(--k-str); } .board[data-v="soft"] .com { color: var(--k-com); }
.board[data-v="soft"] .num { color: var(--k-num); } .board[data-v="soft"] .self { color: var(--k-self); } .board[data-v="soft"] .p { color: var(--k-p); }

.board[data-v="soft"] .ahead { fill: var(--ink-3); }
.board[data-v="soft"] .port { fill: var(--surface); stroke: var(--coral); stroke-width: 1.5; }
.board[data-v="soft"] .elabel { font: 10.5px var(--mono); color: var(--ink-2); background: var(--surface); border-radius: 999px; padding: 5px 10px; box-shadow: var(--sh-soft); }

  border-right: 1px solid var(--hair); background: color-mix(in srgb, var(--surface) 55%, transparent); }
.board[data-v="soft"] .rail span { writing-mode: vertical-rl; text-orientation: sideways; rotate: 180deg; font: 400 12px var(--ui); color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; position: relative; }
.board[data-v="soft"] .rail span.on { color: var(--ink); }
.board[data-v="soft"] .rail span.on::after { content: ""; position: absolute; left: 50%; bottom: -22px; width: 1px; height: 14px; background: var(--coral); }
.board[data-v="soft"] .tb-left { left: 78px; top: 16px; }

/* 多彩卡片：奶油底、2px 墨线、直角；每个源文件分到一种颜色，卡片顶部是这块颜色加一个小图形 */
.board[data-v="color"] {
  --bg: light-dark(#efe5cf, #1c1813);
  --surface: light-dark(#f7efdd, #262019);
  --ink: light-dark(#2a231c, #f0e6d0);

  --ink-3: light-dark(#8e816f, #8a7f6e);

  --f2: light-dark(#e2a62f, #b08d45);
  --f3: light-dark(#2f6f68, #3c6e68);

  --k-com: light-dark(#9a8c78, #7e7464); --k-num: light-dark(#8a6a12, #e6c26a); --k-self: light-dark(#7b4a7a, #d9a2d6); --k-p: light-dark(#6e6253, #a99d89);

.board[data-v="color"] .card.sel { box-shadow: 6px 6px 0 0 var(--line); }
.board[data-v="color"] .chead { order: 0; height: 30px; gap: 0; border-bottom: 2px solid var(--line); font: 500 9.5px var(--ui); letter-spacing: .2em; text-transform: uppercase; }

.board[data-v="color"] .step::before { content: "STEP\00a0"; }
.board[data-v="color"] .ctitle { display: none; }

.board[data-v="color"] .rev { color: var(--ink-2); gap: 7px; }

.board[data-v="color"] .f1, .board[data-v="color"] .f3 { --bink: var(--paper-ink); } .board[data-v="color"] .f2 { --bink: #2a231c; }
.board[data-v="color"] .bt { font: 600 16px var(--ui); letter-spacing: .03em; color: var(--bink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.board[data-v="color"] .cnote { order: 3; display: block; padding: 9px 14px 8px; font: italic 400 12.5px var(--italic); color: color-mix(in srgb, var(--fc) 70%, var(--ink)); }

.board[data-v="color"] .kw { color: var(--k-kw); } .board[data-v="color"] .fn { color: var(--k-fn); } .board[data-v="color"] .str { color: var(--k-str); } .board[data-v="color"] .com { color: var(--k-com); font-style: italic; }
.board[data-v="color"] .num { color: var(--k-num); } .board[data-v="color"] .self { color: var(--k-self); } .board[data-v="color"] .p { color: var(--k-p); }

.board[data-v="color"] .cfoot { order: 5; display: flex; height: 32px; border-top: 2px solid var(--line); font: 500 9.5px var(--ui); letter-spacing: .2em; text-transform: uppercase; }

const KW = new Set('def return for in if else elif while and or not is None True False class break continue del import from as with lambda yield'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(line, calls) {
  const re = /(#.*$)|("[^"]*"|'[^']*')|(\d+)|([A-Za-z_]\w*)|([^\sA-Za-z_\d"'#]+)|(\s+)/g;
  let out = '', m;
  while ((m = re.exec(line))) {
    const [t, com, str, num, id, p] = m;
    if (com) out += `<span class="com">${esc(t)}</span>`;
    else if (str) out += `<span class="str">${esc(t)}</span>`;
    else if (num) out += `<span class="num">${t}</span>`;
    else if (id) {
      const next = line.slice(re.lastIndex).trimStart()[0];
      if (KW.has(id)) out += `<span class="kw">${id}</span>`;
      else if (id === 'self') out += `<span class="self">${id}</span>`;
      else if (next === '(') out += `<span class="fn${calls.includes(id) ? ' call' : ''}">${id}</span>`;
      else out += id;
    } else if (p) out += `<span class="p">${esc(t)}</span>`;
    else out += t;
  }
  return out;
}

const board = document.getElementById('board'), world = document.getElementById('world'), edges = document.getElementById('edges');

function lineBox(c, i) {

    else svg += `<path class="ahead ${t.file}" d="M${x2 - 5} ${y2 - 4} L${x2} ${y2} L${x2 - 5} ${y2 + 4}"/>`;

function fit() {

const BASECFG = Object.assign({}, CFG), VCFG = {"v1": {"head": "triangle"}, "warm": {}, "graphite": {}, "draft": {"route": "elbow", "head": "triangle", "port": "square", "gap": 150}, "soft": {"head": "dot", "gap": 150, "pad": {"l": 84, "r": 28, "t": 96, "b": 84}}, "color": {"head": "triangle", "gap": 150}, "news": {"head": "triangle", "gap": 150, "pad": {"l": 40, "r": 40, "t": 120, "b": 80}}, "art": {"port": "diamond", "gap": 150, "pad": {"l": 44, "r": 44, "t": 100, "b": 84}}}, NOTES = {"v1": "<h2>v1 现状</h2><p>整体干净，但材质偏「网页 div」：实线边框、同一种阴影、强调色用得太多。</p>", "warm": "<h2>暖墨 · 已选定</h2><p>延续 v1 的暖灰和陶土色，把材质做实：0.5px 发丝线加三层阴影，工具条磨砂半透明，强调色只留给「选中」和「箭头出发的那一行」。</p>", "graphite": "<h2>石墨</h2><p>中性灰，强调色跟随 VS Code 的 focus 颜色，和编辑器融为一体，最接近原生 macOS app。</p>", "draft": "<h2>制图</h2><p>参考 Merit 的唇笔图纸。只有墨和线，没有颜色、阴影和圆角。</p><ul>\n<li><b>箭头</b>走直角虚线，像标注引线；起点是代码行右侧的小方块。</li>\n<li><b>便签</b>是细节标注框，用点线引到某一行。</li>\n<li><b>新版本</b>是实心方块，旧版本是空心方块。</li>\n<li><b>选中</b>是外面再套一圈虚线框。</li></ul>\n<h3>取舍</h3><ul><li>最安静，截图放进文档最好看。</li><li>没有颜色，卡片一多，状态不容易一眼看到。</li><li>缩小后 1px 细线会发虚，要按缩放加粗。</li></ul>", "soft": "<h2>柔光</h2><p>参考白色手表商店那张：大留白、细字重、大面积柔和投影，珊瑚色只用在一个圆按钮和几个小点上。底色带一点暖。</p><ul>\n<li><b>代码</b>放在卡片里一块下沉的凹槽中，这是「拟物」的部分。</li>\n<li><b>白板列表</b>做成左侧竖排的标签栏，当前白板下面一条珊瑚短线。</li>\n<li><b>讲解</b>是右下角的珊瑚色圆形按钮。</li>\n<li><b>新版本</b>是一颗珊瑚色小圆点，像购物车角标。</li></ul>\n<h3>取舍</h3><ul><li>最「产品化」，演示时很体面。</li><li>大投影和大圆角很占地方，半宽 webview 里卡片之间要拉得更开。</li><li>深色主题下拟物感会弱很多。</li></ul>", "color": "<h2>多彩卡片</h2><p>参考 Marigold：奶油底、2px 墨线、直角，颜色成块使用。</p><ul>\n<li><b>每个源文件一种颜色</b>：llm_engine 橙、scheduler 黄、model_runner 青，卡片顶部是这块颜色加一个小图形和大号编号。</li>\n<li><b>卡片头</b>分成格子：步骤号、文件名、版本状态；底部格子放行号区间和「跟进到最新」。</li>\n<li><b>斜体衬线</b>那一行是卡片的一句话说明，相当于标题下的批注。</li>\n<li><b>讲解进度</b>是右上角的小方格，走到哪一步就填哪一格。</li>\n<li><b>选中</b>是右下方的实心偏移投影。</li></ul>\n<h3>取舍</h3><ul><li>辨识度最高，一眼分清哪张卡来自哪个文件。</li><li>颜色块占高度，卡片一多会很热闹；文件超过 6–8 个时颜色要复用。</li></ul>", "news": "<h2>报纸</h2><p>新闻纸底、黑色油墨，整块白板排成一张报纸的版面。</p><ul>\n<li><b>白板名</b>是报头：哥特体报名，下面一行期号和提交号，再加一道双线。</li>\n<li><b>每张卡片是一篇报道</b>：顶部粗线

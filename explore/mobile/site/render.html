<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="board/board.css">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
#root { position: fixed; inset: 0; }
/* tiles show only the board: no chrome, no editing affordances */
.app .bbar, .app .crumbs, .app .toolbar, .app [class*="toolbar"], .app .minimap, .app .zoomer,
.app .eport, .app .grip, .app .sgrip, .app .mkgrip, .app .lgrip, .app [data-tip="More Actions"], .app .port, .app .porthit,
.app .toast, .app .toasts, .app .welcome, .app .over, .app .cutseal { display: none !important; }
</style></head>
<body class="vscode-light"><div id="root"></div>
<script type="module">
// The tile renderer's page (tiles.mjs drives it): the real board on the recorded host messages, the camera set per init
import { boot } from "./board/boot.js";
let listener = () => {};
const deliver = (m) => listener(structuredClone(m));
const metas = await (await fetch("data/index.json")).json();
window.__show = async (id, cam) => {
  const msgs = await (await fetch(`data/${id}.json`)).json();
  window.__msgs = msgs;
  for (const m of msgs) {
    if (m.type === "init") {
      const init = { ...m, boards: metas, board: { ...m.board, cam } };
      // Simplify Below off: the tiles are pictures, never redrawn mid-gesture, so the prose stays text at every level
      init.host = { ...m.host, settings: { ...m.host.settings, simpleBelow: 0 } };
      delete init.welcome;
      deliver(init);
    } else deliver(m);
  }
};
boot({ listen: (fn) => (listener = fn), post: (m) => { if ("req" in m) deliver({ type: "reply", req: m.req, data: null }); } }, { selfCheck: false });
window.__ready = true;
</script></body></html>

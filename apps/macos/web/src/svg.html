<!doctype html>
<!-- The Mac app's SVG rasterizer (CodeBoardCanvas SVGPage): an image file as the board's image card shows it, an <img>
     the given width, as tall as its proportions make it. An SVG in an <img> sees only itself: its own styles and
     variables, and its prefers-color-scheme rules follow the web view's appearance, which is the board's -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  img { display: block; }
</style>
</head>
<body>
<script>
  window.svg = {
    /** shows that file `width` CSS px wide; resolves to its size once it is decoded, and whether it came in */
    async show(src, width) {
      document.body.replaceChildren();
      const img = document.createElement("img");
      img.style.width = `${width}px`;
      img.src = src;
      document.body.append(img);
      const complete = await img.decode().then(() => true, () => false);
      const r = img.getBoundingClientRect();
      await new Promise((ok) => requestAnimationFrame(() => requestAnimationFrame(ok)));
      return { width: r.width, height: r.height, complete };
    },
  };
  window.webkit?.messageHandlers.svg.postMessage("ready");
</script>
</body>
</html>

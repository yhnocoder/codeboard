# Release: bump "version" in extensions/vscode/package.json, merge, then push the tag v<that version> (or run this by hand)
# and this builds a draft GitHub Release with
#   codeboard-vscode-<version>.vsix   the VS Code extension (Extensions view → ⋯ → Install from VSIX…)
#   6 screenshots at 2x               4 features in VS Code light, then every board theme in light and in dark (tools/release/shots.sh)
# The version comes from extensions/vscode/package.json; a tag that names a different version fails the release.
# The release stays a draft until someone publishes it on GitHub. Nothing is published to the Marketplace.
name: Release
on:
  push:
    tags: ["v*"]
  # A PR that changes the release flow runs package + shots as a check; no release is made
  pull_request:
    paths: [".github/workflows/release.yml", "tools/release/**", "extensions/vscode/test/release-shots.cjs", "extensions/vscode/.vscodeignore"]
  # By hand: the draft release is tagged v<package.json version> on this commit when published
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  VSCODE_VERSION: "1.142.0"
  E2E_EXTENSIONS: "ms-python.python@2026.10.0 ms-python.vscode-pylance@2026.4.1"
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          V=$(node -p 'require("./extensions/vscode/package.json").version')
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$V" ]; then
            echo "::error::Tag $TAG does not match extensions/vscode/package.json version $V. Bump the version there first, or tag v$V."; exit 1
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
      - uses: ./.github/actions/setup
      - name: Package the extension
        working-directory: extensions/vscode
        run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: extensions/vscode/*.vsix, retention-days: 30 }

  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vscode
      - uses: ./.github/actions/chromium
      - name: Screenshots (2x, light and dark)
        run: tools/release/shots.sh test-out/release-shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: shots, path: test-out/release-shots, retention-days: 30 }

  release:
    needs: [package, shots]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.package.outputs.version }}
        run: |
          FILES=(out/vsix/*.vsix out/shots/*.png)
          # Re-running for the same version refreshes the files of the existing draft
          if [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release upload "v$V" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            TARGET=(); [ "${{ github.event_name }}" = workflow_dispatch ] && TARGET=(--target "$GITHUB_SHA")
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "CodeBoard $V" "${TARGET[@]}" "${FILES[@]}"
          fi

name: Release
on:
  push:
    tags: ["v*"]
  # A PR that changes the release flow runs package + shots as a check; no release is made
  pull_request:
    paths: [".github/workflows/release.yml", "tools/release/**", "extensions/vscode/test/release-shots.cjs", "extensions/vscode/test/wait.cjs", "extensions/vscode/test/ui.cjs", "extensions/vscode/.vscodeignore"]
  # By hand: without publish_tag, the draft release is tagged v<package.json version> on this commit when published;
  # with publish_tag, the .vsix of that published release is (re)published to the stores, nothing is built
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Publish this already published release (for example v0.2.0) to the Marketplace and Open VSX instead of building a draft"
        required: false
        default: ""
  release:
    types: [published]
# Read-only by default; the release job creates the draft release
permissions:
  contents: read
concurrency:
  group: release-${{ (github.event_name == 'release' || inputs.publish_tag) && format('publish-{0}', github.event.release.tag_name || inputs.publish_tag) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  # box, the index service behind Related by Meaning, built and smoke-tested on each platform's own runner (box.yml)
  box:
    if: github.event_name != 'release' && !inputs.publish_tag
    uses: ./.github/workflows/box.yml
    # a PR that changes the release flow checks packaging with the Linux box only; Windows and macOS only for a release
    with:
      every-platform: ${{ github.event_name != 'pull_request' }}

  package:
    needs: box
    if: github.event_name != 'release' && !inputs.publish_tag
    runs-on: ubuntu-24.04
    env:
      BOX_PREBUILT: "1" # the build would make this machine's box again: the downloaded ones are the ones released
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          V=$(node -p 'require("./extensions/vscode/package.json").version')
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$V" ]; then
            echo "::error::Tag $TAG does not match extensions/vscode/package.json version $V. Bump the version there first, or tag v$V."; exit 1
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
      # every platform's box binary into packages/box/bin, where the extension's build copies them from
      - uses: actions/download-artifact@v7
        with: { pattern: "box-*", path: packages/box/bin, merge-multiple: true }
      - run: chmod +x packages/box/bin/*/box # artifacts lose the executable bit
      - uses: ./.github/actions/setup
      - name: Check every platform's box is in the extension
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then unix="linux-x64 linux-arm64"; win=""; else unix="linux-x64 linux-arm64 darwin-arm64 darwin-x64"; win="win32-x64 win32-arm64"; fi
          for p in $unix; do test -x extensions/vscode/bin/$p/box; done && for p in $win; do test -f extensions/vscode/bin/$p/box.exe; done
      - name: Package the extension
        working-directory: extensions/vscode
        run: npm run package
      - uses: actions/upload-artifact@v6
        with: { name: vsix, path: extensions/vscode/*.vsix, retention-days: 30 }

  shots:
    if: github.event_name != 'release' && !inputs.publish_tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: true }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vscode
      - uses: ./.github/actions/chromium
      - name: Screenshots (2x, light and dark)
        run: tools/release/shots.sh test-out/release-shots
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with: { name: shots, path: test-out/release-shots, retention-days: 30 }

  release:
    needs: [package, shots]
    if: github.event_name != 'pull_request'
    permissions: { contents: write }
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with: { path: out }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.package.outputs.version }}
        run: |
          FILES=(out/vsix/*.vsix out/shots/*.png)
          # Re-running for the same version refreshes the files of the existing draft
          if [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release upload "v$V" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            TARGET=(); [ "${{ github.event_name }}" = workflow_dispatch ] && TARGET=(--target "$GITHUB_SHA")
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "CodeBoard $V" "${TARGET[@]}" "${FILES[@]}"
          fi

  # On a PR that changes the release flow: check that the store tokens are set and still valid (they expire)
  tokens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with: { node-version: 22, package-manager-cache: false }
      # the vsce version npm run package uses (config.vsce)
      - uses: actions/checkout@v6
        with: { sparse-checkout: extensions/vscode/package.json, sparse-checkout-cone-mode: false }
      - name: Check VSCE_PAT for publisher yhnocoder
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT is not set as a repository secret."; exit 0; fi
          npx -y "$(node -p 'require("./extensions/vscode/package.json").config.vsce')" verify-pat yhnocoder
      - name: Check OVSX_PAT for namespace yhnocoder
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT is not set as a repository secret."; exit 0; fi
          npx -y ovsx@1.2.0 verify-pat yhnocoder

  # Only the extension's releases (v*): publishing an Android viewer release raises the same event
  publish:
    if: startsWith(github.event.release.tag_name || inputs.publish_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers to this environment in the repository settings to approve each publish
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with: { node-version: 22, package-manager-cache: false }
      # the vsce version npm run package uses (config.vsce)
      - uses: actions/checkout@v6
        with: { sparse-checkout: extensions/vscode/package.json, sparse-checkout-cone-mode: false }
      - name: Download the .vsix of the release
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.publish_tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != false ]; then
            echo "::error::Release $TAG is not published (or does not exist). Publish the draft on GitHub first."; exit 1
          fi
          VSIX="out/codeboard-vscode-${TAG#v}.vsix"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$VSIX")" --dir out
          if [ ! -s "$VSIX" ]; then echo "::error::Release $TAG has no $(basename "$VSIX")."; exit 1; fi
          echo "path=$VSIX" >> $GITHUB_OUTPUT
      # --skip-duplicate: a version that is already in the store counts as done, so a re-run only fills in what failed
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT is not set: skipped publishing to the VS Code Marketplace."; exit 0; fi
          npx -y "$(node -p 'require("./extensions/vscode/package.json").config.vsce')" publish --packagePath "$VSIX" --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT is not set: skipped publishing to Open VSX."; exit 0; fi
          npx -y ovsx@1.2.0 publish "$VSIX" --skip-duplicate

  # The published release's screenshots go to release/ on the ci-screenshots branch, a fixed address a page can show them from
  # (the "latest release" address cannot serve: the Android viewer's releases are latest too, and carry no pictures)
  pictures:
    if: startsWith(github.event.release.tag_name || inputs.publish_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: { sparse-checkout: tools/review/push-ci-branch.sh, sparse-checkout-cone-mode: false }
      - name: Push the release's screenshots to the ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.publish_tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != false ]; then
            echo "::error::Release $TAG is not published (or does not exist). Publish the draft on GitHub first."; exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.png" --dir out/release
          tools/review/push-ci-branch.sh "release screenshots @ $TAG" out/release release

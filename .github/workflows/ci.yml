name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VSCODE_VERSION: "1.142.0"
  E2E_EXTENSIONS: "ms-python.python@2026.10.0 ms-python.vscode-pylance@2026.4.1"
  # PR: compare with the target branch; push: compare with the previous tip (empty for a new branch)
  BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # unit tests need nano-vllm commit history
      - run: git submodule update --init examples/nano-vllm # the other examples (sglang, DeepEP) are large manual testbeds
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
      - uses: ./.github/actions/chromium
      - name: Markdown demo (@yhnocoder/markdown on its own, built and driven in Chromium)
        run: npm test -w @codeboard/markdown-demo

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    name: harness (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the scenarios are picked from the files changed since the base commit
      - run: git submodule update --init examples/nano-vllm # the other examples (sglang, DeepEP) are large manual testbeds
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Harness scenarios this change needs
        # budget: seconds of scenario time for both jobs together (2 jobs × 4 workers × ~170 s)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/test/harness.mjs --select --base="$BASE_SHA" --budget=1300 --shard=${{ matrix.shard }}/2 --json=test-out/harness/result.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "harness-${{ matrix.shard }}", path: test-out/harness/result.json, retention-days: 14, if-no-files-found: ignore }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { part: [1, 2] }
    name: e2e (${{ matrix.part }}/2)
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init examples/nano-vllm # the other examples (sglang, DeepEP) are large manual testbeds
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vscode
      - name: VS Code e2e (Pylance + UI audit)
        run: E2E_PART=${{ matrix.part }} E2E_OUT=$PWD/test-out/e2e npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "e2e-${{ matrix.part }}", path: test-out/e2e, retention-days: 14 }

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Does the change touch code the benchmarks run?
        id: need
        run: |
          if [ -z "$BASE_SHA" ] || [ "${{ github.event_name }}" = push ]; then echo "run=true" >> $GITHUB_OUTPUT; exit 0; fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/(analysis|board|core|markdown)/(src/|test/(perf|harness)\.ts|vite\.config|package\.json)|packages/host/(src/|test/perf|package\.json)|package-lock\.json|tools/review/perf)'; then echo "run=true" >> $GITHUB_OUTPUT
          else echo "run=false" >> $GITHUB_OUTPUT; echo "No change to code the benchmarks run: perf skipped (the nightly run still measures it)"; fi
      - run: git submodule update --init examples/nano-vllm # the other examples (sglang, DeepEP) are large manual testbeds
        if: steps.need.outputs.run == 'true'
      - uses: ./.github/actions/setup
        if: steps.need.outputs.run == 'true'
      - uses: ./.github/actions/chromium
        if: steps.need.outputs.run == 'true'
      - name: Check out and build base
        if: steps.need.outputs.run == 'true' && env.BASE_SHA != ''
        run: tools/review/checkout-base.sh "$BASE_SHA" base
      - name: Perf, base vs head
        if: steps.need.outputs.run == 'true'
        # takes about 4 minutes; a stuck runner shows no output, so fail it instead of waiting out the job
        timeout-minutes: 10
        run: tools/review/perf-ab.sh "${{ env.BASE_SHA != '' && 'base' || '' }}" test-out/perf quick
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.need.outputs.run == 'true' }}
        with: { name: perf, path: test-out/perf, retention-days: 14 }

  report:
    needs: [harness, e2e, perf]
    # !cancelled(), not always(): a run superseded by a newer push must stop at once, since the newer run waits for it (concurrency group)
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm i -g npm@11.21.1
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/chromium
      - uses: actions/download-artifact@v4
        with: { path: test-out/artifacts }
      - name: Diff and publish screenshots
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          A=test-out/artifacts
          # A PR stacked on another PR's branch: that PR's shots are its baseline (no push run stores the branch); main as the last resort
          if [ "${{ github.event_name }}" = pull_request ]; then KEY="pr/${{ github.event.pull_request.number }}"
            BASEPR=$(gh pr list --head "${{ github.base_ref }}" --state all --json number -q '.[0].number' || true)
            BASEKEY="branches/${{ github.base_ref }} ${BASEPR:+pr/$BASEPR} branches/main"
          else KEY="branches/${{ github.ref_name }}"; BASEKEY="$KEY"; fi
          # the e2e parts into one folder; their audit.json files into one list
          mkdir -p $A/e2e; for p in 1 2; do if [ -d $A/e2e-$p ]; then cp -r $A/e2e-$p/. $A/e2e/; mv $A/e2e/audit.json $A/e2e/audit-$p.json 2>/dev/null || true; fi; done
          node -e 'const fs=require("fs"),d=process.argv[1];fs.writeFileSync(d+"/audit.json",JSON.stringify(fs.readdirSync(d).filter(f=>/^audit-\d+\.json$/.test(f)).flatMap(f=>JSON.parse(fs.readFileSync(d+"/"+f,"utf8")))))' $A/e2e
          rm -f $A/e2e/audit-*.json
          # e2e: compared with the last screenshots stored for the target branch
          if ls $A/e2e/*.png >/dev/null 2>&1; then tools/review/publish-shots.sh $A/e2e "$KEY" "$BASEKEY" test-out/e2e-summary.md; fi
      - name: Update the CI section in the PR description
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          JOBS: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require("fs");
            const A = "test-out/artifacts";
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, "utf8") : "");
            const json = (f) => (fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : []);
            // one line per unique warning (rule + element) with the steps it appears in
            const { report } = require(`${process.env.GITHUB_WORKSPACE}/tools/review/audit.cjs`);
            const audit = json(`${A}/e2e/audit.json`);
            const jobs = JSON.parse(process.env.JOBS);
            // Harness: what ran, why, what failed, what was left to the nightly run
            const hr = [1, 2].map((k) => json(`${A}/harness-${k}/result.json`)).filter((x) => x.results);
            const res = hr.flatMap((x) => x.results), deferred = hr[0]?.deferred ?? [];
            const by = Object.entries(res.reduce((m, r) => ((m[r.why] = (m[r.why] || 0) + 1), m), {})).map(([w, n]) => `${n} ${w}`).join(", ");
            const known = [...new Set(res.flatMap((r) => r.known || []))], alone = res.filter((r) => r.alone).map((r) => r.name);
            const harness = !hr.length ? ["**Harness**: no results."] : [
              `**Harness**: ${res.length} scenarios (${by}), ${res.filter((r) => !r.ok).length} failed` + (deferred.length ? `, ${deferred.length} deferred to the nightly run` : ""),
              ...res.filter((r) => !r.ok).map((r) => `- ❌ ${r.name}: ${(r.fails[0] || r.error || "").slice(0, 200)}`),
              ...(known.length ? [`- known failures (tiers.json): ${known.length}`] : []),
              ...(alone.length ? [`- passed only when run alone: ${alone.join(", ")}`] : []),
              ...(deferred.length ? ["", `<details><summary>Deferred</summary>${deferred.join(", ")}</details>`] : []),
            ];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const section = [
              "<!-- ci-screenshots:start -->", "## CI report", "",
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · [Run log](${run}) · ` + Object.entries(jobs).map(([k, v]) => `${k} ${v.result === "success" ? "✅" : v.result === "skipped" ? "–" : "❌"}`).join(" · "), "",
              ...harness, "",
              read(`${A}/perf/summary.md`) || (jobs.perf?.result === "success" ? "**Performance**: skipped, no change to code the benchmarks run." : "**Performance**: no results."), "",
              ...report(audit, "UI audit"), "",
              "<details><summary>e2e screenshots, vs target branch</summary>", "", read("test-out/e2e-summary.md") || "No screenshots.", "</details>",
              "<!-- ci-screenshots:end -->",
            ].join("\n");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const body = pr.body || "";
            const re = /<!-- ci-screenshots:start -->[\s\S]*<!-- ci-screenshots:end -->/;
            const next = re.test(body) ? body.replace(re, section) : `${body}\n\n${section}`;
            await github.rest.pulls.update({ ...context.repo, pull_number: context.issue.number, body: next });

name: Nightly
on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Beijing time, before the replay at 03:00
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
env:
  VSCODE_VERSION: "1.142.0"
  E2E_EXTENSIONS: "ms-python.python@2026.10.0 ms-python.vscode-pylance@2026.4.1"
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    name: harness (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init examples/nano-vllm
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Rebuild the board with source maps (for coverage)
        run: BOARD_SOURCEMAP=1 npm run build -w @codeboard/board
      - name: Every harness scenario, with coverage
        run: node tools/test/harness.mjs --coverage --shard=${{ matrix.shard }}/2 --json=test-out/harness/result.json
      - name: Markdown demo
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npm test -w @codeboard/markdown-demo
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "harness-${{ matrix.shard }}", path: test-out/harness/result.json, retention-days: 14, if-no-files-found: ignore }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3] }
    name: e2e (${{ matrix.part }}/3)
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init examples/nano-vllm
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vscode
      # part 3's export step opens the exported snapshot offline in Playwright's Chromium
      - uses: ./.github/actions/chromium
        if: matrix.part == 3
      - name: VS Code e2e
        run: E2E_PART=${{ matrix.part }} E2E_OUT=$PWD/test-out/e2e npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "e2e-${{ matrix.part }}", path: test-out/e2e, retention-days: 14 }

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git submodule update --init examples/nano-vllm
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Check out and build main as it was a day earlier
        run: |
          BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
          if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then tools/review/checkout-base.sh "$BASE" base; fi
      - name: Perf, a day earlier vs now (and with animated stickers)
        run: tools/review/perf-ab.sh "$([ -d base ] && echo base)" test-out/perf
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: perf, path: test-out/perf, retention-days: 14 }

  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: Open every story
        run: node tools/test/storybook.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: storybook, path: test-out/storybook/result.json, retention-days: 14, if-no-files-found: ignore }

  repeat:
    needs: harness
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the base commit and the diff to it
      - name: Find the previous scheduled nightly run
        id: base
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=30" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and (.conclusion == "success" or .conclusion == "failure"))][0].head_sha // ""') || BASE=""
          if [ -z "$BASE" ]; then
            MSG="no previous finished scheduled nightly run found: nothing repeated"
            echo "::error::Flake repeat: $MSG"
            mkdir -p test-out/harness
            node -e 'require("fs").writeFileSync("test-out/harness/repeat.json", JSON.stringify({ error: process.argv[1], results: [] }))' "$MSG"
          else echo "Flake repeat: scenarios in test files changed since $BASE"; fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - run: git submodule update --init examples/nano-vllm
        if: steps.base.outputs.sha != ''
      - uses: ./.github/actions/setup
        if: steps.base.outputs.sha != ''
      - uses: ./.github/actions/chromium
        if: steps.base.outputs.sha != ''
      - name: Repeat the new and changed scenarios (flakes)
        if: steps.base.outputs.sha != ''
        # a flake is reported, not a red run; a stuck run is cut off here, its results then missing (an error in the report)
        continue-on-error: true
        timeout-minutes: 20
        run: node tools/test/harness.mjs --changed-since="${{ steps.base.outputs.sha }}" --repeat=3 --workers=4 --cap=15 --json=test-out/harness/repeat.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: repeat, path: test-out/harness/repeat.json, retention-days: 14, if-no-files-found: ignore }

  publish:
    needs: [harness, e2e, perf, storybook, repeat]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: test-out/artifacts }
      - name: Publish the impact map
        run: tools/test/publish-impact.sh test-out/artifacts
      - name: Report to the nightly issue
        uses: actions/github-script@v7
        env:
          JOBS: ${{ toJSON(needs) }}
        with:
          script: |
            const { nightlyReport } = await import(`${process.env.GITHUB_WORKSPACE}/tools/test/nightly-report.mjs`);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Same issue as the nightly replay; this run keeps its own hidden markers
            const LABEL = "replay-nightly";
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: LABEL, state: "open", per_page: 1 });
            const issue = open.data[0] || (await github.rest.issues.create({ ...context.repo, title: "Nightly test results", labels: [LABEL],
              body: "The nightly runs (`.github/workflows/nightly.yml`, `replay.yml`) comment here when their set of failures changes, including when everything passes again." })).data;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number, per_page: 100 });
            const r = nightlyReport({ dir: "test-out/artifacts", jobs: JSON.parse(process.env.JOBS), comments: comments.map((c) => c.body || ""), run, sha: context.sha.slice(0, 7),
              tiers: JSON.parse(require("fs").readFileSync(`${process.env.GITHUB_WORKSPACE}/packages/board/test/tiers.json`, "utf8")) });
            core.info(`failing: ${r.fails.length}, flakes: ${r.flaky.flakes.length}, alone: ${r.flaky.alone.length}${r.flaky.error ? `, repeat error: ${r.flaky.error}` : ""}, groups over their limits: ${r.groups.length}; comment: ${r.due}`);
            if (r.due) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: r.body });

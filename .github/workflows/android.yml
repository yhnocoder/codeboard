name: Android
# The phone viewer (apps/android) and the tiles it shows (packages/tiles). On a PR, only what it changes runs:
# - app: the JVM tests, Android lint and the release build (unsigned here) — about 3–4 minutes with Gradle's cache
# - emulator: the instrumented tests (app/src/androidTest: the app against a fake GitHub) on an x86_64 emulator with KVM.
#   Booting the emulator alone takes most of the 5-minute budget of a PR job, so it runs only on PRs that change apps/android
#   and in the regular full run (regular.yml calls this workflow with everything on)
# - tiles: the markdown package, the board and the tile builder built, and the CLI run end to end on a small synthetic
#   board folder (packages/tiles/test/smoke.mjs: zips and index.json in the app's format, an unchanged second run draws
#   nothing, an edit draws only what shows it) — about 3 minutes
on:
  pull_request:
    paths: ["apps/android/**", "packages/tiles/**", ".github/workflows/android.yml"]
  workflow_call:
    inputs:
      everything:
        description: "Run every job whatever changed (the regular full run)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ inputs.everything || steps.f.outputs.app }}
      tiles: ${{ inputs.everything || steps.f.outputs.tiles }}
    steps:
      - uses: actions/checkout@v6
      - id: f
        if: ${{ !inputs.everything }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app: ["apps/android/**", ".github/workflows/android.yml"]
            tiles: ["packages/tiles/**", ".github/workflows/android.yml"]

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: JVM tests, lint, release build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/test-results
          retention-days: 7

  emulator:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      API: 34
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # a booted emulator's snapshot, kept between runs: a cold boot is most of this job
      - uses: actions/cache@v5
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API }}-x86_64-google_apis
      - name: Make the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot made"
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: android-instrumented
          path: apps/android/app/build/reports/androidTests
          retention-days: 7
          if-no-files-found: ignore

  tiles:
    needs: changes
    if: needs.changes.outputs.tiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          build: npm run build -w @yhnocoder/markdown && npm run build -w @codeboard/board && npm run build -w @codeboard/tiles
      - uses: ./.github/actions/chromium
      - name: Unit tests
        run: npm test -w @codeboard/tiles
      - name: The CLI end to end
        run: node packages/tiles/test/smoke.mjs

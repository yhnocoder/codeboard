name: macOS
# The native Mac app (apps/macos): build, unit tests and swift-format's lint. It targets the latest macOS only, so it
# needs the image with Xcode 27 (a preview image on GitHub for now); the newest Xcode on it is selected, which is the
# toolchain the app is developed with.
on:
  pull_request:
    paths: ["apps/macos/**", ".github/workflows/macos.yml"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run: { working-directory: apps/macos }
    steps:
      - uses: actions/checkout@v6
      # the assets the app carries (apps/macos/web: the formula engines, the board's fonts, the SVG page); the tests use them
      - uses: ./.github/actions/setup
        with:
          build: node apps/macos/web/build.mjs
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
          swift --version
      - run: swift build
      - run: swift test
        env:
          # the watchdog dumps every thread's stack to this file if the tests hang (CodeBoardCanvasTests/Watchdog.swift)
          WATCHDOG_FILE: ${{ runner.temp }}/watchdog.txt
      - name: Upload the watchdog's thread dump if the tests hung
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: canvas-test-watchdog
          path: ${{ runner.temp }}/watchdog.txt
          if-no-files-found: ignore
      - run: swift format lint --strict -r Sources Tests Package.swift

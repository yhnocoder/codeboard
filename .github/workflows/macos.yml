name: macOS
# The native Mac app (apps/macos): build, unit tests and swift-format's lint. It targets the latest macOS only, so it
# needs the image with Xcode 27 (a preview image on GitHub for now); the newest Xcode on it is selected, which is the
# toolchain the app is developed with.
# A PR runs two jobs, each meant to end in under 6 minutes: app (one build, the important unit tests and those of what
# the PR changed, picked by tools/tests/pick.mjs from Tests/tiers.json, and the lint) and accept (smoke) (the acceptance
# scenarios in smoke.txt). The regular full run (regular.yml) calls this with everything: every unit test in app and
# the whole acceptance list in two accept jobs.
on:
  pull_request:
    paths: ["apps/macos/**", ".github/workflows/macos.yml"]
  workflow_call:
    inputs:
      everything:
        description: "Run every unit test and the whole acceptance list (the regular full run)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # The acceptance scenarios (apps/macos/tools/accept, ci.mjs): the app driven in its own process beside the web board
  # in headless Chromium, function only (nothing timed), three shots per scenario and side as an artifact. A PR runs the
  # few in smoke.txt in one job; the regular full run all of ci.txt, in two halves side by side
  accept:
    name: accept (${{ inputs.everything && matrix.shard || 'smoke' }})
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.everything && 30 || 6 }}
    env:
      BOX_PREBUILT: "1" # the web side's host runs without box (Related by Meaning off), as the app does
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.everything && '["1/2", "2/2"]' || '["1/1"]') }}
    steps:
      - uses: actions/checkout@v6
      # the web board and its Markdown package, the app's Note page
      - uses: ./.github/actions/setup
        with:
          build: npm run build -w @yhnocoder/markdown && npm run build -w @codeboard/board && node apps/macos/web/build.mjs
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
          swift --version
      - uses: actions/cache@v5
        with:
          path: |
            apps/macos/.build/repositories
            apps/macos/.build/checkouts
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}
      - run: npx playwright-core install chromium
      # (the boards were built above: --skip-build leaves the web builds out; the driver is built, debug, either way)
      - run: >-
          node apps/macos/tools/accept/ci.mjs --list ${{ inputs.everything && 'ci.txt' || 'smoke.txt' }}
          --shard ${{ matrix.shard }} --skip-build
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accept-${{ strategy.job-index }}
          path: |
            apps/macos/.build-accept/*/*.png
            apps/macos/.build-accept/*/*/*.png
            apps/macos/.build-accept/*/*.txt
            apps/macos/.build-accept/*/*/log.txt
          # .build-accept starts with a dot, and upload-artifact leaves hidden folders out unless told
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  app:
    name: app
    runs-on: xcode-27
    # a PR's job is meant to end in under 6 minutes, but compiling takes over a minute longer on some runners than on
    # others, and a limit at 6 would turn a slow runner into a red PR
    timeout-minutes: ${{ inputs.everything && 25 || 8 }}
    env:
      BOX_PREBUILT: "1" # the app does not use box, so the setup leaves out Rust
    defaults:
      run: { working-directory: apps/macos }
    steps:
      # on a PR the checkout is the merge commit, so its first parent is the base branch and the diff to it is exactly
      # the PR's changes (pick.mjs --base HEAD^1)
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      # the page that draws Notes (apps/macos/web, over the Markdown package's build); the Notes tests render through it.
      # The native Markdown component's fonts and formula engines (apps/macos/tools/markdown/assets.mjs); its tests use them
      - uses: ./.github/actions/setup
        with:
          build: npm run build -w @yhnocoder/markdown && node apps/macos/web/build.mjs && node apps/macos/tools/markdown/assets.mjs
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
          swift --version
      # cloning tree-sitter and its grammars with their whole history took about a minute and a half on every run. The
      # regular full run on main is what fills the cache PRs start from: a cache saved on the default branch is readable
      # by every PR's run
      - uses: actions/cache@v5
        with:
          path: |
            apps/macos/.build/repositories
            apps/macos/.build/checkouts
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}
      # (trial) the products of an earlier build, so that only what changed since is compiled again
      - uses: actions/cache/restore@v5
        with:
          path: apps/macos/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
          restore-keys: swift-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-
      # a checkout gives every file the time of the checkout, which the build takes for a change to all of them: each
      # tracked file gets a time made from its content instead, the same on every run until the file changes
      - name: Give the sources the same times on every checkout
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s -z . | node -e '
            const fs = require("node:fs");
            for (const entry of fs.readFileSync(0, "utf8").split("\0").filter(Boolean)) {
              const [meta, file] = entry.split("\t");
              const at = 978307200 + Number.parseInt(meta.split(" ")[1].slice(0, 7), 16);
              fs.utimesSync(file, at, at);
            }'
          du -sh .build 2>/dev/null || true
      # one build of the app, its tools and the tests: swift build then swift test compiled twice
      - run: swift build --build-tests
      - run: du -sh .build .build/* 2>/dev/null | sort -h | tail -15
      # saved here, not at the end of the job, so that a failing test does not lose the build
      - uses: actions/cache/save@v5
        with:
          path: apps/macos/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
      # every test in the regular full run; on a PR the important ones and those of what it changed (Tests/tiers.json)
      - run: node tools/tests/pick.mjs ${{ inputs.everything && '--all' || '--base HEAD^1' }}
      - if: ${{ !cancelled() }}
        run: swift format lint --strict -r Sources Tests Package.swift

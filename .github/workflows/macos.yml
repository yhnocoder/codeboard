name: macOS
# The native Mac app (apps/macos): build, unit tests and swift-format's lint. It targets the latest macOS only, so it
# needs the image with Xcode 27 (a preview image on GitHub for now); the newest Xcode on it is selected, which is the
# toolchain the app is developed with.
# A PR runs two jobs, each meant to end in under 6 minutes for an ordinary change: app (one build, the important unit
# tests and those of what the PR changed, picked by tools/tests/pick.mjs from Tests/tiers.json, and the lint) and
# accept (smoke) (the acceptance scenarios in smoke.txt). A PR that changes much compiles and runs more and takes
# longer. The regular full run (regular.yml) calls this with everything: every unit test in app and
# the whole acceptance list in two accept jobs.
on:
  pull_request:
    paths: ["apps/macos/**", ".github/workflows/macos.yml"]
  workflow_call:
    inputs:
      everything:
        description: "Run every unit test and the whole acceptance list (the regular full run)"
        type: boolean
        default: false
    secrets:
      # a called workflow gets no secret it is not handed (see the private-package action)
      SHIYI_READ_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # The acceptance scenarios (apps/macos/tools/accept, ci.mjs): the app driven in its own process beside the web board
  # in headless Chromium, function only (nothing timed), three shots per scenario and side as an artifact. A PR runs the
  # few in smoke.txt in one job; the regular full run all of ci.txt, in two halves side by side
  accept:
    name: accept (${{ inputs.everything && matrix.shard || 'smoke' }})
    runs-on: xcode-27
    # as for app below, only against a job that hangs
    timeout-minutes: 30
    env:
      BOX_PREBUILT: "1" # the web side's host runs without box (Related by Meaning off), as the app does
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.everything && '["1/2", "2/2"]' || '["1/1"]') }}
    steps:
      - uses: actions/checkout@v6
      # the web board and its Markdown package, the app's Note page, and the fonts and formula engines the app's native
      # Markdown draws with (under a second)
      - uses: ./.github/actions/setup
        with:
          build: npm run build -w @yhnocoder/markdown && npm run build -w @codeboard/board && node apps/macos/web/build.mjs && node apps/macos/tools/markdown/assets.mjs
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
          swift --version
      # before anything resolves the package's dependencies
      - uses: ./.github/actions/private-package
        with: { token: "${{ secrets.SHIYI_READ_TOKEN }}" }
      # the last regular full run's build (see the app job): the driver is in it, so only what changed since is compiled
      - id: built
        uses: ./.github/actions/sealed-cache
        with:
          do: restore
          name: build
          paths: apps/macos/.build
          key: sealed-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: sealed-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      # without a kept build, the package clones (restored only: the app job saves them)
      - if: ${{ !steps.built.outputs.cache-matched-key }}
        uses: ./.github/actions/sealed-cache
        with:
          do: restore
          name: packages
          paths: |
            apps/macos/.build/repositories
            apps/macos/.build/checkouts
          key: sealed-swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
          restore-keys: sealed-swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      - run: node apps/macos/tools/ci/source-times.mjs
      - run: npx playwright-core install chromium
      # (the boards were built above: --skip-build leaves the web builds out; the driver is built, debug, either way)
      - run: >-
          node apps/macos/tools/accept/ci.mjs --list ${{ inputs.everything && 'ci.txt' || 'smoke.txt' }}
          --shard ${{ matrix.shard }} --skip-build
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accept-${{ strategy.job-index }}
          path: |
            apps/macos/.build-accept/*/*.png
            apps/macos/.build-accept/*/*/*.png
            apps/macos/.build-accept/*/*.txt
            apps/macos/.build-accept/*/*/log.txt
          # .build-accept starts with a dot, and upload-artifact leaves hidden folders out unless told
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  app:
    name: app
    runs-on: xcode-27
    # only against a job that hangs: a PR that changes much compiles and runs more and is not cut short (compiling
    # everything alone takes 2 to 4.5 minutes, depending on the runner), and the full run takes about 14 minutes
    timeout-minutes: 25
    env:
      BOX_PREBUILT: "1" # the app does not use box, so the setup leaves out Rust
    defaults:
      run: { working-directory: apps/macos }
    steps:
      # on a PR the checkout is the merge commit, so its first parent is the base branch and the diff to it is exactly
      # the PR's changes (pick.mjs --base HEAD^1)
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      # the page that draws Notes (apps/macos/web, over the Markdown package's build); the Notes tests render through it.
      # The native Markdown component's fonts and formula engines (apps/macos/tools/markdown/assets.mjs); its tests use them
      - uses: ./.github/actions/setup
        with:
          build: npm run build -w @yhnocoder/markdown && node apps/macos/web/build.mjs && node apps/macos/tools/markdown/assets.mjs
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
          swift --version
      # before anything resolves the package's dependencies
      - uses: ./.github/actions/private-package
        with: { token: "${{ secrets.SHIYI_READ_TOKEN }}" }
      # A PR starts from the build the last regular full run made on main (.build, about 500 MB), so it compiles only
      # what differs from it: compiling everything takes 2 to 4.5 minutes, depending on the runner. The regular run
      # itself starts from nothing, so a wrong kept build lasts 6 hours at most. A cache saved on the default branch is
      # readable by every PR's run. It is sealed with SHIYI_READ_TOKEN (the sealed-cache action), because the build
      # holds the private package and a pull request from a fork can restore caches saved on main
      - id: built
        if: ${{ !inputs.everything }}
        uses: ./.github/actions/sealed-cache
        with:
          do: restore
          name: build
          paths: apps/macos/.build
          key: sealed-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: sealed-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      # without a kept build: the clones of tree-sitter and its grammars with their whole history, which took about a
      # minute and a half to fetch on every run. They are saved after the build below when none were restored, under a
      # key of the run's own and found by its prefix, the newest first: clones sealed with a token that has since been
      # replaced cannot be opened, and would otherwise be found again in every run
      - id: packages
        if: ${{ !steps.built.outputs.cache-matched-key }}
        uses: ./.github/actions/sealed-cache
        with:
          do: restore
          name: packages
          paths: |
            apps/macos/.build/repositories
            apps/macos/.build/checkouts
          key: sealed-swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
          restore-keys: sealed-swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      # the times the kept build saw on the sources (source-times.mjs), or everything would be compiled again
      - run: node tools/ci/source-times.mjs
      # one build of the app, its tools and the tests: swift build then swift test compiled twice
      - run: swift build --build-tests
      # saved here, not at the end of the job, so that a failing test does not lose the build
      - if: ${{ inputs.everything }}
        uses: ./.github/actions/sealed-cache
        with:
          do: save
          name: build
          paths: apps/macos/.build
          key: sealed-build-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.sha }}
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      - if: ${{ steps.packages.outcome == 'success' && !steps.packages.outputs.cache-matched-key }}
        uses: ./.github/actions/sealed-cache
        with:
          do: save
          name: packages
          paths: |
            apps/macos/.build/repositories
            apps/macos/.build/checkouts
          key: sealed-swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
          secret: ${{ secrets.SHIYI_READ_TOKEN }}
      # every test in the regular full run; on a PR the important ones and those of what it changed (Tests/tiers.json)
      - run: node tools/tests/pick.mjs ${{ inputs.everything && '--all' || '--base HEAD^1' }}
      - if: ${{ !cancelled() }}
        run: swift format lint --strict -r Sources Tests Package.swift

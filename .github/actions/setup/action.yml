name: Setup
description: Node 22 with npm 12, the npm cache, Rust with its build cache (packages/box), npm ci and a build of the checked-out tree (or of the tree in `dir`)
inputs:
  dir:
    description: Directory of the checkout to install and build
    default: .
  build:
    description: The build command (by default everything; the root build starts with @yhnocoder/markdown, which the board and the demo use)
    default: npm run build
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with: { node-version: 22, cache: npm, cache-dependency-path: "${{ inputs.dir }}/package-lock.json" }
    - shell: bash
      run: npm i -g npm@12.2.1
    # box (packages/box, the index service behind Related by Meaning) is Rust: the full build compiles it, incrementally from the cache
    - uses: dtolnay/rust-toolchain@stable
      with: { components: clippy }
    - uses: Swatinem/rust-cache@v2
      with: { workspaces: "${{ inputs.dir }}/packages/box", cache-on-failure: true }
    - shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        BUILD: ${{ inputs.build }}
      run: npm ci --no-audit --no-fund && bash -c "$BUILD"

[workspace]
# core: the index (box-core); the service (this package) and the bindings (ffi: the C ABI the Swift package wraps; node:
# the Node addon) are thin layers over it. The Node addon only links inside Node, so plain cargo test leaves it out
members = [".", "core", "ffi", "node"]
default-members = [".", "core", "ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "box"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A local knowledge index: items cut into pieces, embedded by a model the user runs, searched by meaning"
publish = false

[lib]
name = "boxlib"
path = "src/lib.rs"

[[bin]]
name = "box"
path = "src/main.rs"

[dependencies]
box-core = { path = "core" }
dirs = "7.0.0"
getrandom = "0.4.3"
interprocess = "2.4.7"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# the C++ of the approximate index and the full-text index are slow unoptimized, also in tests
[profile.dev.package.usearch]
opt-level = 3
[profile.dev.package.tantivy]
opt-level = 3

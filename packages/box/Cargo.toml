[package]
name = "box"
version = "0.1.0"
edition = "2024"
description = "A local knowledge index: items cut into pieces, embedded by a model the user runs, searched by meaning"
license = "MIT"
publish = false

[lib]
name = "boxlib"
path = "src/lib.rs"

[[bin]]
name = "box"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
dirs = "7.0.0"
getrandom = "0.4.3"
half = "2.7.1"
interprocess = "2.4.7"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
ureq = "3.5.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package]
name = "box-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "box's index as a Node addon (napi-rs), for single-process Node tools"
publish = false

[lib]
name = "box_node"
crate-type = ["cdylib"]

[dependencies]
box-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2"

[package]
name = "box-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "box's index behind a C ABI (JSON in, JSON out), for the Swift package and any other language"
publish = false

[lib]
name = "box_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
rerank = ["box-core/rerank"]

[dependencies]
box-core = { path = "../core" }
serde_json = "1.0.154"

[dev-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

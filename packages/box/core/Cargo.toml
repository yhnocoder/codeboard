[package]
name = "box-core"
version.workspace = true
edition.workspace = true
description = "box's index in one process: chunking, embedding, storage and search, used by the service and the bindings"
license.workspace = true
publish = false

[lib]
name = "box_core"

[dependencies]
blake3 = "1.8.7"
half = "2.7.1"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
ureq = "3.5.1"
